// ─── Структурные раскладки рядов (эксперименты «как таблица Менделеева») ───
// Разрыв ряда ПЕРЕД сурой sid (только мусхафный порядок): null — нет,
// строка — подпись разделителя ("" — просто перенос без подписи).
// «Фатиха особняком» — отдельный первый ряд (как водород);

function qtBreakBefore(sid){
  const r=QT.rows;
  if(r==="fatiha")return sid===2?"":null;
  if(r==="manzil")return ({2:"манзиль 1 · 3 суры",5:"манзиль 2 · 5 сур",10:"манзиль 3 · 7 сур",17:"манзиль 4 · 9 сур",26:"манзиль 5 · 11 сур",37:"манзиль 6 · 13 сур",50:"манзиль 7 · 65 сур"})[sid]??null;
  if(r==="period")return ({2:"ат-тивал · длинные",10:"аль-миун и аль-масани",50:"муфассаль · длинный",78:"муфассаль · средний",93:"муфассаль · короткий"})[sid]??null;
  return null;
}
function qtSurasHTML(){

    cells+=`<div class="hfz-cell ${focus?"focus":""} ${m===false?"hfo-dim":""}" onclick="goSurah(${su.id})" title="${su.id}. ${escAttr(su.ru)} · ${su.n} аятов — открыть${m?` · ${escAttr(m.title)}`:""}">

function hifzMapHTML(){

    return `<div class="prog-card"><div class="hf-muted">Границы джузов не загрузились (нет сети?) — карта и охват недоступны.</div></div>`;
  const agg=hifzAggAll();                                  // единственный пересчёт долей на рендер

  // Тип охвата: ДЖУЗ (+ сужение сурой и аятами) либо СУРЫ списком. Список нужен

  const parsed=isL?hifzParseSuras(sc.list):null;

  }else{
    const juzOpts=Array.from({length:30},(_,i)=>`<option value="${i+1}" ${i+1===sc.juz?"selected":""}>Джуз ${i+1}</option>`).join("");
    const inJuz=hifzJuzRange(sc.juz);
    const suraOpts=[`<option value="0">все суры</option>`];
    for(let s=inJuz.from.s;s<=inJuz.to.s;s++){const su=SURAHS.find(x=>x.id===s);if(su)suraOpts.push(`<option value="${s}" ${s===sc.surah?"selected":""}>${s}. ${esc(su.ru)}</option>`);}
    const sr=hifzScopeSuras();

    picker=`<select onchange="hifzSetScope('juz',this.value)">${juzOpts}</select>

    ?`<div class="hf-muted" style="margin-top:7px;color:#c0392b">Не понял: ${parsed.bad.map(b=>"«"+esc(b)+"»").join(", ")} — сура задаётся числом 1–114.</div>`:"";
  const listNote=isL&&suras.length

      <span><span class="sw" style="background:rgba(224,160,48,.42)"></span>проверено, в работе</span>
      <span style="margin-left:6px">контур = декларировано:</span>
      <span><span class="sw" style="border:2px solid #2ea06e"></span>знаю</span>
      <span><span class="sw" style="border:2px solid #e0a030"></span>нетвёрдо</span>
      <span><span class="sw" style="border:2px solid #e05252"></span>не знаю</span>

  const hint=z.level===3?"":`<div class="hf-muted" style="margin-top:7px">${z.level===1?"Тап по джузу — к его сурам.":"Тап по суре — её аятная карта; «Назад» поднимает на уровень выше."}</div>`;
  const overlay=z.level<3?hfoChipsHTML():"";               // оверлей-фильтры — только на обзорных уровнях

function hifzSuraHTML(rng){
  const c=hifzRangeCounts(rng.surah,rng.from,rng.to);
  const mastered=c.mast===c.n;                            // полностью зелёная — не разворачиваем
  const decl=Progress.hifzSuraDecl()[rng.surah]||null;
  const declBtn=(lv,cls,lab)=>`<button class="${cls} ${decl===lv?"on":""}" onclick="hifzDecl(${rng.surah},'${lv}')">${lab}</button>`;
  const seg=(n,color)=>n?`<i style="width:${(n/c.n*100).toFixed(2)}%;background:${color}"></i>`:"";
  const bar=`<div class="hf-bar" style="margin-top:7px">${seg(c.mast,"#2ea06e")}${seg(c.strong,"rgba(46,160,110,.55)")}${seg(c.mid,"#e0a030")}${seg(c.weak,"#e05252")}</div>`;
  const open=!!HF.open[rng.surah]&&!mastered;
  let heat="";
  if(open){
    heat=`<div class="hf-heat">`+hifzUnits(rng).map(u=>{
      let cls="",dcl=null,rank=n=>n==="no"?3:n==="shaky"?2:n==="know"?1:0;
      let weak=0,mid=0,untested=0,strong=0;
      const A=Progress.hifzAyahs();
      for(let a=u.from;a<=u.to;a++){
        const st=Progress.hifzStage(rng.surah+":"+a);
        if(st==="weak")weak++;else if(st==="mid")mid++;else if(st==="strong")strong++;else if(st!=="mastered")untested++;
        const d=(A[rng.surah+":"+a]||{}).declared;if(rank(d)>rank(dcl))dcl=d;   // контур — по «худшей» декларации
      }
      if(weak)cls="v-weak";else if(mid)cls="v-mid";else if(untested)cls="";else if(strong)cls="v-strong";else cls="v-mast";
      if(dcl)cls+=" d-"+dcl;
      const lab=u.from===u.to?u.from:(u.from+"–"+u.to);
      // тап по блоку — цикл декларации ЭТОГО блока (не всей суры)
      return `<div class="hf-cell ${cls}" onclick="hifzCellDecl(${rng.surah},${u.from},${u.to})" title="${rng.surah}:${u.from}${u.from===u.to?"":"–"+u.to} · тап: знаю → нетвёрдо → не знаю → снять">${lab}</div>`;
    }).join("")+`</div><div class="hf-muted" style="margin-top:6px">Тап по блоку — пометить его: знаю → нетвёрдо → не знаю → снять.</div>`;
  }
  return `<div class="hf-sura ${mastered?"mastered":""}">
    <div class="hf-sura-head">
      <span class="hf-sura-name" onclick="hifzSuraToggle(${rng.surah})">${mastered?"✅":open?"▼":"▶"} ${rng.surah}. ${esc(rng.su.ru)} <small>${rng.from>1||rng.to<rng.su.n?`аяты ${rng.from}–${rng.to}`:rng.su.n+" аятов"}</small></span>
      ${mastered?"":`<button class="hf-go" onclick="hifzQuizSura(${rng.surah})" title="Проверить эту суру">🎯</button>`}
      <span class="hf-decl">${declBtn("know","k","знаю")}${declBtn("shaky","s","нетвёрдо")}${declBtn("no","n","не знаю")}</span>
    </div>
    ${mastered?`<div class="hf-muted" style="margin-top:5px">Закреплено полностью — в пул проверки не входит.</div>`:bar+heat}
  </div>`;
}
function hifzSuraToggle(s){
  const rng=hifzScopeSuras().find(r=>r.surah===s);if(!rng)return;
  const c=hifzRangeCounts(s,rng.from,rng.to);
  if(c.mast===c.n)return;                                  // зелёные суры не разворачиваем (не тратим внимание)
  HF.open[s]=!HF.open[s];renderHifz();
}
// Декларация — переключатель с «отжатием»: повторный тап по активному уровню снимает её.
function hifzDecl(s,lv){
  const cur=Progress.hifzSuraDecl()[s]||null;
  Progress.hifzDeclareSurah(s,cur===lv?null:lv);
  renderHifz();
}
// Тап по блоку теплокарты — цикл декларации ДИАПАЗОНА: нет → знаю → нетвёрдо →
// не знаю → нет. Стартуем от единого уровня блока (смешанный блок = «нет»).
function hifzCellDecl(s,from,to){
  const A=Progress.hifzAyahs();let uni;
  for(let a=from;a<=to;a++){const d=(A[s+":"+a]||{}).declared||null;
    if(uni===undefined)uni=d;else if(uni!==d){uni=null;break;}}
  const order=[null,"know","shaky","no"];
  Progress.hifzDeclareRange(s,from,to,order[(order.indexOf(uni||null)+1)%4]);
  renderHifz();
}
// 🎯 из строки суры: сузить охват до этой суры и сразу начать проверку.
function hifzQuizSura(s){
  HF.scope={kind:"suras",list:String(s)};           // сура целиком, даже если она вне текущего джуза
  Progress.hifzSetSettings({scope:HF.scope});
  HF.sess=null;hifzTab('quiz');
}

function hifzQuizHTML(){
  const S=Progress.hifzSettings();
  const ruName=(CONFIG.tafsirs.find(t=>t.id===hifzRuId())||{}).name||"нет перевода";
  const set=`<div class="prog-card"><h3>Настройки проверки</h3><div class="hf-set">
    <span>Показ:</span><div class="prog-seg"><button class="${S.lang==="ar"?"on":""}" onclick="hifzSet('lang','ar')">арабский</button><button class="${S.lang==="ru"?"on":""}" onclick="hifzSet('lang','ru')" title="${escAttr(ruName)}">перевод</button></div>
    <span>Цепочка:</span><div class="prog-step"><button onclick="hifzSet('K',${Math.max(1,(S.K||4)-1)})">−</button><b>${S.K||4}</b><button onclick="hifzSet('K',${Math.min(10,(S.K||4)+1)})">+</button></div>
    <label title="Сложный режим: вспоминать предыдущие аяты"><input type="checkbox" ${S.backward?"checked":""} onchange="hifzSet('backward',this.checked)"> назад</label>
    <label title="Адрес (сура и номер аята) спрятан до нажатия — вспомнить, откуда аят, тоже часть проверки. Снимите галочку, если проверяете только продолжение: у аятов-рефренов без адреса нет одного ответа."><input type="checkbox" ${S.hideRef===false?"":"checked"} onchange="hifzSet('hideRef',this.checked)"> скрывать адрес</label>
    <label title="По умолчанию ВЫКЛ: проверка памяти — не чтение, серию и дневную цель не кормит"><input type="checkbox" ${S.feedActivity?"checked":""} onchange="hifzSet('feedActivity',this.checked)"> засчитывать в дневную цель</label>
  </div><div class="hf-muted" style="margin-top:7px">Изменения длины/направления применяются со следующей точки.</div></div>`;
  const sess=HF.sess;
  if(!sess)return set;
  const stats=`<div class="hf-muted" style="margin:2px 0 0">Раунд ${sess.n} · уверенно ${sess.g[2]} · с трудом ${sess.g[1]} · не помню ${sess.g[0]}</div>`;
  if(sess.empty)return set+`<div class="prog-card"><h3>Пул пуст</h3><div class="hf-muted">Всё в охвате подтверждённо освоено 🎉 — либо расширьте охват на карте.</div>${stats}
    <button class="prog-cont" onclick="hifzTab('map')">← К карте</button></div>`;
  const R=sess.round;if(!R)return set;
  if(sess.loading)return set+`<div class="prog-card"><div class="hf-muted">Загружаю текст…</div></div>`;
  const S2=Progress.hifzSettings();
  const dirWord=S2.backward?"НАЗАД":"вперёд";
  const first=R.chain[0].split(":"),fs=+first[0];
  // Привязка сура:аят — сама по себе предмет проверки («откуда этот аят?»), поэтому
  // по умолчанию СКРЫТА и открывается ТОЛЬКО своей кнопкой: раскрытие цепочки её не
  // выдаёт (продолжение можно проверить, всё ещё не зная суру). Настройка `hideRef`
  // возвращает прежнее поведение: адрес виден сразу — это нужно, когда проверяют
  // только продолжение, а аят-рефрен без адреса неоднозначен.
  const refOpen=S2.hideRef===false||R.refShown;
  const refHTML=(s,tail)=>refOpen
    ? `<div class="hf-ref">${esc(hifzSuName(s))} · ${tail}</div>`
    : `<button class="hf-ref-hide" onclick="hifzShowRef()" title="Сначала вспомните, откуда этот аят">🙈 Какая это сура? · 👁 показать суру</button>`;
  let prompt;
  if(R.start){
    const sp=R.start.split(":"),ss=+sp[0],sa=+sp[1];
    prompt=`${refHTML(ss,ss+":"+sa)}
      ${S2.lang==="ar"?`<div class="hf-ar arabic-main">${esc(getArabicFromCache(ss,sa))}</div>`:`<div class="hf-ru">${esc(hifzRuText(ss,sa))}</div>`}
      <div class="hf-muted" style="margin-top:9px">Продолжите по памяти <b>${dirWord}</b>: ${R.chain.length} ${R.chain.length===1?"аят":R.chain.length<5?"аята":"аятов"}.</div>`;
  }else{
    prompt=`${refHTML(fs,R.chain[0]+(R.chain.length>1?" …":""))}
      <div class="hf-muted">Точка без соседа в охвате — вспомните ${R.chain.length===1?"этот аят":"аяты с этого места"} по памяти.</div>`;
  }
  let bodyHtml;
  if(!R.revealed){
    bodyHtml=`<button class="prog-cont" onclick="hifzReveal()">👁 Раскрыть цепочку</button>`;
  }else{
    const items=R.chain.map((vk,i)=>{
      const p=vk.split(":"),s=+p[0],a=+p[1];
      const ar=`<div class="hf-ar arabic-main">${esc(getArabicFromCache(s,a))}</div>`;
      const ru=hifzRuText(s,a);
      const main=S2.lang==="ar"?ar+(ru?`<div class="hf-ru sec">${esc(ru)}</div>`:""):`<div class="hf-ru">${esc(ru)||"<i>нет текста перевода</i>"}</div>`+ar;
      const g=R.grades[i];
      const btn=(gv,lab)=>`<button class="g${gv} ${g===gv?"on":""}" onclick="hifzGrade(${i},${gv})">${lab}</button>`;
      // Номер аята в звене — тот же адрес: пока он скрыт, звенья нумеруем по порядку,
      // иначе «83:1» над первым же аятом цепочки выдаёт суру в обход кнопки.
      return `<div class="hf-chain-item"><div class="hf-ref">${refOpen?`${esc(hifzSuName(s))} · ${s}:${a}`:`звено ${i+1}`}</div>${main}
        <div class="hf-grade">${btn(0,"не помню")}${btn(1,"с трудом")}${btn(2,"уверенно")}</div></div>`;
    }).join("");
    const graded=Object.keys(R.grades).length;
    // Дубль кнопки адреса ПОД цепочкой: суру нередко узнаёшь только по последнему
    // аяту — возвращаться к верхней кнопке ради этого не нужно.
    const refBot=refOpen?"":`<button class="hf-ref-hide bot" onclick="hifzShowRef()" title="Сначала вспомните, откуда этот аят">🙈 Какая это сура? · 👁 показать суру</button>`;
    bodyHtml=items+refBot+`<div class="prog-btns" style="margin-top:13px">
      <button class="prog-cont" style="margin-top:0" onclick="hifzNextRound()">Следующая точка →</button>
      <button onclick="hifzTab('map')">К карте</button></div>
      ${graded<R.chain.length?`<div class="hf-muted" style="margin-top:7px">Оценено ${graded} из ${R.chain.length} — неоценённые звенья в SRS не запишутся.</div>`
        :`<div class="hf-muted" style="margin-top:7px">Ошиблись кнопкой? Просто нажмите другую — оценка заменится.</div>`}`;
  }
  return set+`<div class="prog-card"><h3>Точка входа</h3>${stats}<div class="hf-quiz-card">${prompt}</div>${bodyHtml}</div>`;
}
function hifzSet(k,v){
  if(k==="K")v=Math.max(1,Math.min(10,+v||4));
  Progress.hifzSetSettings({[k]:v});
  renderHifz();
}

// ============================================================
// МОДУЛЬ «СКОРОСТЬ ЧТЕНИЯ» — UI слоя SPEED (осознанные замеры беглости).
// ------------------------------------------------------------
// ОТДЕЛЬНЫЙ от пассивного таймера привычки: явные СТАРТ/ФИНИШ. Пишет только
// через контракт store (startPageRun/finishPageRun/…), localStorage не трогает.
// Грузится лениво: инициализация (qpcMeta, пословный слой) — при открытии
// экрана; ридер о модуле НЕ знает (вход — с экрана прогресса; секундомер-пилюля
// — собственный DOM модуля поверх страницы, ни один рендер-путь чтения его
// не касается). Рамка: цель — беглость до комфортного уровня и личный рекорд
// страницы, НЕ гонка на максимум.
// ============================================================
let spdOpen=false;
const SPD={result:null,timer:null};

async function openSpeed(){
  Progress.ensureInit();
  if(typeof loadQpcMeta==="function")await loadQpcMeta();  // границы страниц (аяты страницы, verseToPage)
  _progPageIdx=null;
  let ov=document.getElementById("speedOvl");
  if(!ov){ov=document.createElement("div");ov.id="speedOvl";ov.className="about-ovl";ov.onclick=e=>{if(e.target===ov)closeSpeed();};document.body.appendChild(ov);}
  ov.innerHTML=`<div class="about-box prog-box" role="dialog" aria-modal="true"><button class="about-close" onclick="closeSpeed()" aria-label="Закрыть">×</button><div id="spdBody"></div></div>`;
  ov.style.display="flex";ov.scrollTop=0;spdOpen=true;
  renderSpeed();
  pushOverlay();
}
function spdOvlOpen(){const ov=document.getElementById("speedOvl");return !!(ov&&ov.style.display!=="none");}
function closeSpeed(){const ov=document.getElementById("speedOvl");if(ov)ov.style.display="none";spdOpen=false;consumeOverlay();}
// Переход «Прогресс → Скорость»: как progOpenHifz — переиспользуем overlay-запись.
function progOpenSpeed(){const ov=document.getElementById("progressOvl");if(ov)ov.style.display="none";progressOpen=false;openSpeed();}

// ─── Данные страницы (якорь verse_key; страница только производится) ───
function spdOrdToVk(o){                                   // глобальный ординал 1..6236 → "сура:аят"
  let s=1;while(s<114&&PROG_AYAH_OFFSET[s]<o)s++;
  return s+":"+(o-PROG_AYAH_OFFSET[s-1]);
}
function spdPageVks(p){                                   // аяты страницы p по qpcMeta.pageStart
  const ps=qpcMeta&&qpcMeta.pageStart;if(!ps||!ps[p])return [];
  const o1=progVerseOrdinal(ps[p].surah+":"+ps[p].ayah);
  const o2=ps[p+1]?progVerseOrdinal(ps[p+1].surah+":"+ps[p+1].ayah)-1:PROG_AYAH_OFFSET[114];
  const vks=[];for(let o=o1;o<=o2;o++)vks.push(spdOrdToVk(o));
  return vks;
}
// wordCount — из ПОСЛОВНОГО слоя мусхафа (wbw/words, число слов аята = число
// ключей); фолбэк, если пословных данных для суры нет, — счёт слов арабского текста.
async function spdPageWords(vks){
  const bySura={};for(const vk of vks){const q=vk.split(":");(bySura[q[0]]=bySura[q[0]]||[]).push(+q[1]);}
  let count=0;
  for(const s in bySura){
    const words=await loadWbwWords(+s);
    const ch=words?null:await loadChunk("_arabic",+s);
    for(const a of bySura[s]){
      if(words&&words[a])count+=Object.keys(words[a]).length;
      else if(ch&&ch[String(a)])count+=String(ch[String(a)]).trim().split(/\s+/).length;
    }
  }
  return count;
}
// Страница замера: в мусхафе — текущая; вне его — страница позиции resume
// (свежая: saveLastPos обновляет её при чтении).
function spdCurPage(){
  if(ST.pageMode)return ST.mushafPage||1;
  const res=Progress.getResume();
  return res?(Progress.verseToPage(res.verseKey,res.mushafId)||1):1;
}

// ─── Замер ───
async function spdStart(){
  const p=spdCurPage();
  const vks=spdPageVks(p);
  if(!vks.length){renderSpeed();return;}                  // нет границ страниц (нет сети) — не стартуем
  const wc=await spdPageWords(vks);
  // Замер идёт по странице мусхафа. Переход в режим страницы ОБЯЗАТЕЛЬНО дождаться
  // (togglePageMode асинхронный: ST.pageMode встаёт после await loadQpcMeta) —
  // иначе страж пилюли увидит «не мусхаф» и сбросит только что начатый замер.
  if(!ST.pageMode){
    ST.homeMode=false;ST.srcMode=false;ST.bookIntro=false;
    await togglePageMode();
  }
  if((ST.mushafPage||1)!==p)await gotoPage(p);
  Progress.startPageRun(p,{wordCount:wc,verseKeys:vks});
  SPD.result=null;
  closeSpeed();
  spdPillShow();
}
function spdFmt(sec){return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");}
function spdPillShow(){
  let el=document.getElementById("spdPill");
  if(!el){el=document.createElement("div");el.id="spdPill";el.className="spd-pill";document.body.appendChild(el);}
  el.innerHTML=`<span class="t" id="spdPillT">0:00</span><span class="pg" id="spdPillP"></span>
    <button class="fin" onclick="spdFinish()">Финиш</button><button onclick="spdCancelRun()" title="Отменить замер (не запишется)">✕</button>`;
  el.style.display="flex";
  clearInterval(SPD.timer);SPD.timer=setInterval(spdPillTick,500);
  spdPillTick();
}
function spdPillHide(){const el=document.getElementById("spdPill");if(el)el.style.display="none";clearInterval(SPD.timer);SPD.timer=null;}
function spdPillTick(){
  const el=document.getElementById("spdPill");if(!el)return;
  const ri=Progress.runInfo();
  if(!ri){spdPillHide();return;}
  if(!ST.pageMode||(ST.mushafPage||1)!==ri.pageId){       // ушли со страницы — замер испорчен, сбрасываем
    Progress.cancelPageRun();
    el.innerHTML=`<span class="pg">Замер сброшен — страница сменилась</span>`;
    clearInterval(SPD.timer);SPD.timer=null;
    setTimeout(spdPillHide,2500);
    return;
  }
  el.classList.toggle("paused",!!ri.paused);
  const t=document.getElementById("spdPillT"),pp=document.getElementById("spdPillP");
  if(t)t.textContent=(ri.paused?"⏸ ":"")+spdFmt(ri.seconds);
  if(pp)pp.textContent="стр. "+ri.pageId;
}
function spdFinish(){
  const res=Progress.finishPageRun();
  spdPillHide();
  SPD.result=res;
  openSpeed();                                            // показать результат на экране скорости
}
function spdCancelRun(){Progress.cancelPageRun();spdPillHide();}  // отмена осознанно теряет секунды (в привычку не идут)

// ─── Рендер экрана ───
// Мягкая зона вокруг целевого WPM (±15%): без «рекорда любой ценой».
function spdZoneChip(wpm,target){
  if(!target)return "";
  if(wpm<target*0.85)return `<div style="margin-top:8px"><span class="spd-zone">ниже зоны — спокойно: беглость набирается повторами</span></div>`;
  if(wpm>target*1.15)return `<div style="margin-top:8px"><span class="spd-zone">выше зоны — не гонитесь, главное смысл</span></div>`;
  return `<div style="margin-top:8px"><span class="spd-zone in">в комфортной зоне 🎯</span></div>`;
}
function renderSpeed(){
  const body=document.getElementById("spdBody");if(!body)return;
  const S=Progress.speedSettings();
  // — результат только что завершённого замера —
  let resCard="";
  if(SPD.result){
    const R=SPD.result;
    if(R.tooShort){
      resCard=`<div class="prog-card"><h3>Замер не засчитан</h3><div class="hf-muted">Слишком короткий (меньше 5 секунд) — так страница не читается; в лог не пишем.</div></div>`;
    }else if(R.run){
      const r=R.run,prev=R.prev;
      const dBest=prev.count?Math.round((r.wpm-prev.bestWpm)*10)/10:null;
      const dAvg=prev.count?Math.round((r.wpm-prev.avgWpm)*10)/10:null;
      resCard=`<div class="prog-card"><h3>Результат · страница ${r.pageId}</h3>
        <div class="spd-big">${spdFmt(r.seconds)} <small>·</small> ${r.wpm} <small>WPM · ${r.wordCount} слов</small></div>
        ${R.isRecord
          ?`<div class="spd-rec" style="margin-top:6px">🏆 Личный рекорд этой страницы${dBest!=null?` (+${dBest} WPM)`:" — первый замер"}</div>`
          :`<div class="hf-muted" style="margin-top:6px">Рекорд страницы: <b>${prev.bestWpm}</b> WPM · к среднему: ${dAvg>=0?"+":""}${dAvg} WPM</div>`}
        ${spdZoneChip(r.wpm,S.targetWpm)}</div>`;
    }
  }
  // — текущая страница: личный рекорд run-за-run (ядро метрики) —
  const p=spdCurPage();
  const pb=Progress.getPageBest(p);
  const cur=`<div class="prog-card"><h3>Замер · страница ${p}</h3>
    ${pb.count?`<div class="spd-row">
      <div class="spd-kpi"><b>${pb.bestWpm}</b><span>рекорд WPM</span></div>
      <div class="spd-kpi"><b>${spdFmt(pb.bestSeconds)}</b><span>лучшее время</span></div>
      <div class="spd-kpi"><b>${pb.avgWpm}</b><span>средний WPM</span></div>
      <div class="spd-kpi"><b>${pb.count}</b><span>замер${pb.count===1?"":pb.count<5?"а":"ов"}</span></div>
      <div class="spd-kpi"><button class="hf-go" onclick="spdClearPage(${p})" title="Стереть историю замеров этой страницы (рекорд уйдёт вместе с ней)">сбросить страницу</button></div></div>`
      :`<div class="hf-muted">Эта страница ещё не замерялась. Личный рекорд по конкретной странице — честная метрика: перечитывание фиксирует её сложность.</div>`}
    <button class="prog-cont" onclick="spdStart()">▶ ${ST.pageMode?"Начать замер":"Открыть мусхаф и начать замер"}</button>
    <div class="hf-muted" style="margin-top:8px">Явные старт/финиш; при простое и скрытой вкладке секундомер сам встаёт на паузу. Финиш зачтёт время и аяты в дневную цель.</div></div>`;
  // — комфортный уровень —
  const goal=`<div class="prog-card"><h3>Комфортный уровень</h3>
    <div class="hf-muted">Цель — беглость до комфортного уровня и личные рекорды страниц, не гонка на максимум. Выход тренда на плато — норма, не подгоняйте себя.</div>
    <div class="hf-set" style="margin-top:10px"><span>Целевой WPM:</span>
      <div class="prog-step"><button onclick="spdGoal(-5)">−</button><b>${S.targetWpm||"—"}</b><button onclick="spdGoal(5)">+</button></div>
      ${S.targetWpm?`<span class="hf-muted">зона комфорта ±15%</span><button class="hf-go" onclick="spdGoalOff()">снять</button>`:`<span class="hf-muted">не задан</span>`}
    </div></div>`;
  // — общий тренд по неделям (обзорный вид, шумнее личных рекордов) —
  const tr=Progress.getSpeedTrend();
  const maxW=Math.max(1,...tr.map(w=>w.avgWpm));
  const bars=tr.map(w=>`<div class="c" title="Неделя от ${w.week}: ${w.runs?w.avgWpm+" WPM · "+w.runs+" замеров":"нет замеров"}">
    <div class="val">${w.avgWpm||""}</div><div class="bar" style="height:${w.avgWpm?6+(w.avgWpm/maxW)*60:2}px"></div>
    <div class="lab">${w.week.slice(5)}</div></div>`).join("");
  const trend=`<div class="prog-card"><h3>Тренд WPM по неделям</h3>
    <div class="hf-muted">Обзорный вид: он шумнее рекордов страниц (страницы разной сложности усредняются).</div>
    <div class="spd-trend">${bars}</div></div>`;
  // — последние замеры —
  const runs=Progress.speedRuns().slice(-8).reverse();
  const rows=runs.map(r=>{
    const d=new Date(r.ts);
    const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const best=Progress.getPageBest(r.pageId).bestWpm===r.wpm?` <span class="spd-rec">🏆</span>`:"";
    return `<div class="r"><span>${ds}</span><span>стр. <b>${r.pageId}</b></span><span>${spdFmt(r.seconds)}</span><span><b>${r.wpm}</b> WPM${best}</span></div>`;
  }).join("");

    +resCard+cur+goal+trend+last;

// --- Быстрые ссылки на Главной (пользователь правит текстом) ---
// Грамматика: элементы через запятую/перенос строки. «N» = вся сура; «N/A» = аят;
// «N/A-B» = диапазон (открывается на A); допускается «:» вместо «/». После ссылки
// можно дописать свою подпись: «36 Сердце Корана». Без подписи — авто-имя суры.
const DEFAULT_QUICK="1, 2/255, 2/285-286, 18, 36, 55, 56, 67, 112, 113, 114";
function getQuickRaw(){const v=gs("quickLinks",null);return v==null?DEFAULT_QUICK:v;}
function setQuickRaw(s){ss("quickLinks",s);}
function parseQuickLinks(raw){
  const out=[];
  for(let item of String(raw||"").split(/[,\n]/)){
    item=item.trim();if(!item)continue;
    const m=item.match(/^(\d+)(?:[\/:](\d+)(?:-(\d+))?)?\s*(.*)$/);
    if(!m)continue;
    const surah=+m[1];const su=SURAHS.find(s=>s.id===surah);if(!su)continue;
    let ayah=m[2]?+m[2]:null,to=m[3]?+m[3]:null;
    if(ayah&&(ayah<1||ayah>su.n))ayah=null;        // аят вне диапазона суры — игнорируем аят, оставляем суру
    if(to&&(to<=(ayah||0)||to>su.n))to=null;
    const label=(m[4]||"").trim();
    out.push({surah,ayah,to,label,su});
  }
  return out;
}
// Авто-подпись плитки быстрой ссылки (если пользователь не задал свою).
function quickLabel(q){
  if(q.label)return q.label;
  if(!q.ayah)return q.su.ru;                         // вся сура
  if(q.to)return `${q.su.ru} ${q.ayah}–${q.to}`;     // диапазон
  return `${q.su.ru} ${q.ayah}`;                      // один аят
}

// сведение ПРАВОК между устройствами — при слиянии побеждает более свежая
// версия. Не входит в SYNCED_KEYS: путешествует в блобе синка как _meta
// (personalDataObj), локально «грязным» синк не помечает.

// ЭКСПОРТ / ИМПОРТ ЛИЧНЫХ ДАННЫХ (заметки · закладки · теги · дерево тегов)
// Один .json для бэкапа/переноса между устройствами. Импорт — слияние.
// ============================================================
const AYKEY=/^\d+:\d+$/;                              // ключ «сура:аят»
let _pendingImport=null;                             // данные, ждущие выбора стратегии конфликта
function downloadJSON(obj,fname){

  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},150);
}
// Единый объект личных данных — общий для файлового экспорта и облачного синка.
function personalDataObj(){

    progress:Progress.exportState(),    // ХУК #4: прогресс в тот же единый бэкап, не параллельный файл
    _meta:getSyncMeta()};               // LWW-метки правок (для сведения правок между устройствами)
}

function importPersonalDataFile(input){

// Глубокое слияние дерева тегов по именам (новые ветки добавляются, существующие — рекурсивно).
function mergeTagTree(a,b){
  const out=(a||[]).map(n=>({name:n.name,children:mergeTagTree(n.children||[],[])}));
  for(const bn of (b||[])){
    const ex=out.find(n=>n.name===bn.name);
    if(ex)ex.children=mergeTagTree(ex.children,bn.children||[]);
    else out.push({name:bn.name,children:mergeTagTree(bn.children||[],[])});
  }
  return out;
}
// strategy для конфликтов заметок (один и тот же аят, другой текст): 'skip'|'append'|'replace'.
function applyImport(data,strategy){
  let added=0,changed=0;
  // strategy==="sync": облачное слияние по меткам времени (LWW) — свежая правка
  // побеждает; иначе (файловый импорт) — skip/append/replace как выбрал юзер.
  const lww=strategy==="sync";
  const lmeta=lww?getSyncMeta():null;
  const rmeta=(data&&data._meta)||{};
  // — заметки —
  const cur=getNotes(),imp=data.notes||{};
  for(const k in imp){
    if(!AYKEY.test(k)||typeof imp[k]!=="string")continue;
    if(!(k in cur)){cur[k]=imp[k];added++;if(lww)lmeta["notes:"+k]=rmeta["notes:"+k]||1;}
    else if(cur[k]!==imp[k]){
      if(lww){
        const rt=rmeta["notes:"+k]||0,lt=lmeta["notes:"+k]||0;
        if(rt>lt){cur[k]=imp[k];changed++;lmeta["notes:"+k]=rt;}   // облако новее — берём облачную версию
        // иначе локальная новее/равна — оставляем свою
      }
      else if(strategy==="replace"){cur[k]=imp[k];changed++;}
      else if(strategy==="append"){cur[k]=cur[k]+"\n\n---\n\n"+imp[k];changed++;}
      // 'skip' — оставляем свою
    }
  }
  ss("notes",cur);
  if(lww)ss("syncMeta",lmeta);
  // — закладки: добавляем недостающие, существующие не трогаем —
  const bm=getBookmarks(),ibm=data.bookmarks||{};let bmAdd=0;
  for(const k in ibm){if(AYKEY.test(k)&&!(k in bm)&&typeof ibm[k]==="string"){bm[k]=ibm[k];bmAdd++;}}
  setBookmarks(bm);
  // — теги аятов: объединяем списки путей —
  const at=getAyahTags(),iat=data.ayahTags||{};let tagAdd=0;
  for(const k in iat){
    if(!AYKEY.test(k)||!Array.isArray(iat[k]))continue;
    const set=new Set(at[k]||[]);const before=set.size;
    iat[k].forEach(p=>{if(typeof p==="string")set.add(p);});
    if(set.size){at[k]=[...set];tagAdd+=set.size-before;}
  }
  setAyahTags(at);
  // — дерево тегов —
  if(Array.isArray(data.tagTree))setTagTree(mergeTagTree(getTagTree(),data.tagTree));
  // — прогресс чтения (ХУК #4): слияние по датам внутри самого store —
  const progAdd=data.progress?Progress.importState(data.progress):0;
  return {added,changed,bmAdd,tagAdd,progAdd};
}
function showImportSummary(data){
  const ok=data&&typeof data==="object"&&(data.notes||data.bookmarks||data.ayahTags||data.tagTree||data.progress);
  if(!ok){openIOModal(`<div class="io-h">Импорт</div><div class="io-p">Не удалось распознать файл резервной копии. Нужен .json, созданный кнопкой «Экспорт».</div><div class="io-acts"><button class="home-btn prim" onclick="closeIOModal()">Закрыть</button></div>`);return;}

  for(const k in imp){if(!AYKEY.test(k))continue;if(!(k in cur))nNew++;else if(cur[k]!==imp[k])nConf++;}
  const bmN=Object.keys(data.bookmarks||{}).length,tagN=Object.keys(data.ayahTags||{}).length;
  const progN=(data.progress&&Array.isArray(data.progress.activityDays))?data.progress.activityDays.length:0;

  if(nConf){
    body+=`<div class="io-p">${nConf} заметок уже есть с другим текстом. Что с ними сделать?</div>
      <div class="io-acts io-wrap">
        <button class="home-btn" onclick="doImport('skip')">Оставить мои</button>
        <button class="home-btn" onclick="doImport('append')">Дописать обе</button>
        <button class="home-btn prim" onclick="doImport('replace')">Заменить импортом</button>
      </div>
      <div class="io-acts"><button class="home-btn ghost" onclick="closeIOModal()">Отмена</button></div>`;
  }else{
    body+=`<div class="io-acts"><button class="home-btn prim" onclick="doImport('skip')">Импортировать</button><button class="home-btn ghost" onclick="closeIOModal()">Отмена</button></div>`;

function doImport(strategy){

    <div class="io-sum">Заметок добавлено: <b>${r.added}</b>${r.changed?` · обновлено: <b>${r.changed}</b>`:""}${r.bmAdd?`<br>Закладок добавлено: ${r.bmAdd}`:""}${r.tagAdd?` · тегов добавлено: ${r.tagAdd}`:""}${r.progAdd?`<br>Дней прогресса объединено: ${r.progAdd}`:""}</div>

// ============================================================
// ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ (полуавто, доступ по коду) — Cloudflare Worker + KV.
// Пул при открытии + кнопка «Синхронизировать» + пуш при уходе со страницы.
// Слияние — applyImport('sync'): заметки сводятся по меткам времени (LWW —
// свежая правка побеждает, метки в блобе как _meta); закладки/теги/прогресс —
// объединяются (аддитивно). Удаления НЕ распространяются (компромисс: стёртая
// заметка может вернуться с другого устройства). Воркер тоже сливает на PUT
// (см. sync-worker/worker.js), поэтому фоновый пуш не затирает свежее чужое.
// Код синка — секрет и ключ, хранится локально (tl_syncCode), в блоб НЕ входит.
// ============================================================
function syncGetCode(){return gs("syncCode","");}
function syncSetCode(c){ss("syncCode",(c||"").trim());}
function syncGenCode(){
  const b=new Uint8Array(16);crypto.getRandomValues(b);
  return [...b].map(x=>x.toString(16).padStart(2,"0")).join("").replace(/(.{8})(?=.)/g,"$1-");
}
function syncConfigured(){return !!SYNC_ENDPOINT;}
function syncEnabled(){return syncConfigured()&&!!syncGetCode();}
function syncUrl(){return SYNC_ENDPOINT.replace(/\/+$/,"")+"/v1/"+encodeURIComponent(syncGetCode());}
function fmtSyncTime(iso){try{return new Date(iso).toLocaleString("ru",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
function syncStatusText(){
  const code=syncGetCode();
  if(!syncConfigured())return "Не настроена (нет адреса сервера)";
  if(!code)return "Код не задан";
  const short=code.slice(0,4)+"…"+code.slice(-4);
  return (_syncStatusMsg?_syncStatusMsg+" · ":"")+"код "+short;
}
function _syncMsg(m){_syncStatusMsg=m;const el=document.getElementById("syncStatusLine");if(el)el.textContent=syncStatusText();}
async function syncPull(silent){
  if(!syncEnabled())return null;
  try{
    const r=await fetch(syncUrl(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const data=await r.json();
    if(data&&data.empty){_syncMsg("облако пусто");return {empty:true};}
    applyImport(data,"sync");            // слияние по меткам времени (LWW): правки сходятся
    _syncMsg("загружено"+(data._updatedAt?" ("+fmtSyncTime(data._updatedAt)+")":""));
    if(!silent)render();
    return data;
  }catch(e){_syncMsg("ошибка загрузки");return null;}
}
async function syncPush(){
  if(!syncEnabled())return false;
  try{
    const r=await fetch(syncUrl(),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(personalDataObj())});
    if(!r.ok)throw new Error("HTTP "+r.status);
    _syncDirty=false;_syncMsg("отправлено "+fmtSyncTime(new Date().toISOString()));
    return true;
  }catch(e){_syncMsg("ошибка отправки");return false;}
}
let _syncBusy=false;
async function syncNow(){            // ручная кнопка: забрать → слить → отправить (устройства сходятся)
  if(_syncBusy)return;
  if(!syncConfigured()){_syncMsg("нет адреса сервера");return;}
  if(!syncGetCode()){syncSetup();return;}
  _syncBusy=true;_syncMsg("синхронизация…");
  try{await syncPull(true);await syncPush();render();}
  finally{_syncBusy=false;}
}
// АВТОСИНХРОНИЗАЦИЯ (кнопку ⟲ трогать не нужно):
// • автопуш через ~4 с после последней правки (страховка помимо пуша на закрытии);
// • автопул при ВОЗВРАТЕ к вкладке (не только при первом открытии), с троттлом.
let _syncPushT=null;
function scheduleSyncPush(){
  if(!syncEnabled())return;
  clearTimeout(_syncPushT);
  _syncPushT=setTimeout(()=>{if(_syncDirty&&!_syncBusy)syncPush();},4000);
}
let _lastPullAt=0;
function autoSyncPull(){
  if(!syncEnabled())return;
  const now=Date.now();
  if(now-_lastPullAt<15000)return;   // не дёргать чаще раза в 15 с
  _lastPullAt=now;
  syncPull(true).then(d=>{if(d&&!d.empty)render();});
}
function syncSetup(){                // модалка: создать/ввести код
  const cur=syncGetCode();
  openIOModal(`<div class="io-h">Код синхронизации</div>
    <div class="io-p">Один код связывает ваши устройства: создайте его на первом, введите на остальных. Кто знает код — видит ваши данные, храните его в тайне.</div>
    <input id="syncCodeInp" placeholder="код синхронизации" value="${escAttr(cur)}" autocomplete="off" spellcheck="false" style="width:100%;box-sizing:border-box;margin:8px 0;padding:9px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-family:monospace">
    <div class="io-acts io-wrap">
      <button class="home-btn" onclick="syncGenInto()">🎲 Создать новый</button>
      <button class="home-btn prim" onclick="syncSaveCode()">Сохранить</button>
    </div>
    <div class="io-acts"><button class="home-btn ghost" onclick="closeIOModal()">Отмена</button></div>`);
}
function syncGenInto(){const i=document.getElementById("syncCodeInp");if(i)i.value=syncGenCode();}
function syncSaveCode(){
  const i=document.getElementById("syncCodeInp");if(i)syncSetCode(i.value);
  closeIOModal();

}
// Пуш при уходе со страницы/сворачивании — только если было что менять.
// Возврат к вкладке (visible) — автопул, чтобы подхватить правки с другого устройства.
window.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){if(syncEnabled()&&_syncDirty)syncPush();}
  else if(document.visibilityState==="visible"){autoSyncPull();}
});
window.addEventListener("focus",()=>autoSyncPull());
window.addEventListener("pagehide",()=>{
  if(syncEnabled()&&_syncDirty&&navigator.sendBeacon){
    try{navigator.sendBeacon(syncUrl(),JSON.stringify(personalDataObj()));_syncDirty=false;}catch(e){}
  }
});
// Аяты, у которых выбранный тег есть в цепочке: точное совпадение ИЛИ предок (префикс пути).
// Цепочка уже хранится в самом пути ("Акыда/Таухид" содержит "Акыда"), ничего не достраиваем.
// Возвращает [{key,origins}] где origins — листовые имена фактических тегов аята, по которым он
// попал ("Акыда"→"Таухид"/"Сыфаты"; помеченный самой "Акыда" напрямую → "Акыда"). Рекурсивно.
function ayahsForTag(path){
  const at=getAyahTags();const pref=path+"/";const res=[];
  for(const k in at){
    const origins=[];
    for(const p of at[k]){
      if(p===path||p.startsWith(pref)){
        const leaf=p.split("/").pop();           // фактический (листовой) тег аята
        if(!origins.includes(leaf))origins.push(leaf);
      }
    }
    if(origins.length)res.push({key:k,origins});
  }
  return res;
}

function getEnabled(){return gs("enabled",{_arabic:true,kuliev:true});}

// ============================================================
// ИНДЕКС ПОКРЫТИЯ (data/coverage.json) — какие источники есть у аята и наоборот.
// Единица — аят; диапазоны хранятся плоскими парами [нач,кон, нач,кон,…].
// Блочные тафсиры покрыты целиком (все аяты диапазона — реальные ключи в данных).
// ============================================================
// fetch JSON с различением исходов: {data:…} — успех; {net:true} — сеть/хранилище
// недоступны (fetch упал или 5xx); {} — данных нет (404 и т.п., это норма).
async function fetchJson(url){
  try{const r=await fetch(url);if(r.ok)return{data:await r.json()};return r.status>=500?{net:true}:{};}
  catch(e){return{net:true};}
}
async function loadCoverage(){
  if(window.TL_COVERAGE){COV=window.TL_COVERAGE;return;}
  const r=await fetchJson(resolveUrl("coverage"));
  if(r.data)COV=r.data;else covLoadFailed=true;
}
// ПРЕДУПРЕЖДЕНИЯ (data/warnings.json): ошибки в переводах/тафсирах, с градацией.
// Редакторские, текст источника НЕ трогают. Форма:
//   { "<id>": { "<сура>:<аят>": [ {level,title,text} ], "*": [ … ] } }
//   level: "critical" (красный) | "moderate" (жёлтый) | "minor" (спокойный);
//   text — markdown (может быть длинным). По умолчанию уровень — "moderate".
let WARN={};
const WARN_LEVELS=["critical","moderate","minor"]; // от важного к допустимому
const WARN_LABEL={critical:"критическая ошибка",moderate:"средняя ошибка",minor:"лёгкая ошибка"};
// Подпись кликабельной ссылки-призыва (значок + плашка в тексте). Можно переопределить
// на уровне записи предупреждения полем "cta". По умолчанию — по уровню.
const WARN_CTA={critical:"Ответ на заблуждение",moderate:"Примечание редакции",minor:"Уточнение"};
async function loadWarnings(){
  if(window.TL_WARNINGS){WARN=window.TL_WARNINGS;return;}
  const r=await fetchJson(resolveUrl("warnings"));
  if(r.data&&typeof r.data==="object")WARN=r.data;
}
// Список предупреждений для источника у аята: сначала на весь источник ("*"),
// затем на конкретный аят. Уровень нормализуем (дефолт — "moderate").
function warnFor(id,aid){
  const w=WARN[id];if(!w)return[];
  const out=[];
  const add=(arr,scope)=>{if(Array.isArray(arr))for(const x of arr)if(x&&x.text)out.push({level:WARN_LEVELS.includes(x.level)?x.level:"moderate",title:x.title||"",text:x.text,scope});};
  add(w["*"],"source");
  add(w[ST.surah+":"+aid],"ayah");
  return out;
}
// Старший (самый важный) уровень в списке — для рамки и цвета значка.
function warnTop(list){for(const lv of WARN_LEVELS)if(list.some(x=>x.level===lv))return lv;return null;}
// Пары диапазонов источника в суре (или null, если в суре нет покрытия).
function covPairs(id,s){const src=COV.sources[id];return src&&src.s[String(s)]||null;}
// Есть ли у источника аят (s,a)? — двоичный поиск по парам границ.
function covHas(id,s,a){
  const p=covPairs(id,s);if(!p)return false;
  let lo=0,hi=p.length/2-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(a<p[2*m])hi=m-1;else if(a>p[2*m+1])lo=m+1;else return true;}
  return false;
}
// Все источники (в порядке config), у которых есть толкование/перевод этого аята.
function covSourcesForAyah(s,a){
  const out=[];
  for(const t of CONFIG.tafsirs){if(COV.sources[t.id]&&covHas(t.id,s,a))out.push(t.id);}
  return out;
}
function covCount(s,a){let n=0;for(const id in COV.sources)if(covHas(id,s,a))n++;return n;}
// Разделённый счётчик: сколько переводов и сколько тафсиров есть у аята.
function covCountByKind(s,a){let tr=0,taf=0;for(const id in COV.sources){if(!covHas(id,s,a))continue;if(COV.sources[id].kind==="tafsir")taf++;else tr++;}return{tr,taf};}
// Метка для кнопки-счётчика в шапке аята: «🌐 N · 📚 M».
function covCountLabel(s,a){if(covLoadFailed)return`🌐 ? · 📚 ?`;const c=covCountByKind(s,a);return`🌐 ${c.tr} · 📚 ${c.taf}`;}
// Следующий/предыдущий аят с этим источником, начиная за (fromS,fromA). dir +1/-1.
// Прыгает и через суры; возвращает {surah,ayah} или null.
function covNextAyah(id,fromS,fromA,dir){
  const src=COV.sources[id];if(!src)return null;
  const surahs=Object.keys(src.s).map(Number).sort((x,y)=>x-y);
  for(const s of (dir>0?surahs:surahs.slice().reverse())){
    if(dir>0?s<fromS:s>fromS)continue;
    const p=src.s[String(s)];
    // перебор аятов суры в нужном направлении
    if(dir>0){
      for(let i=0;i<p.length;i+=2)for(let a=p[i];a<=p[i+1];a++)
        if(s>fromS||a>fromA)return{surah:s,ayah:a};
    }else{
      for(let i=p.length-2;i>=0;i-=2)for(let a=p[i+1];a>=p[i];a--)
        if(s<fromS||a<fromA)return{surah:s,ayah:a};
    }
  }
  return null;
}
// Текстовый охват источника: «суры 1–19, 59–114» (+ доля). Группирует покрытые суры в диапазоны.
function covExtentText(id){
  const src=COV.sources[id];if(!src)return"нет данных";
  const ss=Object.keys(src.s).map(Number).sort((x,y)=>x-y);
  if(!ss.length)return"нет данных";
  const runs=[];let a=ss[0],b=ss[0];
  for(let i=1;i<ss.length;i++){if(ss[i]===b+1)b=ss[i];else{runs.push([a,b]);a=b=ss[i];}}
  runs.push([a,b]);
  const parts=runs.map(([x,y])=>x===y?`${x}`:`${x}–${y}`);
  const pct=Math.round(src.n*100/COV.total);
  return`суры ${parts.join(", ")} · ${src.n} аят. (${pct}%)`;
}
// Блочная отсылка в тексте: «*Толкование к аятам X–Y — см. аят Z.*» (вся строка — italic).
// Возвращает {from,to,target} или null.
function parseBlockRef(text){
  const m=String(text).match(/^\s*\*?\s*Толкование к аятам\s+(\d+)[–-](\d+)\s+—\s+см\.\s+аят\s+(\d+)\.?\s*\*?\s*$/);
  return m?{from:+m[1],to:+m[2],target:+m[3]}:null;
}

function touchChunk(key){
  const i=chunkLRU.indexOf(key);
  if(i>=0)chunkLRU.splice(i,1);
  chunkLRU.push(key);
  while(chunkLRU.length>MAX_CHUNKS){const old=chunkLRU.shift();delete chunkCache[old];}
}

// Lazily load ONE surah of one tafsir. Returns {ayah:text}. Cached + LRU-evicted.
async function loadChunk(id,surahId){
  const key=id+"|"+surahId;
  if(chunkCache[key]){touchChunk(key);return chunkCache[key];}
  let chunk=null,netFail=false;
  // 1. Offline preload (whole Quran in TL_DATA) -> slice the surah
  if(window.TL_DATA&&window.TL_DATA[id])chunk=window.TL_DATA[id][String(surahId)]||{};
  // 2. Per-surah chunk file (primary path)
  if(chunk===null){const r=await fetchJson(resolveUrl(chunkClass(id),{source:id,sura:surahId}));if(r.data)chunk=r.data;else if(r.net)netFail=true;}
  // 3. Back-compat: monolithic file -> slice
  if(chunk===null){const whole=await loadWhole(id,true);if(whole)chunk=whole[String(surahId)]||{};else if(wholeNetFail)netFail=true;}
  // 4. Placeholder: различаем «данных нет» (норма) и «не смогли загрузить» (сеть/R2)
  if(chunk===null){
    if(id==="_arabic"){chunk={};}
    else{
      const info=CONFIG.tafsirs.find(t=>t.id===id);const su=SURAHS.find(s=>s.id===surahId);chunk={};
      const msg=netFail?"⚠ Не удалось загрузить данные (нет сети или хранилище недоступно). Проверьте подключение — при следующем открытии попробуем снова.":"※ Тафсир ещё не добавлен.";
      if(su)for(let i=1;i<=su.n;i++)chunk[i]=`[${info?.name||id}] Сура ${surahId}, аят ${i}\n\n${msg}`;
    }
  }
  if(netFail)return chunk;            // ошибку НЕ кэшируем: следующий рендер повторит попытку
  chunkCache[key]=chunk;touchChunk(key);
  return chunk;
}

// Load the full tafsir (all surahs) — only used by search. Cached separately.
let wholeNetFail=false; // последний loadWhole не удался по сети (а не из-за отсутствия файла)
async function loadWhole(id,quiet){
  wholeNetFail=false;
  if(wholeCache[id])return wholeCache[id];
  if(window.TL_DATA&&window.TL_DATA[id]){wholeCache[id]=window.TL_DATA[id];return wholeCache[id];}
  const info=CONFIG.tafsirs.find(t=>t.id===id);
  // монолит источника: явный override config.file (отн. база класса; учитывает
  // per-source dataBase, напр. R2) или шаблон по умолчанию
  const monoBase=(info&&info.dataBase)||SOURCES.tafsir_monolith.baseUrl;
  const url=info&&info.file?`${monoBase}/${info.file}`:resolveUrl("tafsir_monolith",{source:id});
  const r=await fetchJson(url);
  if(r.data){wholeCache[id]=r.data;return wholeCache[id];}
  wholeNetFail=!!r.net;
  return quiet?null:{};
}

function esc(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML;}
// Safe for a value placed inside a single-quoted JS string within a double-quoted on* attribute
function escAttr(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// Lightweight Markdown for tafsir/translation segments: headings, bold/italic,
// `code`, > quote, -/1. lists, | tables |, --- rule. Plain text (with blank-line
// paragraphs / single-line breaks) renders unchanged. Always HTML-escaped first.
function mdInlineBasic(t){
  return t.replace(/\*\*([^*]+?)\*\*/g,"<strong>$1</strong>")
          .replace(/__([^_]+?)__/g,"<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,"$1<em>$2</em>")
          .replace(/`([^`]+?)`/g,"<code>$1</code>")
          // markdown-ссылки [текст](url) → ссылка в новой вкладке (текст уже HTML-экранирован)
          .replace(/\[([^\]]+?)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdInline(t){
  // tap-to-open cards: [[видимое::текст карточки]] -> clickable word + grammar card.
  // Stash payloads behind sentinels (U+FFF9..B) so formatting/spaces never touch them.
  const cards=[];
  t=t.replace(/\[\[([^\]]+?)::([^\]]+?)\]\]/g,(m,lab,card)=>{
    cards.push(card);return "\uFFF9"+(cards.length-1)+"\uFFFA"+lab+"\uFFFB";
  });
  t=mdInlineBasic(t);
  return t.replace(/\uFFF9(\d+)\uFFFA([\s\S]*?)\uFFFB/g,(m,i,lab)=>
    `<button type="button" class="wcard" data-card="${cards[+i].replace(/"/g,"&quot;")}">${lab}</button>`);
}
// grammar/word card: render the payload (inline md, || = line break)
function renderCardText(raw){return mdInlineBasic(esc(String(raw||""))).replace(/\|\|/g,"<br>");}

}

  COM:"واو المعية",EXL:"حرف تفصيل",ANS:"حرف جواب",EXH:"حرف تحضيض",INT:"حرف تفسير",

};
const POS_COLOR={ // цвет по части речи (как в гринтехе)
  noun:"#2e7d57",verb:"#b3431f",pron:"#1565a8",part:"#8a6d1f",def:"#6a6a6a"};
function posGroup(pos){
  if(pos==="V")return "verb";
  if(["N","PN","ADJ","VN","ACT_PCPL","PASS_PCPL","IMPN","T","LOC"].includes(pos))return "noun";
  if(["PRON","DEM","REL"].includes(pos))return "pron";
  if(pos==="DET")return "def";
  return "part";
}
function posColor(pos){return POS_COLOR[posGroup(pos)];}
const GENDER_RU={M:"муж. род",F:"жен. род"};
const NUMBER_RU={S:"ед. число",D:"дв. число",P:"мн. число"};
const CASE_RU={NOM:"именит. падеж",ACC:"винит. падеж",GEN:"родит. падеж"};
const ASPECT_RU={PERF:"прош. время",IMPF:"наст./буд. время",IMPV:"повелит. накл."};
const VOICE_RU={ACT:"действ. залог",PASS:"страд. залог"};
const PERSON_RU={"1":"1-е лицо","2":"2-е лицо","3":"3-е лицо"};
const ROMAN=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
function posLabel(pos){return POS_RU[pos]||pos;}
// Build the grammar card HTML from a word's segments. The header shows the
// VERBATIM English gloss (display-only, CC BY-NC-ND); the body is Russian
// grammar from the corpus. The data-quran "ru_ref" is never shown here.
function renderMorphCard(segs,gloss){
  if(!segs||!segs.length)return "";
  let h="";
  if(gloss&&(gloss.ru||gloss.en)){
    if(gloss.ru)h+=`<div style="font-size:14px;color:var(--text);font-weight:600;margin-bottom:2px">${esc(gloss.ru)}</div>`;
    if(gloss.en)h+=`<div style="font-size:11.5px;color:var(--text-muted);margin-bottom:6px">${esc(gloss.en)}</div>`;
  }
  for(const s of segs){
    const gram=[];
    if(s.aspect)gram.push(ASPECT_RU[s.aspect]||s.aspect);
    if(s.voice)gram.push(VOICE_RU[s.voice]||s.voice);
    if(s.form&&ROMAN[+s.form])gram.push("порода "+ROMAN[+s.form]);
    if(s.person)gram.push(PERSON_RU[s.person]||s.person);
    if(s.gender)gram.push(GENDER_RU[s.gender]||s.gender);
    if(s.number)gram.push(NUMBER_RU[s.number]||s.number);
    if(s.case)gram.push(CASE_RU[s.case]||s.case);
    if(s.indef)gram.push("неопредел.");
    let lex="";
    if(s.root||s.lemma){
      const parts=[];
      if(s.lemma)parts.push(`лемма <b>${esc(s.lemma)}</b>`);
      // корень — вход в конкорданс: тап → все места Корана с этим корнем
      if(s.root)parts.push(`корень <b class="mcard-root" onclick="selectRoot('${escAttr(s.root)}')" title="Все места, где встречается корень ${escAttr(s.root)}">${esc(s.root)} ›</b>`);
      lex=`<div class="mcard-lex">${parts.join(" · ")}</div>`;
    }
    h+=`<div class="mcard-seg">
      <span class="mcard-ar" style="color:${posColor(s.pos)}">${esc(s.ar)}</span>
      <span class="mcard-info">
        <span class="mcard-pos" style="color:${posColor(s.pos)}">${esc(posLabel(s.pos))}</span>${POS_AR[s.pos]?`<span class="mcard-pos-ar">${esc(POS_AR[s.pos])}</span>`:""}
        ${gram.length?`<div class="mcard-gram">${esc(gram.join(" · "))}</div>`:""}
        ${lex}
      </span></div>`;
  }
  h+=`<div class="mcard-foot">Разбор: <a href="http://corpus.quran.com" target="_blank" rel="noopener">Quranic Arabic Corpus</a></div>`;
  return h;
}
// Open the corpus card for a word element (data-loc="surah:ayah:word"); loads
// that surah's morph/words chunks lazily (cached after first use).
async function openMorphCard(el){
  const loc=el.dataset.loc;if(!loc)return;
  const[s,a,w]=loc.split(":");
  const[morph,words]=await Promise.all([loadWbwMorph(s),loadWbwWords(s)]);
  const segs=morph&&morph[a]&&morph[a][w];
  const gloss=words&&words[a]&&words[a][w];
  const html=renderMorphCard(segs,gloss);
  if(html)showWordCardEl(el,html);
}

// "О переводе/тафсире" — source-level passport + intro/preface, lazy-loaded from data/about/<id>.md
let aboutCache={};
const KIND_RU={quran:"Коран",translation:"Перевод",tafsir:"Тафсир",image:"Скан"};
const LANG_RU={ar:"Арабский",ru:"Русский"};
const ERA_RU={classical:"Классический",modern:"Современный"};
function aboutFillText(t){
  if(t.fill==null)return "";
  const pct=Math.round(t.fill*1000)/10;
  return (Number.isInteger(pct)?pct.toFixed(0):pct.toFixed(1))+"%";
}
function aboutGroupName(id){const g=(CONFIG.groups||[]).find(x=>x.id===id);return g?g.name:id;}
function aboutTagName(tag){return tag==="draft"?"неполный":tagLabel(tag);}
function aboutLink(label,url){
  const text=label||url;if(!text)return "";
  if(url)return `<a href="${escAttr(url)}" target="_blank" rel="noopener">${esc(text)}</a>`;
  return esc(text);
}
function aboutRow(label,value){
  if(value==null||value===""||(Array.isArray(value)&&!value.length))return "";
  return `<div class="about-row"><span class="about-k">${esc(label)}</span><span class="about-v">${Array.isArray(value)?value.map(esc).join(", "):value}</span></div>`;
}
// Уровень проверки: "caution" (жёсткий — маргинальные/любительские тексты) |
// "unverified" (мягкий — признанные, но не выверенные лично) | null.
// Legacy-поле caution:true приравнивается к жёсткому уровню.
function reviewLevel(t){return t.reviewLevel||(t.caution?"caution":null);}
function aboutStatus(t){
  const tags=t.tags||[],items=[];
  const composite=Array.isArray(t.segments)&&t.segments.length>=2;
  const lvl=reviewLevel(t);
  if(composite)items.push(["","составной перевод — статус по сурам ниже"]);
  if(t.approved&&!composite)items.push(["ok","одобрено"]);
  if(lvl==="caution")items.push(["warn","не проверено"]);
  else if(lvl==="unverified")items.push(["","не выверено"]);
  if(tags.includes("draft")&&!composite)items.push(["warn","черновик"]);
  if(t.fill!=null&&t.fill<0.999)items.push(["","заполнено "+aboutFillText(t)]);
  if(!items.length)items.push(["","статус проверки не указан"]);
  return `<div class="about-status">${items.map(([cls,txt])=>`<span class="about-pill ${cls}">${esc(txt)}</span>`).join("")}</div>`;
}
// Разбивка «кто какие суры перевёл» для составного источника.
function aboutSegments(t){
  if(!Array.isArray(t.segments)||t.segments.length<2)return "";
  return t.segments.map(s=>{
    const lvl=reviewLevel(s);
    const pill=s.approved?'<span class="about-pill ok">одобрено</span>':s.draft?'<span class="about-pill warn">черновик</span>':lvl==="caution"?'<span class="about-pill warn">не проверено</span>':lvl==="unverified"?'<span class="about-pill">не выверено</span>':'';
    return `<div class="about-row"><span class="about-k">Суры ${esc(String(s.suras))}</span><span class="about-v">${esc(s.translator||'')} ${pill}</span></div>`;
  }).join("");
}
function aboutPassport(t){
  const tags=(t.tags||[]).map(aboutTagName);
  const source=aboutLink(t.sourceName||t.source,t.sourceUrl);
  const rows=[
    aboutRow("Тип",esc(KIND_RU[t.kind]||t.kind||"")),
    aboutRow("Группа",esc(aboutGroupName(t.group)||"")),
    aboutRow("Язык",esc(LANG_RU[t.lang]||t.lang||"")),
    aboutRow("Эпоха",esc(ERA_RU[t.era]||t.era||"")),
    aboutRow("Автор",esc(t.author||"")),
    (Array.isArray(t.segments)&&t.segments.length>=2)?aboutSegments(t):aboutRow("Переводчик",esc(t.translator||"")),
    aboutRow("Редактор",esc(t.editor||"")),
    aboutRow("Год",esc(t.year||"")),
    aboutRow("Заполненность",esc(aboutFillText(t))),
    aboutRow("Направления",tags),
    aboutRow("Источник текста",source),
    aboutRow("Издание",esc(t.edition||"")),
    aboutRow("Лицензия",esc(t.license||t.licenseStatus||"")),

  ].filter(Boolean).join("");
  return aboutStatus(t)+`<div class="about-passport">${rows}</div>`;

// Общий оверлей-модалка (используют и паспорт источника, и экран «О программе»).

// Простой front-matter: верхний блок между «---» => {meta, body}.
function parseFrontmatter(md){
  const m=String(md).match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?([\s\S]*)$/);
  if(!m)return {meta:{},body:String(md)};
  const meta={};
  m[1].split(/\r?\n/).forEach(line=>{const i=line.indexOf(":");if(i>0)meta[line.slice(0,i).trim()]=line.slice(i+1).trim();});
  return {meta,body:m[2]};
}
// Экран «О программе»: текст из data/about/app.md (класс about в resolveUrl), движок mdRender.
// Контакт берётся из front-matter app.md — меняется без правки кода.

  const {meta,body}=md?parseFrontmatter(md):{meta:{},body:""};
  const clean=body.replace(/<!--[\s\S]*?-->/g,"");   // служебные HTML-комментарии не показываем
  const bodyHtml=clean.trim()?mdRender(clean):'<span class="about-empty">Описание пока не добавлено.</span>';
  // Заголовок — только если задан во front-matter (иначе берётся из самого текста, напр. «# О программе»).
  const titleHtml=meta.title?`<div class="about-title">${esc(meta.title)}</div>`:"";
  // Кнопка-контакт — только если задан contact во front-matter; иначе ссылка живёт прямо в тексте.
  const contact=meta.contact||"";

  const contactBtn=contact?`<a class="about-contact" href="${escAttr(contact)}" target="_blank" rel="noopener">${esc(clabel)}</a>`:"";
  const ov=ensureAboutOvl();

  ov.innerHTML=`<div class="about-box" role="dialog" aria-modal="true">
    <button class="about-close" onclick="closeAboutSmart()" aria-label="Закрыть">×</button>
    ${titleHtml}
    <div class="about-body md">${bodyHtml}</div>
    ${contactBtn}

}
// ── КАРТА ЗАБЛУЖДЕНИЙ ────────────────────────────────────────────────────────
// Отдельная сущность: свод редакторских предупреждений (WARN). Индекс «*» — все
// источники, у которых есть предупреждения; «<id>» — карта одного источника.
// Вход: ссылка на Главной (индекс) и кнопка в паспорте ℹ (карта источника).
const WARN_SUMLBL={critical:"критических",moderate:"средних",minor:"лёгких"};
// Развёрнутые записи одного источника: [{key,level,title,text}], сортировка «*»→адрес.
function warnRows(id){
  const w=WARN[id];if(!w)return[];
  const rows=[];
  for(const k in w){if(!Array.isArray(w[k]))continue;
    for(const it of w[k]){if(it&&it.text)rows.push({key:k,level:WARN_LEVELS.includes(it.level)?it.level:"moderate",title:it.title||"",text:it.text,cat:it.cat||""});}}
  const num=k=>{if(k==="*")return[-1,-1];const p=k.split(":");return[+p[0],+p[1]];};
  rows.sort((a,b)=>{const x=num(a.key),y=num(b.key);return x[0]-y[0]||x[1]-y[1];});
  return rows;
}
function warnCount(id){return warnRows(id).length;}
function warnLevelCounts(rows){const c={};rows.forEach(r=>c[r.level]=(c[r.level]||0)+1);return c;}
function warnSummaryHTML(cnt){return WARN_LEVELS.filter(l=>cnt[l]).map(l=>`<span class="wp-tag ${l}">${cnt[l]} ${WARN_SUMLBL[l]}</span>`).join(" ");}
// Один раскрываемый пункт карты (адрес + заголовок + оригинал источника + разбор + переход).
// Оригинал аята подгружается лениво при первом раскрытии (ontoggle → warnOrigLoad).
function warnItemHTML(id,r){
  const isAyah=r.key!=="*";
  const loc=isAyah?`аят ${esc(r.key)}`:"весь источник";
  const goto=isAyah?`<button class="wm-goto" onclick="event.stopPropagation();goWarnAyah('${escAttr(id)}','${escAttr(r.key)}')" title="Перейти к аяту">→ к аяту</button>`:"";
  const orig=isAyah?` ontoggle="if(this.open)warnOrigLoad(this,'${escAttr(id)}','${escAttr(r.key)}')"`:"";
  return `<details class="aw-item lv-${r.level}"${orig}><summary><span class="aw-loc">${loc}</span>${r.title?`<span class="aw-title">${esc(r.title)}</span>`:''}<span class="aw-chev">▾</span></summary>${isAyah?`<div class="wp-orig"><div class="wp-orig-h">📖 Текст источника</div><div class="wp-orig-body">Загрузка…</div></div>`:''}<div class="wp-text md">${mdRender(r.text)}</div>${goto}</details>`;
}
// Ленивая подгрузка оригинала источника в раскрытый пункт карты. Кэш — chunkCache (loadChunk).
async function warnOrigLoad(det,id,key){
  const box=det.querySelector(".wp-orig-body");
  if(!box||box.dataset.done)return;box.dataset.done="1";
  const[s,a]=key.split(":");
  let text=null;
  try{const chunk=await loadChunk(id,+s);text=chunk&&chunk[a]||null;}catch(e){}
  if(!text){box.innerHTML='<span style="color:var(--text-muted)">Текста по этому аяту нет.</span>';return;}
  const t=CONFIG.tafsirs.find(x=>x.id===id);

    ${long?'<button class="more-btn" onclick="toggleClamp(this)">Развернуть ▾</button>':''}
    ${notes.length?renderFootnotes(notes):''}</div>`;
}

// Карта одного источника: шапка + заметка редактора + раскрываемый список мест.
// Порядок — «По аятам» / «По приёмам» (группы по полю cat записи; tl_warnSort).
// Чипы уровней в сводке — фильтр (ST.warnLvlF, сессионный). «Развернуть всё» — разом.
function renderWarnSource(el){
  const id=ST.warnMap,t=CONFIG.tafsirs.find(x=>x.id===id);
  const all=warnRows(id),cnt=warnLevelCounts(all);
  const byCat=localStorage.getItem("tl_warnSort")==="cat";
  const rows=ST.warnLvlF?all.filter(r=>r.level===ST.warnLvlF):all;
  const chips=WARN_LEVELS.filter(l=>cnt[l]).map(l=>`<span class="wp-tag ${l}${ST.warnLvlF===l?' active':''}" onclick="ST.warnLvlF=ST.warnLvlF==='${l}'?null:'${l}';render()" title="Показать только этот уровень">${cnt[l]} ${WARN_SUMLBL[l]}</span>`).join(" ");
  let html=`<div class="tag-results"><div class="wm-back" onclick="ST.warnLvlF=null;openWarnMap('*')">‹ Все источники</div>
    <div class="tr-header">⚠ Заблуждения · ${esc(t?t.name:id)}${t&&t.nameAr?` <span class="rt-ar-big">${esc(t.nameAr)}</span>`:''}</div>
    <div class="aw-summary" style="margin-bottom:10px">${chips}</div>`;
  if(t&&t.editorNote)html+=`<div class="about-warn crit" style="margin:0 0 12px">${mdRender(t.editorNote)}</div>`;
  html+=`<div class="wm-tools">
    <button class="cov-map-open" onclick="openAbout('${escAttr(id)}')">ℹ Паспорт источника</button>
    <span class="wm-sort"><button class="wm-sort-b${byCat?'':' active'}" onclick="localStorage.setItem('tl_warnSort','ayah');render()">По аятам</button><button class="wm-sort-b${byCat?' active':''}" onclick="localStorage.setItem('tl_warnSort','cat');render()">По приёмам</button></span>
    <button class="wm-sort-b" onclick="const l=this.closest('.tag-results').querySelectorAll('details.aw-item');const open=[...l].some(d=>!d.open);l.forEach(d=>d.open=open);this.textContent=open?'Свернуть всё':'Развернуть всё'">Развернуть всё</button></div>`;
  if(!byCat){
    html+=`<div class="about-warnlist">${rows.map(r=>warnItemHTML(id,r)).join("")}</div>`;
  }else{
    // Группы по категории приёма; порядок — тяжесть (лучший уровень в группе), затем размер.
    const groups=new Map();

function mdTableStart(L,i){return L[i].includes("|")&&i+1<L.length&&L[i+1].includes("|")&&/^[\s:|-]*-[\s:|-]*$/.test(L[i+1]);}
function mdBlockStart(L,i){const l=L[i];
  return /^\s*$/.test(l)||/^\s*---+\s*$/.test(l)||/^\s*#{1,4}\s/.test(l)||/^\s*&gt;\s?/.test(l)||/^\s*[-*]\s+/.test(l)||/^\s*\d+\.\s+/.test(l)||mdTableStart(L,i);}
function mdRender(src){
  if(src==null||src==="")return "";
  const L=esc(String(src)).split("\n"),out=[];let i=0;
  const row=r=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
  while(i<L.length){
    const ln=L[i];
    if(/^\s*$/.test(ln)){i++;continue;}
    if(/^\s*---+\s*$/.test(ln)){out.push("<hr>");i++;continue;}
    const h=ln.match(/^\s*(#{1,4})\s+(.*)$/);
    if(h){const n=h[1].length;out.push(`<div class="md-h md-h${n}">${mdInline(h[2])}</div>`);i++;continue;}
    if(mdTableStart(L,i)){
      const head=row(ln);i+=2;let body="";
      while(i<L.length&&!/^\s*$/.test(L[i])&&L[i].includes("|")){body+="<tr>"+row(L[i]).map(c=>`<td>${mdInline(c)}</td>`).join("")+"</tr>";i++;}
      out.push(`<table class="md-tbl"><thead><tr>${head.map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`);continue;
    }
    if(/^\s*&gt;\s?/.test(ln)){const q=[];while(i<L.length&&/^\s*&gt;\s?/.test(L[i])){q.push(L[i].replace(/^\s*&gt;\s?/,""));i++;}out.push(`<blockquote class="md-q">${mdInline(q.join("<br>"))}</blockquote>`);continue;}
    if(/^\s*[-*]\s+/.test(ln)){const it=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){it.push(L[i].replace(/^\s*[-*]\s+/,""));i++;}out.push("<ul class='md-ul'>"+it.map(x=>`<li>${mdInline(x)}</li>`).join("")+"</ul>");continue;}
    if(/^\s*\d+\.\s+/.test(ln)){const it=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i])){it.push(L[i].replace(/^\s*\d+\.\s+/,""));i++;}out.push("<ol class='md-ol'>"+it.map(x=>`<li>${mdInline(x)}</li>`).join("")+"</ol>");continue;}
    const para=[];while(i<L.length&&!mdBlockStart(L,i)){para.push(L[i]);i++;}
    out.push(`<p class="md-p">${mdInline(para.join("<br>"))}</p>`);
  }
  return out.join("");
}
function toggleClamp(btn){const d=btn.previousElementSibling;const on=d.classList.toggle("clamped");btn.textContent=on?"Развернуть ▾":"Свернуть ▴";}

// Footnotes inside a translation/tafsir entry. Data convention: inline reference
// markers [^N] in the text, and definitions "[^N]: …" (one per note) at the end.
// Refs render as superscript indices; the notes list below the ayah (no label word).
function splitNotes(text){
  const i=text.search(/(?:^|\n)[ \t]*\[\^\w+\]:/);
  if(i<0)return{body:text,notes:[]};
  const body=text.slice(0,i).replace(/\s+$/,"");
  const tail=text.slice(i);const notes=[];
  const re=/\[\^(\w+)\]:[ \t]*([\s\S]*?)(?=\n\[\^\w+\]:|$)/g;let m;
  while((m=re.exec(tail)))notes.push({n:m[1],t:m[2].trim()});
  return{body,notes};
}
function renderRefs(md){ // protect [^N] from markdown, then make them superscripts
  return mdRender(md.replace(/\[\^(\w+)\]/g,"￶$1￷"))
    .replace(/￶(\w+)￷/g,'<sup class="ab-fnref">$1</sup>');
}
function renderFootnotes(notes){
  const long=!ST.noTouch&&notes.reduce((s,n)=>s+n.t.length,0)>360;  // в режиме без касания — без свёртки
  const list=notes.map(n=>`<div class="ab-fn"><span class="ab-fn-num">${esc(n.n)}</span><div class="ab-fn-t md">${mdRender(n.t)}</div></div>`).join("");
  return `<div class="ab-notes ${long?'clamped':''}">${list}</div>`+(long?`<button class="more-btn" onclick="toggleClamp(this)">Развернуть ▾</button>`:"");
}

function noteKeysSorted(filter){
  const n=getNotes(),q=String(filter||"").trim().toLowerCase();
  return Object.keys(n).filter(k=>{
    if(!n[k]||!n[k].trim())return false;
    if(!q)return true;

    return n[k].toLowerCase().includes(q)||(su&&su.ru.toLowerCase().includes(q))||k.includes(q);
  }).sort((x,y)=>{const[xs,xa]=x.split(":").map(Number),[ys,ya]=y.split(":").map(Number);return xs-ys||xa-ya;});
}
// Отрывок для списка: markdown-разметку снимаем, иначе в строке светится «**жирный**»
// (полный текст рисуется markdown-ом на экране «во весь экран»).
function noteSnippet(t,len){
  const s=String(t||"")
    .replace(/```[\s\S]*?```/g," ")      // блоки кода — целиком
    .replace(/^\s{0,3}[#>]+\s*/gm,"")    // заголовки и цитаты
    .replace(/(\*\*|__|[*`])/g,"")       // жирный/курсив/моно (одиночное _ у нас не курсив)
    .replace(/\[\^?([^\]]*)\]\([^)]*\)/g,"$1")  // ссылки → их текст
    .replace(/\s+/g," ").trim();
  return s.length>len?s.slice(0,len)+"…":s;
}

async function renderBookmarksScreen(el){
  const b=getBookmarks();
  const keys=Object.keys(b).sort((x,y)=>{const[xs,xa]=x.split(":").map(Number),[ys,ya]=y.split(":").map(Number);return xs-ys||xa-ya;});
  if(!keys.length){
    el.innerHTML=`<div class="tag-results"><div class="tr-header">★ Закладки</div><div style="color:var(--text-muted);padding:20px;text-align:center">Нет закладок. Откройте аят и нажмите ☆ в его панели.</div></div>`;
    return;
  }
  // тексты — как в тег-результатах: арабский + первый включённый перевод
  const surahs=[...new Set(keys.map(k=>+k.split(":")[0]))];
  const firstTrans=CONFIG.tafsirs.find(t=>t.lang!=="ar"&&ST.enabled[t.id])||CONFIG.tafsirs.find(t=>t.lang!=="ar");
  await Promise.all(surahs.flatMap(s=>{
    const ps=[loadChunk("_arabic",s).catch(()=>{})];
    if(firstTrans)ps.push(loadChunk(firstTrans.id,s).catch(()=>{}));
    return ps;
  }));
  if(!ST.bmView)return;                               // пока грузили, ушли с экрана
  let html=`<div class="tag-results"><div class="tr-header">★ Закладки — ${keys.length}</div>`;
  for(const k of keys){
    const[s,a]=k.split(":");
    const su=SURAHS.find(x=>x.id==+s);
    const arText=getArabicFromCache(+s,+a);
    const trText=getAnyTranslation(+s,+a);
    html+=`<div class="tr-ayah" onclick="ST.bmView=false;ST.notesView=false;goAyah(${+s},${+a})">
      <div class="tr-ayah-ref">${su?su.ru:s} : ${a}${b[k]?`<span class="tr-origins"><span class="t-pill">${esc(b[k])}</span></span>`:""}</div>
      ${arText?`<div class="tr-ayah-ar">${arText}</div>`:""}
      ${trText?`<div class="tr-ayah-tr">${trText}</div>`:""}
    </div>`;
  }
  el.innerHTML=html+`</div>`;
}

// ── Пресеты наборов источников (панель 📚 → «Выбрано») ─────────────────────
// Правило (UI_REDESIGN.md): молча не перезаписывать — перед применением пресета
// текущая РУЧНАЯ подборка автосохраняется в «Мой набор» (localStorage myPreset).
function presetSnapshot(){
  return {ids:getEnabledList().filter(t=>t.id!=="_notes").map(t=>t.id),wbw:!!ST.wbwLayer,tj:!!ST.tajweed};
}
function applyPresetState(ids,wbw,tj){
  CONFIG.tafsirs.forEach(t=>{if(t.kind!=="quran"&&t.kind!=="image")ST.enabled[t.id]=false;});
  ids.forEach(id=>{if(CONFIG.tafsirs.find(t=>t.id===id))ST.enabled[id]=true;});
  setEnabled(ST.enabled);setUserOrder(ids.slice());
  if(wbw!==undefined&&!!ST.wbwLayer!==!!wbw)toggleWbwLayer();   // штатные тогглеры —
  if(tj!==undefined&&!!ST.tajweed!==!!tj)toggleTajweed();       // они знают про паки/персист
  renderRP();renderCB();renderCenter();
}
function applyPreset(kind){
  // первый включённый перевод (или Кулиев), первый включённый тафсир (или Ибн Касир)
  const en=getEnabledList().filter(t=>t.id!=="_notes");
  const isTr=t=>t.group==="translations"&&t.lang!=="ar";
  const isTaf=t=>t.kind==="tafsir";
  const tr=(en.find(isTr)||CONFIG.tafsirs.find(t=>t.id==="kuliev")||CONFIG.tafsirs.find(isTr)||{}).id;
  const taf=(en.find(isTaf)||CONFIG.tafsirs.find(t=>t.id==="kathir_ru")||CONFIG.tafsirs.find(isTaf)||{}).id;
  if(kind==="mine"){
    const p=gs("myPreset",null);
    if(p&&Array.isArray(p.ids))applyPresetState(p.ids,p.wbw,p.tj);
    return;
  }
  ss("myPreset",presetSnapshot());                              // не потерять ручную подборку
  if(kind==="tr")applyPresetState(tr?[tr]:[],false,undefined);
  else if(kind==="taf")applyPresetState([tr,taf].filter(Boolean),false,undefined);
  else if(kind==="study")applyPresetState(tr?[tr]:[],true,true);
}

// Вступление к суре: текст под ключом "0" в чанке суры (фадаиль, мекканская/мединская,
// причины ниспослания…). Показывается единым блоком НАД аятом 1, без виртуализации.
function buildSuraIntro(enabled,loaded){
  let inner="";
  for(const t of enabled){
    if(t.id==="_notes")continue;
    const text=loaded[t.id]?.["0"];
    if(!text)continue;
    const isAr=t.lang==="ar";
    const {body,notes}=splitNotes(text);
    const src=body||text;
    const long=!ST.noTouch&&src.length>600;   // длинное вступление сворачиваем, как тафсиры
    inner+=`<div class="ab-entry">
      <div class="ab-entry-label">${esc(t.name)} <span class="lbl-ar">${t.nameAr||''}</span> · <span class="intro-tag">введение к суре</span></div>
      <div class="ab-entry-text md selectable ${isAr?'rtl':''} ${long?'clamped':''}">${renderRefs(src)}</div>
      ${long?'<button class="more-btn" onclick="toggleClamp(this)">Развернуть ▾</button>':''}
      ${notes.length?renderFootnotes(notes):''}
    </div>`;
  }
  if(!inner)return "";
  return `<div class="ayah-block sura-intro" data-aid="intro"><div class="sura-intro-head">📖 Вступление к суре</div>${inner}</div>`;
}

// Build the entries (Arabic + tafsirs + notes) for one ayah — used on demand by virtualization
function buildAyahBody(aid,enabled,loaded){
  let html="";
  // Arabic Quran-text variants (с огласовками / без огласовок / …) — each as its own line
  const qts=getEnabledQuranTexts();
  const multiQ=qts.length>1;
  const pack=activePack();const qpcData=loaded["__qpc"];
  for(const qt of qts){
    const lbl=multiQ?`<div class="ab-entry-label">${esc(qt.name)} <span class="lbl-ar">${qt.nameAr||''}</span></div>`:"";
    // Слой «Со словами»: огласованную редакцию показываем сеткой слов с глоссом.
    // Данных нет (сура вне пословного слоя) → молча падаем в обычный рендер ниже.
    if(ST.wbwLayer&&qt.id==="_arabic"){
      const grid=wbwGridHTML(ST.surah,aid,loaded);
      if(grid){html+=`<div class="ab-entry">${lbl}${grid}</div>`;continue;}
    }
    // Печатный мусхаф (QPC): главный огласованный текст рисуем глифами страницы
    if(pack&&qt.id==="_arabic"&&qpcData&&qpcData[String(aid)]){
      html+=`<div class="ab-entry">${lbl}${renderPackAyah(pack,qpcData[String(aid)])}</div>`;
      continue;
    }
    const at=loaded[qt.id]?.[String(aid)];
    if(!at)continue;
    // раскраска таджвида (фаза B) — только огласованная редакция, текстовые шрифты
    const tjs=qt.id==="_arabic"&&loaded.__tj&&loaded.__tj[String(aid)];
    html+=`<div class="ab-entry">${lbl}<div class="ab-entry-text arabic-main selectable">${tjs?tajweedHTML(at,tjs):at}</div></div>`;
  }
  // Заголовки групп «Переводы»/«Тафсиры» под аятом — только если включены оба вида сразу.
  const realSrc=enabled.filter(t=>t.id!=="_notes");
  const hasTr=realSrc.some(t=>t.kind!=="tafsir"),hasTaf=realSrc.some(t=>t.kind==="tafsir");
  const splitGroups=hasTr&&hasTaf;
  let shownTr=false,shownTaf=false;
  for(const t of enabled){
    if(t.id==="_notes"){
      const note=getNote(ST.surah,aid);
      html+=`<div class="ab-entry" style="background:var(--note-bg)">
        <div class="ab-entry-label" style="color:var(--note-color)">📝 Мои заметки</div>
        <textarea class="ab-note-area" placeholder="Ваши мысли..." oninput="saveNote(${ST.surah},${aid},this.value)">${esc(note)}</textarea>
      </div>`;
    } else {
      if(splitGroups){
        if(t.kind==="tafsir"&&!shownTaf){html+=`<div class="ab-group-head">📚 Тафсиры</div>`;shownTaf=true;}
        else if(t.kind!=="tafsir"&&!shownTr){html+=`<div class="ab-group-head">🌐 Переводы</div>`;shownTr=true;}
      }
      html+=sourceEntryHTML(t,loaded[t.id]?.[String(aid)]||null,aid);
    }
  }
  // «Показать только здесь»: разовый показ источников у ЭТОГО аята, помимо постоянных.
  for(const id of adHocIds(ST.surah,aid)){
    if(ST.enabled[id])continue;                    // уже показывается постоянно — не дублируем
    const t=CONFIG.tafsirs.find(x=>x.id===id);if(!t)continue;
    let text=loaded[id]?.[String(aid)]||null;
    // на блочном аяте при разовом показе разворачиваем ПОЛНЫЙ текст блока прямо здесь
    const blk=text?parseBlockRef(text):null;
    let blockOf=null;
    if(blk){const bt=loaded[id]?.[String(blk.target)];if(bt){text=bt;blockOf=[blk.from,blk.to];}}
    html+=sourceEntryHTML(t,text,aid,true,blockOf);
  }
  return html;
}
// Свёрнутость групп «Переводы»/«Тафсиры» в попапе аята и в окне выбора источника.
// По умолчанию переводы свёрнуты (длинный список) — ST.collapsedKinds.translation=true.
function kindCollapsed(k){return !!ST.collapsedKinds[k];}
function setKindCollapsed(k){
  ST.collapsedKinds=Object.assign({},ST.collapsedKinds,{[k]:!ST.collapsedKinds[k]});

}

// Свёрнутость секций в окне выбора источника (3 группы). По умолчанию свёрнуты
// переводы и арабские тафсиры; русские тафсиры раскрыты.
const PICK_COL_DEFAULT={translation:true,ar_tafsir:true};
function pickCollapsed(k){const v=ST.collapsedKinds[k];return v===undefined?!!PICK_COL_DEFAULT[k]:!!v;}
function pickToggleKind(k){ST.collapsedKinds=Object.assign({},ST.collapsedKinds,{[k]:!pickCollapsed(k)});ss("collapsedKinds",ST.collapsedKinds);renderCenter();}
// Чип «＋ عربي / ＋ рус» у источника, для которого есть парный (арабский оригинал
// ↔ русский перевод). Показывается только пока пара НЕ включена. Клик — включает её.
function counterpartChip(t){
  const cid=t&&t.counterpart; if(!cid||ST.enabled[cid])return"";
  const c=CONFIG.tafsirs.find(x=>x.id===cid); if(!c)return"";
  const lbl=c.lang==="ar"?"عربي":"рус";
  return `<button class="cp-chip" onclick="event.stopPropagation();enablePair('${escAttr(cid)}')" title="Подключить: ${escAttr(c.name)}">+ ${lbl}</button>`;
}
function enablePair(id){if(!ST.enabled[id]){ST.enabled[id]=true;setEnabled(ST.enabled);} if(typeof renderRP==="function")renderRP(); renderCenter();}
// Составной источник: разные переводчики по разным сурам. t.segments =
// [{suras:"58-114", translator, approved|draft, note?}, …]. Спека сур — "50-57",
// "50,52,60", "50-57,60". Возвращает сегмент, покрывающий суру (или null).
function suraInSpec(surah,spec){
  if(spec==null)return false;
  return String(spec).split(",").some(part=>{
    const m=part.trim().match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);
    if(!m)return false;
    const a=+m[1],b=m[2]?+m[2]:a;
    return surah>=Math.min(a,b)&&surah<=Math.max(a,b);
  });
}
function segForSura(t,surah){
  if(!t||!Array.isArray(t.segments))return null;
  return t.segments.find(s=>suraInSpec(surah,s.suras))||null;
}
// Бейдж «пер. Имя ✓/⚠» для текущей суры — только у составных источников (≥2 переводчиков).
// Маркер одобрения у аята: двойная галочка ✓✓ (только у выверенного). Имя
// переводчика не показываем (оно есть в паспорте) — чтобы все источники были
// единообразны. Непроверенное/черновик — без значка (это дефолт).
function segCredit(t){
  if(!t)return"";
  const seg=(Array.isArray(t.segments)&&t.segments.length>=2)?segForSura(t,ST.surah):null;
  const approved=seg?seg.approved:t.approved;
  if(!approved)return"";
  return `<span class="appr-seal" title="Перевод выверен и одобрен">✓✓</span>`;
}
// Одобрено ли ЗДЕСЬ (для текущей суры, с учётом сегментов составного источника).
function isApprovedHere(t){
  if(!t)return false;
  const seg=(Array.isArray(t.segments)&&t.segments.length>=2)?segForSura(t,ST.surah):null;
  return !!(seg?seg.approved:t.approved);
}
// HTML одной колонки источника у аята. Распознаёт блочную отсылку «см. аят Z».
// adhoc=true → плашка «разовый показ» с кнопкой убрать. blockOf=[from,to] → текст блока.
function sourceEntryHTML(t,text,aid,adhoc,blockOf){
  const isAr=t.lang==="ar";
  const badge=adhoc?`<button class="cov-adhoc-x" onclick="removeAdHoc(${aid},'${escAttr(t.id)}')" title="Убрать разовый показ">только здесь ✕</button>`:"";
  // Предупреждения об ошибках (редакторские): подписанная кнопка + рамка у аята
  // + заметная плашка-ссылка под текстом (чтобы было очевидно, что есть разбор).
  const warns=warnFor(t.id,aid);
  const wtop=warnTop(warns);
  const wCls=wtop?` warn-${wtop}`:"";
  const wLabel=(warns.find(w=>w.cta)||{}).cta||WARN_CTA[wtop]||"Пояснение";
  const wCnt=warns.length>1?" ("+warns.length+")":"";
  // Один ⚠-компонент (этап 1 редизайна): бейдж у имени — ПАССИВНЫЙ индикатор
  // уровня, единственная кликабельная точка — плашка warn-inline под текстом.
  const wBadge=wtop?`<span class="warn-badge lv-${wtop}" title="У этого места есть редакционное пояснение — см. плашку ниже">⚠ ${esc(wLabel)}${wCnt}</span>`:"";
  const wInline=wtop?`<button class="warn-inline lv-${wtop}" onclick="event.stopPropagation();openWarnPopup('${escAttr(t.id)}',${aid})" title="Открыть разбор">⚠ ${esc(wLabel)}${wCnt} — открыть разбор →</button>`:"";
  const blk=(!blockOf&&text)?parseBlockRef(text):null;
  if(blk){
    return `<div class="ab-entry${t.kind==="tafsir"?' taf':''}${isApprovedHere(t)?' approved':''}${wCls}"${adhoc?' style="border-left:2px solid var(--accent)"':''}>
      <div class="ab-entry-label">${esc(t.name)} <span class="lbl-ar">${t.nameAr||''}</span>${wBadge}${segCredit(t)}${badge}${counterpartChip(t)}</div>
      <div class="cov-blockref">📎 Разобрано в блоке <b>${blk.from}–${blk.to}</b> <button class="cov-goto" onclick="goAyah(${ST.surah},${blk.target})">перейти к аяту ${blk.target} →</button></div>
      ${wInline}
    </div>`;
  }
  const {body,notes}=text?splitNotes(text):{body:null,notes:[]};
  const inner=body?renderRefs(body):'<span style="color:var(--text-muted)">—</span>';
  const long=!ST.noTouch&&body&&body.length>600; // в режиме без касания — сразу развёрнуто, без кнопки
  const blockNote=blockOf?`<div class="cov-blocknote">показан блок ${blockOf[0]}–${blockOf[1]} (этот аят входит в него)</div>`:"";
  return `<div class="ab-entry${t.kind==="tafsir"?' taf':''}${isApprovedHere(t)?' approved':''}${wCls}"${adhoc?' style="border-left:2px solid var(--accent)"':''}>
    <div class="ab-entry-label">${esc(t.name)} <span class="lbl-ar">${t.nameAr||''}</span>${wBadge}${segCredit(t)}${badge}${counterpartChip(t)}</div>
    ${blockNote}
    <div class="ab-entry-text md selectable ${isAr?'rtl':''} ${long?'clamped':''}">${inner}</div>
    ${long?'<button class="more-btn" onclick="toggleClamp(this)">Развернуть ▾</button>':''}
    ${wInline}
    ${notes.length?renderFootnotes(notes):''}
  </div>`;
}

// ad-hoc «показать только здесь»

// Разбиение аятов суры на элементы: покрытые аяты + полоски разрывов (с учётом gapMode).
function sourceModeItems(id,ayahIds){
  const items=[];let gapStart=null;
  const flushGap=(end)=>{
    if(gapStart==null)return;
    if(ST.gapMode==="show"){for(let a=gapStart;a<=end;a++)items.push({ayah:a,covered:false});}
    else if(ST.gapMode==="collapse"){
      const key=ST.surah+":"+gapStart+"-"+end;
      if(ST.expandedGaps[key]){items.push({gapHead:[gapStart,end],expanded:true});for(let a=gapStart;a<=end;a++)items.push({ayah:a,covered:false});}
      else items.push({gap:[gapStart,end]});
    } // "hide" → ничего
    gapStart=null;
  };
  for(const aid of ayahIds){
    if(covHas(id,ST.surah,aid)){flushGap(aid-1);items.push({ayah:aid,covered:true});}
    else{if(gapStart==null)gapStart=aid;}
  }
  flushGap(ayahIds[ayahIds.length-1]);
  return items;
}
