<script>
// ============================================================
const DATA_PATH="data/";   // дефолтная база (оставлена для обратной совместимости; пути к данным идут через resolveUrl)

// ============================================================
// РЕЕСТР ИСТОЧНИКОВ ДАННЫХ (абстракция расположения).
// Для каждого КЛАССА ресурса — база (baseUrl) и шаблон пути (pathTemplate).
// Весь код берёт URL только через resolveUrl(class, params) — нигде нет
// «зашитых» путей. Сейчас все baseUrl указывают на текущее расположение
// (репозиторий / GitHub Pages): данные НЕ переезжают, это чистый рефакторинг.
//
// Задел на будущее: чтобы перенести класс на другое хранилище (напр. тяжёлый
// бинарь — сканы/аудио — на Cloudflare R2), достаточно сменить baseUrl этого
// класса здесь; вызывающий код не меняется. Разные классы могут жить на разных
// хранилищах (лёгкий текст на GitHub, бинарь на R2) — просто разные baseUrl.
// ============================================================
const SOURCES={
  // — лёгкий текст: конфиг и индекс покрытия —
  config:          {baseUrl:"data",  pathTemplate:"{baseUrl}/config.json"},
  coverage:        {baseUrl:"data",  pathTemplate:"{baseUrl}/coverage.json"},
  // — предупреждения о критических ошибках в переводах/тафсирах (редакторские,
  //   текст источника не трогают; на аят или на весь источник, ключ "*") —
  warnings:        {baseUrl:"data",  pathTemplate:"{baseUrl}/warnings.json"},
  // — текст Корана по аятам (огласовки/без/расм) —
  quran_text:      {baseUrl:"data",  pathTemplate:"{baseUrl}/tafsirs/{source}/{sura}.json"},
  // — тафсиры/переводы по аятам: чанк по суре, монолит (поиск), инвертированный индекс —
  tafsir_text:     {baseUrl:"data",  pathTemplate:"{baseUrl}/tafsirs/{source}/{sura}.json"},
  tafsir_monolith: {baseUrl:"data",  pathTemplate:"{baseUrl}/tafsirs/{source}.json"},
  search_index:    {baseUrl:"data",  pathTemplate:"{baseUrl}/index/{source}.json"},
  // — пословный перевод (глосс) и морфология (грамматика) по сурам —
  glosses:         {baseUrl:"data",  pathTemplate:"{baseUrl}/wbw/words/{sura}.json"},
  erudit_pool:     {baseUrl:"data",  pathTemplate:"{baseUrl}/erudit/{file}"},   // служебные данные упражнений (build_erudit_pool.py)
  quiz:            {baseUrl:"data",  pathTemplate:"{baseUrl}/quiz/{file}"},     // банк вопросов «Кто хочет стать учёным» (validate_quiz.py)
  morphology:      {baseUrl:"data",  pathTemplate:"{baseUrl}/wbw/morph/{sura}.json"},
  // — конкорданс: корень → все его вхождения в Коране (build_concordance.py из
  //   той же морфологии). ОДИН файл на весь Коран, а не чанки по сурам: карта
  //   обратная, и вхождения одного корня раскиданы по всем 114 сурам —
  concordance:     {baseUrl:"data",  pathTemplate:"{baseUrl}/wbw/roots.json"},
  // — «о переводе/тафсире» (паспорт источника) —
  about:           {baseUrl:"data",  pathTemplate:"{baseUrl}/about/{source}.md"},
  // — статичные классификации сур (Мекка/Медина, периоды, мукатта'ат, пары…) —
  //   оверлей-фильтры карты хифза; чистая справка, не связана с состоянием —
  surah_meta:      {baseUrl:"data",  pathTemplate:"{baseUrl}/surah-classifications.json"},
  // Тематический указатель (фихрист): дерево тем + карта тема→аяты (build_topics.py).
  topics:          {baseUrl:"data",  pathTemplate:"{baseUrl}/topics/{file}"},
  // — печатный мусхаф (глифы QPC, лёгкий JSON) и его шрифты; структуру внутри
  //   задаёт пакет (PACKS), база — отсюда (можно унести на CDN сменой baseUrl) —
  mushaf_glyphs:   {baseUrl:"data",  pathTemplate:"{baseUrl}/{path}"},
  mushaf_fonts:    {baseUrl:"fonts", pathTemplate:"{baseUrl}/{path}"},
  // — постраничные шрифты цветного таджвид-мусхафа (QPC v4, COLR): тяжёлый бинарь,
  //   как и сканы — на R2 (зеркало r2-data/fonts/, заливка upload_r2.sh) —
  mushaf_fonts_r2: {baseUrl:"https://pub-d99a56b61d914461b5864f421a013097.r2.dev/fonts", pathTemplate:"{baseUrl}/{path}"},
  // — посимвольная разметка правил таджвида для раскраски ТЕКСТОВОГО рендера
  //   (build_tajweed.py из данных cpfair/quran-tajweed) —
  tajweed_spans:   {baseUrl:"data",  pathTemplate:"{baseUrl}/tajweed/{sura}.json"},
  // — тяжёлый бинарь: webp-страницы скан-источника (kind:image) — на объектном
  //   хранилище Cloudflare R2; {dir}=imgdir источника, {file}=pNNN.webp из карты —
  mushaf_scans:    {baseUrl:"https://pub-d99a56b61d914461b5864f421a013097.r2.dev",  pathTemplate:"{baseUrl}/{dir}/{file}"},
  // — лёгкий текст: карты-списки страниц скана (<sura>.json / _about.json) — остаются
  //   локально (в них — реальные имена webp с пропусками, источник истины навигации) —
  scan_maps:       {baseUrl:"data",  pathTemplate:"{baseUrl}/{dir}/{file}"},
  audio:           {baseUrl:"data",  pathTemplate:"{baseUrl}/audio/{source}/{sura}/{ayah}.mp3"}, // задел: вызовов пока нет
  // — поаятное CDN-аудио чтецов (media.js): {subdir} — каталог чтеца из
  //   config.json (audio.reciters), {file}=NNNSSS.mp3 (паддинг у вызывающего) —
  audio_cdn:       {baseUrl:"https://everyayah.com/data", pathTemplate:"{baseUrl}/{subdir}/{file}"},
  // — аятные тайминги ПОСУРНЫХ чтецов (type:"audio_surah"): один mp3 = вся сура,
  //   тайминги [start,end] на аят собирает build_timings.py (CTC-выравнивание).
  //   Есть → указатель следует за аятом внутри суры и можно перематывать на аят.
  audio_timings:   {baseUrl:"data",  pathTemplate:"{baseUrl}/audio/timings/{reciter}/{sura}.json"},
  // — визуальный слой (media.js): карта набора data/media/visual/<pack>.json
  //   (один агент/набор = один файл; НЕ общий visual.json — иначе затирают друг друга).
  //   Сборка: python3 build_visual_pack.py --pack <id> --dir data/media/<dir>.
  //   Legacy fallback: data/media/visual.json (старый единый файл, пока есть).
  //   Картинки: visual_media → data/media/{file} (file = filmstrip-…/topic-….png).
  visual_map:      {baseUrl:"data",  pathTemplate:"{baseUrl}/media/visual/{pack}.json"},
  visual_map_legacy:{baseUrl:"data", pathTemplate:"{baseUrl}/media/visual.json"},
  visual_media:    {baseUrl:"data",  pathTemplate:"{baseUrl}/media/{file}"},
  // — объёмные арабские тома (на будущее, лежат там же, что и тафсиры) —
  arabic_volumes:  {baseUrl:"data",  pathTemplate:"{baseUrl}/tafsirs/{source}/{sura}.json"},     // задел
};
// Локальная проверка тяжёлых источников до публикации в R2:
//   python3 -m http.server 8000
//   http://localhost:8000/?r2local=1#11
// Флаг намеренно не сохраняется и на опубликованном сайте бесполезен, поскольку
// gitignored-каталога r2-data там нет.
const LOCAL_R2=/[?&]r2local=1(?:&|$)/.test(location.search);
// Единая точка построения URL: подставляет baseUrl и параметры в шаблон класса.
function resolveUrl(cls,params){
  const def=SOURCES[cls];
  if(!def)throw new Error("resolveUrl: неизвестный класс ресурса «"+cls+"»");
  let base=def.baseUrl;
  // Переопределение хранилища на уровне ИСТОЧНИКА: тяжёлый источник может жить не
  // в репо, а на объектном хранилище (напр. R2) — тогда в config у него поле
  // dataBase. Касается только по-аятных классов данных источника; лёгкие общие
  // классы (config/coverage/about/…) не трогаем — они всегда локальны.
  if(params&&params.source&&(cls==="tafsir_text"||cls==="tafsir_monolith"||cls==="search_index"||cls==="quran_text")){
    const t=CONFIG&&CONFIG.tafsirs&&CONFIG.tafsirs.find(x=>x.id===params.source);
    if(t&&t.dataBase)base=LOCAL_R2?"r2-data":t.dataBase;
  }
  let url=def.pathTemplate.split("{baseUrl}").join(base);
  if(params)for(const k in params)url=url.split("{"+k+"}").join(params[k]);
  return url;
}
// Класс чанка по виду источника: текст Корана vs тафсир/перевод (могут жить на разных базах).
function chunkClass(id){
  const t=CONFIG&&CONFIG.tafsirs&&CONFIG.tafsirs.find(x=>x.id===id);
  return t&&t.kind==="quran"?"quran_text":"tafsir_text";
}
// Подкаталог сканов источника (imgdir или img/<id>) — конечный URL через resolveUrl(mushaf_scans).
function scanDirOf(t){return t.imgdir||("img/"+t.id);}

// ============================================================
// МЕДИА-МОДУЛЬ (аудио): ленивая загрузка media.js
// ============================================================
// Код плеера НЕ входит в index.html — тянется нативным dynamic import() при
// первом обращении (▶ у аята или блок «🎧 Аудио» в панели 📚). Пока аудио не
// трогали: ни байта кода, ни <audio>-элементов. media.js — ES-модуль, наши
// let-глобалы (ST/CONFIG/qpcMeta) ему не видны — передаём контекст геттерами.
const MEDIA_VER="19";   // поднять при правке media.js (сброс кеша браузера/CDN)
let MEDIA=null;        // загруженный модуль (null = ещё не загружался)
function mediaCtx(){
  return {
    get ST(){return ST;},get CONFIG(){return CONFIG;},get qpcMeta(){return qpcMeta;},
    SURAHS,resolveUrl,gs,ss,esc,escAttr,
    recVisible:()=>recVisible(),                                   // чтецы набора (не скрытые)
    renderAudio:()=>renderAudioPanel(),                            // обновить отдельную панель 🎧
    openReciterManager:()=>openReciterManager(),
    getArabic:(s,a)=>getArabicFromCache(s,a),                      // диафильм: текст аята
    ensureText:(id,s)=>loadChunk(id,s),getText:(id,s,a)=>{const c=getChunk(id,s);return c?(c[a]||""):"";},
    primaryTransId:()=>diafilmTransId(),                           // первый включённый перевод
    pushOverlay:()=>pushOverlay(),consumeOverlay:()=>consumeOverlay(),exitDiafilm:()=>exitDiafilm(),openDiafilm:a=>openDiafilm(a),
    jumpTo:t=>jumpTo(t),renderRP:()=>renderRP(),renderCenter:()=>renderCenter(),
  };
}
async function mediaMod(){
  if(MEDIA)return MEDIA;
  try{
    const m=await import("./media.js?v="+MEDIA_VER);
    m.init(mediaCtx());MEDIA=m;return m;
  }catch(e){
    console.error("media.js не загрузился:",e);
    alert("Не удалось загрузить аудио-модуль (при первом запуске нужна сеть).");
    return null;
  }
}
// ============================================================
// «🎓 Эрудит» — занимательные упражнения (erudit.js, тоже ленивый ES-модуль)
// ============================================================
// Код упражнений в index.html не входит: подсистема будет расти (аяты, темы,
// тартиб, «Лестница знания» с банком вопросов), а страница и так велика. Пока
// человек не открыл режим — модуль не грузится.
const ERUDIT_VER="6";  // поднять при правке erudit.js (сброс кеша браузера/CDN)
let ERUDIT=null;
async function eruditMod(){
  if(ERUDIT)return ERUDIT;
  try{
    const m=await import("./erudit.js?v="+ERUDIT_VER);
    m.init({
      get ST(){return ST;},
      SURAHS,gs,ss,esc,escAttr,resolveUrl,
      goSurah:id=>goSurah(id),
      goAyah:(s,a)=>{goAyah(s,a);flashAyah(a);},
      // Текст: те же чанки и кеш, что у ленты чтения — упражнение не заводит
      // собственной копии Корана и не грузит того, что уже загружено.
      ensureText:(id,s)=>loadChunk(id,s),
      getText:(id,s,a)=>{const c=getChunk(id,s);return c?(c[a]||""):"";},
      getArabic:(s,a)=>getArabicFromCache(s,a),
      transId:()=>diafilmTransId(),                    // первый включённый перевод (не хардкод)
      transName:id=>{const t=CONFIG.tafsirs.find(x=>x.id===id);return t?t.name:"";},
      loadMorph:s=>loadWbwMorph(s),                    // разбор слов (для «пропущенного слова»)
      loadGloss:s=>loadWbwWords(s),                    // русские глоссы слов
      loadRoots:()=>loadRoots(),                       // конкорданс: формы одного корня — дистракторы
      getRoots:()=>ROOTS,
      openRoot:r=>selectRootView(r),                   // экран вхождений корня («где ещё встречается»)
      TJ_RULES,loadTajweed:s=>loadTajweed(s),          // правила таджвида и их места в аяте
      playAyah:(s,a)=>mediaMod().then(m=>m&&m.playFrom(s,a)),  // «послушать это место» в разборе
      downloadJSON:(obj,name)=>downloadJSON(obj,name), // выгрузка отметок вычитки банка вопросов
    });
    ERUDIT=m;return m;
  }catch(e){
    console.error("erudit.js не загрузился:",e);
    const b=document.getElementById("erdBody");
    if(b)b.innerHTML=`<div class="erd-note" style="text-align:center;padding:24px">Не удалось загрузить модуль упражнений (при первом запуске нужна сеть).</div>`;
    return null;
  }
}
function eruditEnterMode(){
  renderCB();renderBottomNav();renderSB();
  const cb=document.getElementById("centerBody");
  if(cb)cb.innerHTML=`<div class="erd-screen"><div id="erdBody"><div class="erd-note" style="padding:20px">Загружаю упражнения…</div></div></div>`;
  eruditMod().then(m=>m&&m.enterMode());
  pushOverlay();                                 // запись для «Назад»: раунд → список упражнений
}
// Рендер режима в главное окно (из renderCenterBody). Модуль может быть ещё не
// загружен — тогда рисуем заглушку и просим его дорисовать себя самому.
function renderEruditScreen(el){
  el.innerHTML=`<div class="erd-screen"><div id="erdBody"></div></div>`;
  if(ERUDIT)ERUDIT.render();else eruditMod().then(m=>m&&m.enterMode());
}
function openErudit(){setMode("erudit");}

function mediaPlayAyah(a){mediaMod().then(m=>m&&m.playFrom(ST.surah,a));}
// «Слушать текущую суру» из панели 📚: старт с последней позиции в этой суре
function mediaPlaySurah(){
  const lp=gs("lastPos",null);
  mediaPlayAyah((lp&&lp.surah===ST.surah&&lp.ayah)||1);
}
function mediaSetReciter(id){
  ss("mediaReciter",id);
  if(MEDIA)MEDIA.setReciter(id); // на лету: указатель аята сохраняется
  renderAudioPanel();
}
// Диафильм: первый ВКЛЮЧЁННЫЙ перевод (предпочтительно из группы «Переводы»),
// иначе любой включённый нетафсир-текст, иначе null (тогда только арабский).
function diafilmTransId(){
  const en=getEnabledList().filter(t=>t.id!=="_notes"&&!isQuranText(t.id));
  const tr=en.find(t=>{const c=CONFIG.tafsirs.find(x=>x.id===t.id);return c&&c.group==="translations";});
  return (tr||en[0]||{}).id||null;
}
// Вход в диафильм (полноэкранный визуальный ряд). Аппаратный «Назад»/Esc и ✕
// выходят через оверлей-запись (как иммерсив). Возврат — на тот же аят.
let _dfFs=false;                                       // диафильм сам запросил полноэкранный режим?
function dfRequestFs(){
  if(isIOS)return;                                     // iOS Safari — Fullscreen API хрупкий (см. immersive)
  const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req&&!(document.fullscreenElement||document.webkitFullscreenElement)){try{const p=req.call(el);if(p&&p.catch)p.catch(()=>{});_dfFs=true;}catch(e){}}
}
function dfExitFs(){
  if(!_dfFs)return;_dfFs=false;
  const d=document,ex=d.exitFullscreen||d.webkitExitFullscreen;
  if((d.fullscreenElement||d.webkitFullscreenElement)&&ex)try{ex.call(d);}catch(e){}
}
function openDiafilm(a){
  if(ST.diafilm)return;
  dfRequestFs();                                       // СИНХРОННО в жесте: весь экран (браузер+приложение)
  ST.diafilm=true;pushOverlay();
  const ay=a||curTopAyah();
  mediaMod().then(m=>{if(m)m.openDiafilm(ST.surah,ay);else{ST.diafilm=false;consumeOverlay();dfExitFs();}});
}
function exitDiafilm(viaBack){
  if(!ST.diafilm)return;
  ST.diafilm=false;
  const pos=MEDIA?MEDIA.diafilmPos():null;
  if(MEDIA)MEDIA.closeDiafilm();
  dfExitFs();
  if(!viaBack)consumeOverlay();
  if(pos&&pos.s)jumpTo({surah:pos.s,ayah:pos.a});   // вернуться в прежний режим на том же аяте
}

// ============================================================
// ЧТЕНИЕ НАИЗУСТЬ (hifz-ридер): полноэкранный показ ОДНОГО аята — как кадр
// диафильма, но только текст. Человек читает наизусть не глядя; тап по ЛЮБОМУ
// месту экрана листает вперёд (запнулся → взглянул — на экране ровно текущий
// аят), крупная ‹ снизу — назад, свайпы ←/→ тоже работают, границы сур
// переходятся насквозь. Экран не гаснет (wake lock). Выход — ✕/Esc/«Назад»;
// лента возвращается на последний аят сессии.
// ============================================================
let hrOpen=false;
const HR={s:1,a:1,el:null,wake:null,want:false,swiped:false,ru:false};
async function hrWake(on){
  try{
    HR.want=!!on;
    if(on){if(("wakeLock"in navigator)&&!HR.wake){HR.wake=await navigator.wakeLock.request("screen");
      if(HR.wake&&HR.wake.addEventListener)HR.wake.addEventListener("release",()=>{HR.wake=null;});}}
    else if(HR.wake){await HR.wake.release();HR.wake=null;}
  }catch(e){HR.wake=null;}                     // нет API / отказ — молча
}
// свернули приложение (глянуть что-то) и вернулись — замок экрана возвращаем
document.addEventListener("visibilitychange",()=>{
  if(HR.want&&document.visibilityState==="visible"){HR.wake=null;hrWake(true);}
});
function hrStart(){
  if(hrOpen)return;
  dfRequestFs();                               // СИНХРОННО в жесте — весь экран, как диафильм
  let s=ST.surah,a=curTopAyah()||1;
  if(ST.homeMode||ST.hifzMode||ST.eruditMode||ST.pageMode||ST.srcMode){  // не в ленте — от последней позиции чтения
    const lp=gs("lastPos",null);if(lp&&lp.surah){s=lp.surah;a=lp.ayah||1;}
  }
  HR.s=s;HR.a=Math.min(a,(SURAHS[s-1]||{n:1}).n);HR.swiped=false;
  HR.ru=!!gs("hrRu",false);                    // показ перевода переживает выход из ридера
  HR.hide=!!gs("hrHide",false);                // «по памяти»: аят скрыт, 1-й тап — показать
  HR.veiled=HR.hide;
  hrOpen=true;pushOverlay();
  document.body.classList.add("hr-open");
  const el=document.createElement("div");
  el.id="hifzReader";el.className="hreader";
  el.innerHTML=`<div class="hr-top"><span class="hr-key" id="hrKey"></span>
      <div class="hr-tools">
        <button class="hr-b" data-act="top" title="В начало этой суры">⤒ к 1-му</button>
        <button class="hr-b" id="hrHideBtn" data-act="hide" title="По памяти: аят скрыт — вспомни, первый тап показывает, второй листает">по памяти</button>
        <button class="hr-b" id="hrRuBtn" data-act="ru" title="Перевод под аятом">перевод</button>
        <button class="hr-x" data-act="close" title="Закрыть">✕</button>
      </div></div>
    <div class="hr-main" style="position:relative"><div class="hr-body" id="hrBody">
      <div class="hr-ar arabic-main" id="hrAr"></div>
      <div class="hr-ru" id="hrRu"></div></div>
      <div class="hr-veil-hint">Вспомни аят и прочитай вслух.<br>Тап — показать, ещё тап — дальше.</div></div>
    <div class="hr-bottom"><button class="hr-prev" data-act="prev" title="Предыдущий аят">‹</button>
      <span class="hr-hint">Тап в любом месте — следующий аят</span></div>`;
  document.body.appendChild(el);HR.el=el;
  el.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");
    if(b){const act=b.dataset.act;
      if(act==="close")hrStop();
      else if(act==="ru")hrToggleRu();
      else if(act==="top")hrToSuraStart();
      else if(act==="hide")hrToggleHide();
      else hrStep(-1);
      return;}
    if(HR.swiped){HR.swiped=false;return;}     // click-хвост свайпа — не листать второй раз
    if(HR.hide&&HR.veiled){HR.veiled=false;hrVeil();return;}  // «по памяти»: 1-й тап раскрывает
    hrStep(1);                                 // тап по любому месту = дальше
  });
  // свайпы ←/→ (как в диафильме): влево = следующий, вправо = предыдущий
  let x0=null,y0=null;
  el.addEventListener("touchstart",e=>{if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY;}},{passive:true});
  el.addEventListener("touchend",e=>{
    if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.4){HR.swiped=true;hrStep(dx<0?1:-1);}
  },{passive:true});
  hrRender();hrWake(true);
}
function hrStop(viaBack){
  if(!hrOpen)return;
  hrOpen=false;hrWake(false);
  document.body.classList.remove("hr-open");
  if(HR.el){HR.el.remove();HR.el=null;}
  dfExitFs();
  if(!viaBack)consumeOverlay();
  jumpTo({surah:HR.s,ayah:HR.a});              // лента — на последний аят сессии
}
function hrStep(d){
  let s=HR.s,a=HR.a+d;
  if(a<1){ if(s>1){s--;a=SURAHS[s-1].n;} else a=1; }
  else if(a>SURAHS[s-1].n){ if(s<114){s++;a=1;} else a=SURAHS[s-1].n; }
  HR.s=s;HR.a=a;
  if(HR.hide)HR.veiled=true;                   // «по памяти»: новый аят снова скрыт
  hrRender();
}
// «По памяти» (Ayat-паттерн): аят скрыт размытием — вспомни и прочитай вслух,
// первый тап показывает (сверка), второй листает. Вуаль кроет и перевод.
function hrToggleHide(){
  HR.hide=!HR.hide;ss("hrHide",HR.hide);
  HR.veiled=HR.hide;
  hrVeil();
  const b=document.getElementById("hrHideBtn");if(b)b.classList.toggle("on",HR.hide);
}
function hrVeil(){
  const body=document.getElementById("hrBody");
  if(body)body.classList.toggle("hr-veiled",!!(HR.hide&&HR.veiled));
}
// Перевод под аятом: подсказка для тех мест, где память держится на смысле.
// Выбор источника — общий с проверкой заучивания (hifzRuId: первый включённый
// перевод), чтобы «перевод» значил одно и то же во всём разделе.
function hrToggleRu(){HR.ru=!HR.ru;ss("hrRu",HR.ru);hrRender();}
// «К 1-му»: с середины суры вернуться к её началу — читают сурами, а не с того
// места, где закрыли. Уже на первом аяте — уходим к началу ПРЕДЫДУЩЕЙ суры,
// иначе кнопка выглядит сломанной (нажал — ничего не изменилось).
function hrToSuraStart(){
  if(HR.a===1&&HR.s>1)HR.s--;

}
async function hrRender(){
  if(!hrOpen)return;
  const su=SURAHS[HR.s-1];
  const keyEl=document.getElementById("hrKey"),arEl=document.getElementById("hrAr");
  const ruEl=document.getElementById("hrRu"),ruBtn=document.getElementById("hrRuBtn");
  if(keyEl)keyEl.textContent=HR.s+":"+HR.a+" · "+(su?su.ru:"");
  if(ruBtn)ruBtn.classList.toggle("on",!!HR.ru);
  const hideBtn=document.getElementById("hrHideBtn");
  if(hideBtn)hideBtn.classList.toggle("on",!!HR.hide);
  hrVeil();
  const s=HR.s,a=HR.a;
  let t=getArabicFromCache(s,a);
  if(!t){                                      // чанк суры ещё не загружен
    if(arEl)arEl.textContent="…";
    try{await loadChunk("_arabic",s);}catch(e){}
    if(!hrOpen||s!==HR.s||a!==HR.a)return;     // пока грузили — перелистнули/закрыли
    t=getArabicFromCache(s,a);
  }
  if(arEl)arEl.textContent=t||"—";
  const main=HR.el&&HR.el.querySelector(".hr-main");
  if(main)main.scrollTop=0;                    // длинный аят — читать с начала
  if(!ruEl)return;
  if(!HR.ru){ruEl.textContent="";return;}
  const rid=hifzRuId();
  if(!rid){ruEl.textContent="Нет включённого перевода — включите его в 📚";return;}
  let r=(getChunk(rid,s)||{})[String(a)];
  if(!r){                                      // чанк перевода тянем так же лениво
    ruEl.textContent="…";
    try{await loadChunk(rid,s);}catch(e){}
    if(!hrOpen||s!==HR.s||a!==HR.a||!HR.ru)return;
    r=(getChunk(rid,s)||{})[String(a)];
  }
  ruEl.textContent=r||"—";                     // textContent: разметку перевода не рендерим
}

// Ayah IDs generated from surah.n — text comes from loaded JSON files
function getAyahIds(surahId){
  const su=SURAHS.find(s=>s.id===surahId);
  if(!su)return[];
  const arr=[];for(let i=1;i<=su.n;i++)arr.push(i);
  return arr;
}
// --- chunk readers (sync; the surah chunk must already be loaded via loadChunk) ---
function getChunk(id,surahId){return chunkCache[id+"|"+surahId];}
// Arabic text for an ayah: dedicated _arabic, else any loaded Arabic tafsir
function getArabicFromCache(surahId,ayahId){
  const a=getChunk("_arabic",surahId);
  if(a&&a[String(ayahId)])return a[String(ayahId)];
  for(const t of CONFIG.tafsirs){
    if(t.lang==="ar"){const c=getChunk(t.id,surahId);if(c?.[String(ayahId)])return c[String(ayahId)];}
  }
  return "";
}
// Any translation for tag-results display
function getAnyTranslation(surahId,ayahId){
  for(const t of CONFIG.tafsirs){
    if(t.lang!=="ar"){const c=getChunk(t.id,surahId);if(c?.[String(ayahId)])return c[String(ayahId)];}
  }
  return "";
}

// стрелками ‹ › и свайпом возвращало туда, где ты был в той суре (а не к началу).
const surahPos={};
function saveLastPos(){
  if(ST.homeMode||ST.selectedTag||ST.scanSource||ST.bookIntro||ST.srcMode||ST.hifzMode||ST.eruditMode||ST.bmView||ST.notesView)return;  // Главная/теги/скан/введение/источник/хифз/эрудит/закладки — не позиция чтения
  const mode=ST.pageMode?"page":"ayat";   // «words» больше не режим, а слой (ST.wbwLayer) — в позицию чтения не входит
  const ayah=curTopAyah();
  ss("lastPos",{surah:ST.surah,ayah,page:ST.mushafPage||1,mode});
  // ─── ХУК #1: питание модуля прогресса из ридера (аддитивно, обратимо) ───
  // РЕШЕНИЕ ПО RESUME: lastPos остаётся богатой навигационной памятью ридера
  // (режим + страница + аят + позиция в суре) — её НЕ дублируем и НЕ снимаем.
  // Тот же единственный write-site отдаёт модулю прогресса КАНОНИЧЕСКИЙ verse_key,
  // поэтому конкурирующих источников позиции нет: одно событие питает оба слоя,
  // но каждый слой хранит своё представление и не начисляет за чужой.
  // В режиме мусхафа канон — первый аят страницы (позиция там — страница, не аят).
  const _pvk=ST.pageMode
    ?(qpcMeta&&qpcMeta.pageStart&&qpcMeta.pageStart[ST.mushafPage]?qpcMeta.pageStart[ST.mushafPage].surah+":"+qpcMeta.pageStart[ST.mushafPage].ayah:null)
    :ST.surah+":"+ayah;
  if(_pvk){
    Progress.updateResume(_pvk);          // RESUME: одна позиция, НИЧЕГО не начисляет
    Progress.recordActivity(0,[_pvk]);    // CREDITED: аят зачтён в покрытие (время — таймером)
  }
  if(!ST.pageMode)surahPos[ST.surah]=ayah;           // запомнить позицию в этой суре
  pushRecent(ST.surah,ayah,mode);                    // лента «недавнее» для Главной
  // Запомнить позицию чтения в ТЕКУЩЕЙ записи истории, чтобы «назад» (стрелка/свайп)
  // вернул на тот же аят. URL остаётся чистым «#сура» — аят кладём в state. Не трогаем
  // оверлейные записи (ov) и режим мусхафа (там позиция — страница, не аят).
  if(!ST.pageMode){const hs=history.state;if(hs&&hs.surah===ST.surah&&!hs.ov)history.replaceState({surah:ST.surah,ayah},"",location.hash);}
}
let _lastPosT=null;
function saveLastPosSoon(){clearTimeout(_lastPosT);_lastPosT=setTimeout(saveLastPos,500);}
function restoreLastPos(){
  const lp=gs("lastPos",null);
  if(!lp||!lp.surah||!SURAHS.find(s=>s.id===lp.surah))return false;
  ST.surah=lp.surah;
  if(lp.mode==="page"){ST.pageMode=true;ST.mushafPage=lp.page||1;}
  else{ST.pageMode=false;if(lp.ayah)ST.scrollToAyah=lp.ayah;}  // старое lp.mode==="words" → просто лента: слой живёт своей настройкой
  return true;
}
// --- Недавнее чтение (для Главной): список последних мест, MRU, по одному на суру ---
const RECENT_MAX=5;
function getRecent(){const r=gs("recent",[]);return Array.isArray(r)?r:[];}
function pushRecent(surah,ayah,mode){
  if(!SURAHS.find(s=>s.id===surah))return;
  let r=getRecent().filter(e=>e&&e.surah!==surah);
  r.unshift({surah,ayah:ayah||1,mode:mode||"ayat",ts:Date.now()});
  if(r.length>RECENT_MAX)r=r.slice(0,RECENT_MAX);
  ss("recent",r);
}

// ============================================================
// МОДУЛЬ ПРОГРЕССА ЧТЕНИЯ  (дашборд статистики + карта покрытия мусхафа)
// ------------------------------------------------------------
// Единый store поверх того же localStorage приложения (через ss/gs — никто,
// кроме store, его не трогает). Наружу — УЗКИЙ контракт (граница модуля):
//   запись:  Progress.recordActivity(sec,verseKeys), Progress.updateResume(vk)
//            hifzDeclareSurah / hifzRecordReview / hifzSetSettings (слой LEARNING)
//   чтение:  getSummary / getResume / getCoverage / getPageStatus
//            hifzAyahs / hifzGetAyah / hifzStage / hifzSuraDecl / hifzSettings / todayISO
//   хуки:    getHifzStatus [РЕАЛЬНЫЙ: агрегат LEARNING по страницам],
//            exportState/importState [через общий бэкап]
// Ридер и прогресс НЕ зовут друг друга напрямую — только через этот контракт.
// Три несмешиваемых слоя прогресса:
//   RESUME   — одна позиция «где продолжить» (updateResume; НИЧЕГО не начисляет).
//   CREDITED — реестр дней activityDays (recordActivity; ядро всех метрик).
//   LEARNING — хифз: по-аятное состояние памяти (пишет ТОЛЬКО тренажёр
//              «Проверка заучивания» через hifz*-контракт; см. блок ниже).
// ============================================================

// Числа аятов по 114 сурам — для глобального порядкового номера аята (verse→page).
const PROG_AYAH_COUNTS=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,
  111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,
  54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,
  52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,
  19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const PROG_AYAH_OFFSET=(()=>{const o=[0];for(let i=0;i<PROG_AYAH_COUNTS.length;i++)o.push(o[i]+PROG_AYAH_COUNTS[i]);return o;})();
function progVerseOrdinal(vk){const p=String(vk).split(":");const s=+p[0],a=+p[1];if(!s||!a)return 0;return PROG_AYAH_OFFSET[s-1]+a;}

// ХУК #2 (РЕАЛЬНЫЙ, не прототипный): границы страниц берём из данных мушафа
// самой библиотеки — qpcMeta.pageStart = {page:{surah,ayah}} (QPC v1, 604 стр.,
// грузится в loadQpcMeta). Якорь — verse_key; страница ТОЛЬКО производится, нигде
// не хранится. mushafId заложен в сигнатуру: под другой мусхаф сюда придёт свой
// pageStart (сейчас один — qpc1). Индекс строится лениво из уже загруженной меты.
let _progPageIdx=null;
function progBuildPageIdx(){
  if(_progPageIdx)return _progPageIdx;
  if(!(typeof qpcMeta!=="undefined"&&qpcMeta&&qpcMeta.pageStart))return null;
  const arr=[];
  for(const p in qpcMeta.pageStart){const v=qpcMeta.pageStart[p];arr.push({ord:progVerseOrdinal(v.surah+":"+v.ayah),page:+p});}
  arr.sort((a,b)=>a.ord-b.ord);_progPageIdx=arr;return arr;
}
function verseToPage(verseKey,mushafId){
  const idx=progBuildPageIdx();if(!idx)return null;
  const o=progVerseOrdinal(verseKey);if(!o)return null;
  let lo=0,hi=idx.length-1,ans=idx[0].page;               // бинарный поиск последней страницы, чей старт ≤ o
  while(lo<=hi){const m=(lo+hi)>>1;if(idx[m].ord<=o){ans=idx[m].page;lo=m+1;}else hi=m-1;}
  return ans;
}

const Progress=(()=>{
  const IDLE_LIMIT_SEC=30, TICK_SEC=1, MILESTONES=[3,7,30,100,365], TOTAL_PAGES=604;
  const HIFZ_MASTER=21;                                   // интервал (дней), с которого аят считается «закреплён»
  const KEY="progress";                                   // хранится через ss/gs (ключ tl_progress)
  // hifz.settings: K — длина цепочки проверки; lang — язык показа (ar|ru); backward —
  // цепочка назад (сложный режим); feedActivity — см. комментарий у hifzRecordReview.
  function hifzDef(){return {ayahs:{},junctions:{},suraDecl:{},settings:{K:4,lang:"ar",backward:false,feedActivity:false,scope:null}};}
  // speed.settings.targetWpm — МЯГКИЙ комфортный уровень WPM (цель — беглость,
  // не гонка на максимум); null = не задан. runs — сырой лог замеров.
  function speedDef(){return {runs:[],settings:{targetWpm:null}};}
  function def(){return {settings:{goalType:"minutes",goalValue:1,mushafId:1,recovery:{autoPerWeek:1,manualMaxDays:2}},activityDays:[],resumePosition:null,manualRestore:{active:false},hifz:hifzDef(),speed:speedDef(),_debugDayOffset:0};}
  let state=load();
  function load(){const s=gs(KEY,null);if(!s)return def();
    return Object.assign(def(),s,
      {settings:Object.assign(def().settings,s.settings||{}),
       hifz:Object.assign(hifzDef(),s.hifz||{},{settings:Object.assign(hifzDef().settings,(s.hifz||{}).settings||{})}),
       speed:Object.assign(speedDef(),s.speed||{},{settings:Object.assign(speedDef().settings,(s.speed||{}).settings||{})})});}
  function save(){ss(KEY,state);}
  // — даты (со сдвигом «сегодня» для отладки серии/вех) —
  // ЛОКАЛЬНАЯ дата, не toISOString (тот даёт UTC: в UTC+3 время 00:00–02:59
  // уезжало во «вчера», а addDays возвращал s+n−1 — рвались серии и теплокарта)
  function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function today(){const d=new Date();d.setDate(d.getDate()+(state._debugDayOffset||0));return iso(d);}
  function parseISO(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function addDays(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);}
  function dow(s){return (parseISO(s).getDay()+6)%7;}     // Пн=0 … Вс=6
  function dayRec(date,create){let r=state.activityDays.find(d=>d.date===date);if(!r&&create){r={date,activeSeconds:0,verseKeys:[],goalMet:false};state.activityDays.push(r);}return r;}
  function recalcGoal(r){const g=state.settings;const v=g.goalType==="minutes"?r.activeSeconds/60:r.verseKeys.length;r.goalMet=v>=g.goalValue;}
  // ═══ КОНТРАКТ — ЗАПИСЬ ═══
  // recordActivity — единственная точка зачёта (CREDITED). Дедуп verseKey за день.
  function recordActivity(sec,verseKeys){const r=dayRec(today(),true);if(sec>0)r.activeSeconds+=sec;if(verseKeys&&verseKeys.length){const set=new Set(r.verseKeys);for(const vk of verseKeys)set.add(vk);r.verseKeys=[...set];}recalcGoal(r);save();}
  // updateResume — двигает ОДНУ позицию resume и НИЧЕГО не начисляет (RESUME ≠ CREDITED).
  function updateResume(verseKey){state.resumePosition={verseKey,mushafId:state.settings.mushafId,touchedAt:today()};save();}
  // ═══ СЛОЙ LEARNING (хифз) — по-аятное состояние памяти ═══
  // Пишется ТОЛЬКО тренажёром «Проверка заучивания» через контракт ниже;
  // resume/credited эти функции не трогают (слои прогресса не смешиваются).
  // Модель: hifz.ayahs[verseKey] = {declared, verified, srs{due,interval,ease}, log[], up}
  //   declared — ДЕКЛАРАЦИЯ пользователя ("know"|"shaky"|"no"|null): гипотеза-засев карты.
  //   verified — ПОДТВЕРЖДЕНИЕ проверкой (последняя оценка 0|1|2; null = не проверялся).
  //   Эпистемика: это РАЗНЫЕ поля. Свидетельство переопределяет декларацию при
  //   отображении и в пуле; декларация НИКОГДА не затирает свидетельство.
  //   srs — упрощённый SM-2: interval в днях, due — локальная дата, ease 1.3…2.8.
  //   log — хвост оценок [{t,g}] (обрезается; все метрики — производные, не хранятся).
  // hifz.junctions["a>b"] — состояние ПЕРЕХОДОВ между соседними аятами (задел под
  //   будущий движок «швов»): оценка аята b, вспомненного в цепочке после a, — это
  //   одновременно свидетельство шва a→b. Ключ всегда в ПОРЯДКЕ ТЕКСТА.
  let _hifzPg=null;                                       // кэш агрегации по страницам (сбрасывается при записи)
  // Пред-разметка ДИАПАЗОНОМ (блок теплокарты или вся сура; level: "know"|"shaky"|
  // "no"; null = снять). Ставит declared аятам диапазона; verified/srs НЕ трогает
  // (свидетельство сильнее). suraDecl — только сводка для контрола суры: единый
  // уровень всех аятов, иначе (смешанная разметка) снимается.
  function hifzDeclareRange(surahId,from,to,level){
    const su=SURAHS.find(s=>s.id===surahId);if(!su)return;
    const H=state.hifz,t=today();
    from=Math.max(1,from|0);to=Math.min(su.n,to|0);
    for(let a=from;a<=to;a++){
      const vk=surahId+":"+a;let r=H.ayahs[vk];
      if(level==null){                                    // снятие декларации: пустые записи вычищаем
        if(r){r.declared=null;if(r.verified==null&&!(r.log&&r.log.length))delete H.ayahs[vk];}
        continue;
      }
      if(!r)r=H.ayahs[vk]={declared:null,verified:null,srs:null,log:[]};
      r.declared=level;r.up=t;
    }
    let uni;                                              // сводка: единый уровень или смешано
    for(let a=1;a<=su.n;a++){const r=H.ayahs[surahId+":"+a];const d=(r&&r.declared)||null;
      if(uni===undefined)uni=d;else if(uni!==d){uni=null;break;}}
    if(uni)H.suraDecl[surahId]=uni;else delete H.suraDecl[surahId];
    _hifzPg=null;save();
  }
  function hifzDeclareSurah(surahId,level){const su=SURAHS.find(s=>s.id===surahId);if(su)hifzDeclareRange(surahId,1,su.n,level);}
  // Снапшоты «до последней оценки» — ТОЛЬКО в памяти (не персистятся): ошибочный
  // тап можно поправить, пока открыто приложение; после — только перепроверкой
  // (свидетельство руками не редактируется, эпистемика не размывается).
  const _hifzUndo={};
  // Свидетельство проверки: grade 0=не помню / 1=с трудом / 2=уверенно. Обновляет
  // verified + SRS по-аятно. neighborVk — сосед по цепочке (показанный/оценённый
  // перед этим аятом): по нему пишется junction-состояние шва (в порядке текста).
  function hifzRecordReview(vk,grade,neighborVk){
    const H=state.hifz,t=today();
    // снапшот состояния ДО оценки — для hifzAmendReview (замена ошибочного тапа)
    const jk0=neighborVk?(progVerseOrdinal(neighborVk)<progVerseOrdinal(vk)?neighborVk+">"+vk:vk+">"+neighborVk):null;
    _hifzUndo[vk]={ayah:H.ayahs[vk]?JSON.parse(JSON.stringify(H.ayahs[vk])):null,
      jk:jk0,junction:jk0&&H.junctions[jk0]?JSON.parse(JSON.stringify(H.junctions[jk0])):null};
    const r=H.ayahs[vk]||(H.ayahs[vk]={declared:null,verified:null,srs:null,log:[]});
    const s=r.srs||{interval:0,ease:2.5,due:t};
    if(grade===0){s.interval=0;s.ease=Math.max(1.3,s.ease-0.2);s.due=t;}   // забыт → снова в работу сегодня
    else if(grade===1){s.interval=Math.max(1,Math.round(s.interval*1.2));s.ease=Math.max(1.3,s.ease-0.05);s.due=addDays(t,s.interval);}
    else{s.interval=s.interval<1?1:(s.interval===1?3:Math.round(s.interval*s.ease));s.ease=Math.min(2.8,s.ease+0.05);s.due=addDays(t,s.interval);}
    r.srs=s;r.verified=grade;r.up=t;
    (r.log=r.log||[]).push({t,g:grade});if(r.log.length>30)r.log=r.log.slice(-30);
    if(neighborVk){                                       // шов между соседями — ключ в порядке текста
      const jk=progVerseOrdinal(neighborVk)<progVerseOrdinal(vk)?neighborVk+">"+vk:vk+">"+neighborVk;
      const j=H.junctions[jk]||(H.junctions[jk]={log:[]});
      j.last=grade;j.up=t;j.log.push({t,g:grade});if(j.log.length>20)j.log=j.log.slice(-20);
    }
    _hifzPg=null;save();
    // ИНВАРИАНТ СЛОЁВ: проверка памяти — НЕ чтение. В CREDITED (серия/цель/покрытие)
    // сессия попадает ТОЛЬКО по явному флагу настроек «засчитывать проверку».
    if(H.settings.feedActivity)recordActivity(0,[vk]);
  }
  // Поправка ошибочного тапа: откатывает ПОСЛЕДНЮЮ оценку аята (и её шов) к
  // снапшоту и применяет новую — SRS-шаг ЗАМЕНЯЕТСЯ, а не удваивается.
  // Работает, пока приложение открыто (см. _hifzUndo); иначе — перепроверкой.
  function hifzAmendReview(vk,grade,neighborVk){
    const u=_hifzUndo[vk];if(!u)return false;
    const H=state.hifz;
    if(u.ayah)H.ayahs[vk]=u.ayah;else delete H.ayahs[vk];
    if(u.jk){if(u.junction)H.junctions[u.jk]=u.junction;else delete H.junctions[u.jk];}
    delete _hifzUndo[vk];
    hifzRecordReview(vk,grade,neighborVk);
    return true;
  }
  // Производная ступень памяти аята (НЕ хранится):
  //   "mastered" — подтверждённо освоен (уверенно, interval ≥ HIFZ_MASTER, срок не вышел);
  //   "strong"/"mid"/"weak" — последнее свидетельство (уверенно / с трудом / не помню);
  //   "decl" — только декларация, проверок не было; null — вне hifz-слоя.
  function hifzStage(vk){
    const r=state.hifz.ayahs[vk];if(!r)return null;
    if(r.verified==null)return r.declared?"decl":null;
    if(r.verified===2)return (r.srs&&r.srs.interval>=HIFZ_MASTER&&r.srs.due>=today())?"mastered":"strong";
    return r.verified===1?"mid":"weak";
  }
  // Агрегация LEARNING по страницам мусхафа: по-аятные состояния → verseToPage.
  // Кэш перестраивается при любой hifz-записи; размеры страниц — по ординалам pageStart.
  function hifzPageAgg(){
    if(_hifzPg)return _hifzPg;
    const idx=progBuildPageIdx();if(!idx)return null;
    const size={};for(let i=0;i<idx.length;i++)size[idx[i].page]=(i+1<idx.length?idx[i+1].ord:PROG_AYAH_OFFSET[114]+1)-idx[i].ord;
    const agg={};
    for(const vk in state.hifz.ayahs){
      const p=verseToPage(vk,state.settings.mushafId);if(!p)continue;
      const a=agg[p]||(agg[p]={n:0,mastered:0,weak:0,unverified:0});
      a.n++;const st=hifzStage(vk);
      if(st==="mastered")a.mastered++;
      else if(st==="weak")a.weak++;
      else if(st==="decl"||st===null)a.unverified++;
    }
    _hifzPg={agg,size};return _hifzPg;
  }
  // ═══ СЛОЙ SPEED (скорость чтения) — осознанные замеры беглости ═══
  // ОТДЕЛЬНЫЙ от пассивного таймера привычки: явные СТАРТ/ФИНИШ, а не тик.
  // Лог state.speed.runs[]: {pageId, mushafId, verseKeys, seconds, wordCount, wpm, ts}.
  // Производные (рекорды, средние, тренд) НЕ хранятся — считаются функциями.
  // Активный замер _run НЕ персистится: перезагрузка страницы = отмена замера
  // (осознанный секундомер нельзя «дочитать» в другой сессии).
  const SPEED_RUNS_MAX=400, SPEED_MIN_SEC=5;              // страховка: <5 c — не замер, а случайный тап
  let _run=null,_runPaused=false;
  // Старт замера. info поставляет МОДУЛЬ (данные — его забота, store — только состояние):
  // wordCount — из пословного слоя мушафа; verseKeys — аяты страницы (якорь verse_key).
  function startPageRun(pageId,info){
    _run={pageId,mushafId:state.settings.mushafId,wordCount:(info&&info.wordCount)||0,
      verseKeys:(info&&info.verseKeys)||[],seconds:0};
    _runPaused=false;
  }
  function runInfo(){return _run?{pageId:_run.pageId,seconds:_run.seconds,paused:_runPaused}:null;}
  function cancelPageRun(){_run=null;_runPaused=false;}
  // Финиш: пишет run в лог и возвращает результат с контекстом сравнения
  // (личный рекорд ЭТОЙ страницы до замера, среднее по ней, признак рекорда).
  function finishPageRun(){
    if(!_run)return null;
    const r=_run;_run=null;_runPaused=false;
    if(r.seconds<SPEED_MIN_SEC)return {tooShort:true,seconds:r.seconds};
    const prev=getPageBest(r.pageId);                     // срез ДО записи нового замера
    const wpm=Math.round(r.wordCount/(r.seconds/60)*10)/10;
    const run={pageId:r.pageId,mushafId:r.mushafId,verseKeys:r.verseKeys,seconds:r.seconds,wordCount:r.wordCount,wpm,ts:Date.now()};
    state.speed.runs.push(run);
    if(state.speed.runs.length>SPEED_RUNS_MAX)state.speed.runs=state.speed.runs.slice(-SPEED_RUNS_MAX);
    // Тренировка идёт и в привычку/серию: секунды и аяты — в CREDITED через ту же
    // единственную точку зачёта. Пассивный тик на время замера МОЛЧАЛ (см. tick),
    // поэтому время не двоится; покрытие не двоится дедупом verseKey за день.
    recordActivity(run.seconds,run.verseKeys);
    save();
    return {run,prev,isRecord:!prev.count||wpm>prev.bestWpm};
  }
  // Личный рекорд по КОНКРЕТНОЙ странице — ядро метрики (перечитывание одной
  // страницы фиксирует её сложность; сырые секунды между страницами несравнимы).
  function getPageBest(pageId){
    let count=0,bestWpm=0,bestSeconds=0,sum=0,lastWpm=null;
    for(const r of state.speed.runs){
      if(r.pageId!==pageId)continue;
      count++;sum+=r.wpm;lastWpm=r.wpm;
      if(r.wpm>bestWpm){bestWpm=r.wpm;bestSeconds=r.seconds;}
    }
    return {count,bestWpm,bestSeconds,avgWpm:count?Math.round(sum/count*10)/10:0,lastWpm};
  }
  // Общий WPM-тренд по неделям (обзорный вид, шумнее личных рекордов страниц —
  // разные страницы имеют разную сложность; так и помечаем в UI). 12 недель.
  function getSpeedTrend(){
    const t=today(),mon=addDays(t,-dow(t)),weeks=[];
    for(let w=11;w>=0;w--){
      const from=addDays(mon,-7*w),to=addDays(from,6);
      let sum=0,n=0;
      for(const r of state.speed.runs){const d=iso(new Date(r.ts));if(d>=from&&d<=to){sum+=r.wpm;n++;}}
      weeks.push({week:from,avgWpm:n?Math.round(sum/n*10)/10:0,runs:n});
    }
    return weeks;
  }
  function speedRuns(){return state.speed.runs;}          // живая ссылка — ТОЛЬКО чтение
  function speedSettings(){return JSON.parse(JSON.stringify(state.speed.settings));}
  function speedSetSettings(patch){Object.assign(state.speed.settings,patch||{});save();}
  // Сброс замеров: вся история или одна страница (рекорды — производные, уйдут сами).
  function speedClearAll(){state.speed.runs=[];save();}
  function speedClearPage(pageId){state.speed.runs=state.speed.runs.filter(r=>r.pageId!==pageId);save();}
  // ═══ ПРОИЗВОДНЫЕ (считаются, не хранятся) ═══
  function coveredPages(){const s=new Set();for(const d of state.activityDays)for(const vk of d.verseKeys){const p=verseToPage(vk,state.settings.mushafId);if(p)s.add(p);}return s;}
  function lifeAyahs(){const s=new Set();for(const d of state.activityDays)for(const vk of d.verseKeys)s.add(vk);return s.size;}
  function lifeSeconds(){return state.activityDays.reduce((a,d)=>a+d.activeSeconds,0);}
  function weekMinutes(){const out=[0,0,0,0,0,0,0];const t=today();const mon=addDays(t,-dow(t));for(let i=0;i<7;i++){const r=dayRec(addDays(mon,i),false);out[i]=r?Math.round(r.activeSeconds/60*10)/10:0;}return out;}
  // recomputeStreak — ВСЯ логика серии + гуманного восстановления в одном месте.
  function recomputeStreak(){
    const met=new Set(state.activityDays.filter(d=>d.goalMet).map(d=>d.date));
    const t=today(),rc=state.settings.recovery;
    let cur=met.has(t)?t:addDays(t,-1);                   // сегодня «в процессе» → граница вчера
    let streak=0,autoLeft=rc.autoPerWeek,manualLeft=state.manualRestore.active?rc.manualMaxDays:0,walked=0,autoUsed=0,manualUsed=0;
    while(walked<2000){
      if(walked>0&&walked%7===0)autoLeft=rc.autoPerWeek;  // недельный рефилл авто-бюджета
      if(met.has(cur))streak++;
      else{                                               // пропуск: (а) ручной мостик, (б) авто, иначе конец
        if(manualLeft>0){manualLeft--;manualUsed++;}
        else if(autoLeft>0){autoLeft--;if(walked<7)autoUsed++;}
        else break;
      }
      cur=addDays(cur,-1);walked++;
    }
    return {streak,autoAvailable:autoUsed<rc.autoPerWeek,manualActive:state.manualRestore.active,manualUsed};
  }
  function bestStreak(){const ds=state.activityDays.filter(d=>d.goalMet).map(d=>d.date).sort();let best=0,run=0,prev=null;for(const d of ds){if(prev&&addDays(prev,1)===d)run++;else run=1;best=Math.max(best,run);prev=d;}return best;}
  function milestone(streak){const next=MILESTONES.find(m=>m>streak)||null;const prev=[...MILESTONES].reverse().find(m=>m<=streak)||0;const pct=next?(streak-prev)/(next-prev):1;return {next,prev,pct:Math.max(0,Math.min(1,pct))};}
  function heatDays(){const t=today();const end=addDays(t,6-dow(t));const cells=[];for(let i=83;i>=0;i--){const ds=addDays(end,-i);const r=dayRec(ds,false);cells.push({date:ds,sec:r?r.activeSeconds:0,isToday:ds===t,future:ds>t});}return cells;}
  function todayProg(){const r=dayRec(today(),false);const g=state.settings;const cur=!r?0:(g.goalType==="minutes"?r.activeSeconds/60:r.verseKeys.length);return {current:cur,goal:g.goalValue,type:g.goalType,met:r?r.goalMet:false,pct:Math.min(1,cur/g.goalValue)};}
  // ═══ КОНТРАКТ — ЧТЕНИЕ ═══
  function getSummary(){const st=recomputeStreak();return {today:todayProg(),streak:st.streak,recovery:{autoAvailable:st.autoAvailable,manualActive:st.manualActive},bestStreak:bestStreak(),milestone:milestone(st.streak),week:weekMinutes(),todayDow:dow(today()),lifetimeAyahs:lifeAyahs(),lifetimeSeconds:lifeSeconds(),heat:heatDays(),settings:JSON.parse(JSON.stringify(state.settings)),todayDate:today(),daysCount:state.activityDays.length};}
  function getResume(){return state.resumePosition;}
  function getCoverage(){return coveredPages();}
  // getPageStatus — РЕДЬЮСЕР слоёв: hifz перекрывает reading сверху (когда появится).
  function getPageStatus(pageId){const h=getHifzStatus(pageId);if(h)return h;return coveredPages().has(pageId)?"read":"unread";}
  // ═══ ХУКИ ═══
  // ХУК #3 — РЕАЛЬНЫЙ: статус СТРАНИЦЫ из по-аятного LEARNING-состояния.
  // Якорь — verse_key; страница только ПРОИЗВОДИТСЯ (verseToPage), нигде не хранится.
  //   "mastered" — ВСЕ аяты страницы отслеживаются и закреплены;
  //   "review"   — всё отслеживаемое проверено и держится (нет «не помню» и непроверенного);
  //   "learning" — есть слабые или ещё не подтверждённые; null — hifz-слоя на странице нет.
  function getHifzStatus(pageId){
    const m=hifzPageAgg();if(!m)return null;
    const a=m.agg[pageId];if(!a)return null;
    if(a.mastered===a.n&&a.n>=(m.size[pageId]||Infinity))return "mastered";

  }
  // Читающий hifz-контракт: живые ссылки — ТОЛЬКО чтение (писать — declare/review выше).
  function hifzAyahs(){return state.hifz.ayahs;}
  function hifzSuraDecl(){return state.hifz.suraDecl;}
  function hifzGetAyah(vk){const r=state.hifz.ayahs[vk];return r?JSON.parse(JSON.stringify(r)):null;}
  function hifzSettings(){return JSON.parse(JSON.stringify(state.hifz.settings));}
  function hifzSetSettings(patch){Object.assign(state.hifz.settings,patch||{});save();}
  // ХУК #4: НЕ отдельный поток. Подключено к ЕДИНОМУ бэкапу приложения
  // (exportPersonalData/applyImport). exportState отдаёт снимок; importState
  // сливает дни по датам (union verseKeys, +секунды) и берёт более свежий resume.
  function exportState(){return JSON.parse(JSON.stringify(state));}
  function importState(snap){
    if(!snap||typeof snap!=="object"||!Array.isArray(snap.activityDays))return 0;
    let merged=0;
    for(const day of snap.activityDays){
      if(!day||!day.date)continue;
      const r=dayRec(day.date,true);const before=r.activeSeconds+r.verseKeys.length;
      r.activeSeconds+=(day.activeSeconds||0);
      const set=new Set(r.verseKeys);(day.verseKeys||[]).forEach(vk=>set.add(vk));r.verseKeys=[...set];
      recalcGoal(r);if(r.activeSeconds+r.verseKeys.length!==before)merged++;
    }
    if(snap.resumePosition&&(!state.resumePosition||(snap.resumePosition.touchedAt||"")>(state.resumePosition.touchedAt||"")))state.resumePosition=snap.resumePosition;
    // — hifz (LEARNING): по-аятно и по швам побеждает более свежая запись (up);
    //   декларации сур только дополняются (свои не затираем импортом) —
    if(snap.hifz&&snap.hifz.ayahs){
      const H=state.hifz;
      for(const vk in snap.hifz.ayahs){const inc=snap.hifz.ayahs[vk];const cur=H.ayahs[vk];
        if(inc&&(!cur||(inc.up||"")>(cur.up||"")))H.ayahs[vk]=inc;}
      for(const jk in (snap.hifz.junctions||{})){const inc=snap.hifz.junctions[jk];const cur=H.junctions[jk];
        if(inc&&(!cur||(inc.up||"")>(cur.up||"")))H.junctions[jk]=inc;}
      for(const s in (snap.hifz.suraDecl||{}))if(!(s in H.suraDecl))H.suraDecl[s]=snap.hifz.suraDecl[s];
      _hifzPg=null;
    }
    // — speed (замеры скорости): объединение логов, дедуп по ts+pageId, хронология —
    if(snap.speed&&Array.isArray(snap.speed.runs)){
      const seen=new Set(state.speed.runs.map(r=>r.ts+"|"+r.pageId));
      for(const r of snap.speed.runs)if(r&&r.ts&&!seen.has(r.ts+"|"+r.pageId))state.speed.runs.push(r);
      state.speed.runs.sort((a,b)=>a.ts-b.ts);
      if(state.speed.runs.length>SPEED_RUNS_MAX)state.speed.runs=state.speed.runs.slice(-SPEED_RUNS_MAX);

  }
  // ═══ Таймер активного времени (слой CREDITED; resume не трогает) ═══
  // Тикает ТОЛЬКО когда вкладка видима, с последнего действия < IDLE_LIMIT_SEC,
  // открыта сура и это НЕ Главная и НЕ экран статистики. Каждый тик зачитывает
  // секунды через ту же recordActivity, что дёргает ридер (аяты — из saveLastPos).
  let _lastAction=Date.now(),_started=false;
  function markAction(){_lastAction=Date.now();}
  function tick(){

    // переиспользован как страховка от накрутки — скрытая вкладка и простой
    // секундомер не двигают. Пассивный тик привычки на время замера МОЛЧИТ:
    // секунды замера уйдут в recordActivity одним куском при финише (не двоить).
    if(_run){

    }

    if(Date.now()-_lastAction>=IDLE_LIMIT_SEC*1000)return;
    if(ST.homeMode||progressOpen||!ST.surah)return;
    // Открыт тренажёр хифза: время проверки — НЕ чтение (кормит CREDITED только
    // по явному флагу «засчитывать проверку», тому же, что и аяты сессии).
    if(ST.hifzMode&&!state.hifz.settings.feedActivity)return;

  // Настройка дневной цели — часть ПОЛЬЗОВАТЕЛЬСКОГО контракта (не отладка).

  const debug={
    setGoal,
    resetDay(){state.activityDays=state.activityDays.filter(d=>d.date!==today());save();},
    shiftDay(n){state._debugDayOffset=(state._debugDayOffset||0)+n;save();},

  };
  return {recordActivity,updateResume,setGoal,getSummary,getResume,getCoverage,getPageStatus,getHifzStatus,

    startPageRun,finishPageRun,cancelPageRun,runInfo,getPageBest,getSpeedTrend,speedRuns,speedSettings,speedSetSettings,speedClearAll,speedClearPage,

})();

function progRing(pct){const R=50,C=2*Math.PI*R,off=C*(1-pct);return `<svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="${R}" fill="none" stroke="var(--border)" stroke-width="11"/><circle cx="56" cy="56" r="${R}" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;}

  for(let w=0;w<12;w++){const cells=[];for(let d=0;d<7;d++){const c=s.heat[w*7+d];if(!c)continue;const bg=c.future?"transparent":progHeatColor(c.sec);const bd=c.isToday?"box-shadow:0 0 0 2px var(--accent)":"";cells.push(`<div class="cell" title="${c.date}: ${progFmtTime(c.sec)}" style="background:${bg};${bd}"></div>`);}cols.push(`<div class="col">${cells.join("")}</div>`);}

// Рендер режима в главное окно (из renderCenter); перерисовки внутри режима

// ─── Охват: джуз → сура → пассаж (строгое сужение) ───
// Суры охвата с аятными под-диапазонами: пересечение суры с джузом и пассажем.
// Границы джуза — из qpcMeta.juzStart (конец = начало следующего джуза − 1 аят).
function hifzJuzRange(j){
  const js=qpcMeta&&qpcMeta.juzStart;if(!js||!js[j])return null;
  const a=js[j],b=js[j+1];
  let to={s:114,a:6};
  if(b)to=b.ayah>1?{s:b.surah,a:b.ayah-1}:{s:b.surah-1,a:(SURAHS.find(x=>x.id===b.surah-1)||{n:1}).n};
  return {from:{s:a.surah,a:a.ayah},to};
}
// «78-114, 36, 55» → [36,55,78…114]: диапазоны и отдельные суры, уникальные, в
// порядке мусхафа. Плохие токены не глотаем молча, а возвращаем — UI их покажет,
// иначе опечатка «115» тихо сужала бы охват и человек искал бы причину сам.
function hifzParseSuras(str){
  const out=new Set(),bad=[];
  for(const tok of String(str||"").split(/[,;\s]+/)){
    if(!tok)continue;
    const m=tok.match(/^(\d{1,3})(?:[-–—](\d{1,3}))?$/);
    if(!m){bad.push(tok);continue;}
    let a=+m[1],b=m[2]?+m[2]:a;
    if(a<1||a>114||b<1||b>114){bad.push(tok);continue;}
    if(a>b){const t=a;a=b;b=t;}                     // «114-78» — тот же диапазон, а не пустота
    for(let x=a;x<=b;x++)out.add(x);
  }
  return {list:[...out].sort((x,y)=>x-y),bad};
}
// Охват → список {surah,from,to}. ЕДИНСТВЕННАЯ точка, где охват превращается в
// аяты: пул, статистика, цепочки и слабые места ходят только через неё, поэтому
// новый тип охвата достаточно раскрыть здесь.
function hifzScopeSuras(){
  if(HF.scope.kind==="suras"){                      // несколько сур — целиком, вне границ джуза
    const out=[];
    for(const sid of hifzParseSuras(HF.scope.list).list){
      const su=SURAHS.find(x=>x.id===sid);
      if(su)out.push({surah:sid,from:1,to:su.n,su});
    }
    return out;
  }
  const r=hifzJuzRange(HF.scope.juz);if(!r)return [];
  const out=[];
  for(let s=r.from.s;s<=r.to.s;s++){
    const su=SURAHS.find(x=>x.id===s);if(!su)continue;
    let a1=(s===r.from.s)?r.from.a:1, a2=(s===r.to.s)?r.to.a:su.n;
    if(HF.scope.surah){
      if(s!==HF.scope.surah)continue;
      if(HF.scope.from)a1=Math.max(a1,HF.scope.from);
      if(HF.scope.to)a2=Math.min(a2,HF.scope.to);
    }
    if(a1<=a2)out.push({surah:s,from:a1,to:a2,su});
  }
  return out;
}
function hifzScopeVks(){const vks=[];for(const r of hifzScopeSuras())for(let a=r.from;a<=r.to;a++)vks.push(r.surah+":"+a);return vks;}
function hifzSetScope(part,v){
  if(part==="kind"){                                // переключение типа охвата: джуз ⇄ суры
    HF.scope=v==="suras"
      ? {kind:"suras",list:HF.scope.list||"78-114"} // по умолчанию — муфассаль, самый частый случай
      : {kind:"juz",juz:HF.scope.juz||30,surah:null,from:null,to:null};
  }
  else if(part==="list"){const el=document.getElementById("hfSuras");HF.scope.list=el?el.value:"";}
  else if(part==="juz"){HF.scope={kind:"juz",juz:Math.max(1,Math.min(30,+v||1)),surah:null,from:null,to:null};}
  else if(part==="surah"){HF.scope.surah=+v||null;HF.scope.from=null;HF.scope.to=null;}
  else if(part==="range"){
    const f=+document.getElementById("hfFrom").value||null,t=+document.getElementById("hfTo").value||null;
    HF.scope.from=f;HF.scope.to=t;
  }
  HF.open={};
  Progress.hifzSetSettings({scope:HF.scope});             // последний охват переживает перезапуск
  renderHifz();
}

// ─── Адаптивная гранулярность тепловой карты ───
// Состояние живёт ПО-АЯТНО всегда; меняется только ЯЧЕЙКА ОТОБРАЖЕНИЯ:
// короткий диапазон (джуз 30 и т.п.) — по-аятно; длинные суры — по руку́ (ع),
// если разметка появится в данных (qpcMeta.rukuStart), пока — окно ~5 аятов.
// Единица НЕ фиксируется одна на весь мусхаф.
function hifzUnits(rng){
  const len=rng.to-rng.from+1;
  if(len<=30){const u=[];for(let a=rng.from;a<=rng.to;a++)u.push({from:a,to:a});return u;}
  const rk=qpcMeta&&qpcMeta.rukuStart&&qpcMeta.rukuStart[rng.surah];   // задел: [{ayah},…] начала руку́
  if(Array.isArray(rk)&&rk.length){
    const bounds=rk.map(x=>x.ayah).filter(a=>a>rng.from&&a<=rng.to).sort((a,b)=>a-b);
    const u=[];let cur=rng.from;
    for(const b of bounds){u.push({from:cur,to:b-1});cur=b;}
    u.push({from:cur,to:rng.to});return u;
  }
  const u=[];for(let a=rng.from;a<=rng.to;a+=5)u.push({from:a,to:Math.min(rng.to,a+4)});
  if(u.length>1&&u[u.length-1].to-u[u.length-1].from<2)u[u.length-2].to=u.pop().to;  // хвост <3 аятов клеим к предыдущему
  return u;
}

// ─── Производные по охвату (НЕ хранятся — считаются из store) ───
function hifzRangeCounts(surah,from,to){
  const c={mast:0,strong:0,mid:0,weak:0,decl:0,none:0,n:to-from+1};
  for(let a=from;a<=to;a++){
    const st=Progress.hifzStage(surah+":"+a);
    if(st==="mastered")c.mast++;else if(st==="strong")c.strong++;else if(st==="mid")c.mid++;
    else if(st==="weak")c.weak++;else if(st==="decl")c.decl++;else c.none++;
  }
  return c;
}
// Индикатор цели: сколько охвата подтверждённо освоено и сколько «мест» осталось
// (место = непрерывный кусок не-освоенных аятов в порядке текста).
function hifzScopeStats(){
  let total=0,mast=0,places=0,inRun=false;
  const agg={mast:0,strong:0,mid:0,weak:0,decl:0,none:0};
  for(const r of hifzScopeSuras())for(let a=r.from;a<=r.to;a++){
    total++;const st=Progress.hifzStage(r.surah+":"+a);
    if(st==="mastered"){mast++;agg.mast++;inRun=false;}
    else{
      if(!inRun){places++;inRun=true;}
      if(st==="strong")agg.strong++;else if(st==="mid")agg.mid++;else if(st==="weak")agg.weak++;
      else if(st==="decl")agg.decl++;else agg.none++;
    }
  }
  return {total,mast,places,agg};
}

// ─── Пул проверки: аяты охвата, ВЗВЕШЕННЫЕ к слабым ───
// Исключаем подтверждённо-освоенные (проверенно-зелёное не тестируем).
// Вес растёт от: декларации «нетвёрдо/не знаю», отсутствия проверок, последней
// слабой оценки, просроченного SRS-срока; свежеподтверждённые — сильно вниз.
function hifzDaysLate(due,t){return Math.max(0,Math.round((new Date(t)-new Date(due))/864e5));}
function hifzPool(){
  const t=Progress.todayISO(),A=Progress.hifzAyahs(),out=[];
  for(const vk of hifzScopeVks()){
    const st=Progress.hifzStage(vk);
    if(st==="mastered")continue;
    const r=A[vk];let w=1;
    const d=r&&r.declared;
    if(d==="shaky")w+=2;else if(d==="no")w+=3;else if(!d)w+=1;      // без декларации — тоже неизвестность
    if(!r||r.verified==null)w+=1;                                   // ни разу не проверялся
    else{
      if(r.verified===0)w+=4;else if(r.verified===1)w+=2;
      if(r.srs){if(r.srs.due<=t)w+=Math.min(4,1+hifzDaysLate(r.srs.due,t)*0.5);else w*=0.25;}
    }
    out.push({vk,w});
  }
  return out;
}
function hifzPick(pool){
  let sum=0;for(const p of pool)sum+=p.w;
  let x=Math.random()*sum;
  for(const p of pool){x-=p.w;if(x<=0)return p.vk;}
  return pool[pool.length-1].vk;
}

// ─── Раунд: случайная точка входа + цепочка (НЕ одиночный рандом) ───
// Взвешенно выбранный слабый аят становится ПЕРВЫМ звеном цепочки; показываемая
// точка входа — его сосед ПЕРЕД ним по направлению (вперёд/назад). Если соседа
// в охвате нет — «соло»-подсказка: только адрес сура:аят. Цепочка не выходит
// за пределы суры и охвата.
function hifzMakeRound(vk){
  const S=Progress.hifzSettings(),K=Math.max(1,Math.min(10,S.K||4)),dir=S.backward?-1:1;
  const p=vk.split(":"),s=+p[0],a=+p[1];
  const rng=hifzScopeSuras().find(r=>r.surah===s);if(!rng)return null;
  const chain=[];
  for(let i=0;i<K;i++){const aa=a+dir*i;if(aa<rng.from||aa>rng.to)break;chain.push(s+":"+aa);}
  if(!chain.length)return null;
  const anch=a-dir;
  const start=(anch>=rng.from&&anch<=rng.to)?s+":"+anch:null;
  return {start,chain,revealed:false,grades:{}};
}
function hifzBeginSession(){HF.sess={n:0,g:[0,0,0],round:null,loading:false,empty:false};hifzNextRound();}
async function hifzNextRound(){
  const pool=hifzPool();
  if(!pool.length){HF.sess.round=null;HF.sess.empty=true;renderHifz();return;}
  let round=null;
  for(let i=0;i<25&&!round;i++)round=hifzMakeRound(hifzPick(pool));
  if(!round){HF.sess.round=null;HF.sess.empty=true;renderHifz();return;}
  HF.sess.round=round;HF.sess.empty=false;HF.sess.n++;HF.sess.loading=true;
  renderHifz();
  const s=+round.chain[0].split(":")[0],ru=hifzRuId();     // тексты — лениво, только нужная сура
  await loadChunk("_arabic",s);if(ru)await loadChunk(ru,s);
  HF.sess.loading=false;renderHifz();
}
function hifzReveal(){if(HF.sess&&HF.sess.round)HF.sess.round.revealed=true;renderHifz();}
// Адрес отдельно от цепочки: «вспомнил суру» и «вспомнил продолжение» — разные шаги.
function hifzShowRef(){if(HF.sess&&HF.sess.round)HF.sess.round.refShown=true;renderHifz();}
// Само-оценка звена: 0=не помню / 1=с трудом / 2=уверенно. Свидетельство уходит
// в store по-аятно; сосед по порядку вспоминания даёт junction-состояние шва.
// Ошибочный тап МОЖНО поправить, нажав другую кнопку: SRS-шаг заменяется через
// hifzAmendReview (откат к снапшоту + новая оценка), а не удваивается.
function hifzGrade(i,g){
  const R=HF.sess&&HF.sess.round;
  if(!R||!R.revealed)return;
  const old=R.grades[i];
  if(old===g)return;                                       // та же кнопка — ничего не делаем
  const nb=i===0?R.start:R.chain[i-1];
  if(old!=null){                                           // поправка ошибочной оценки
    if(!Progress.hifzAmendReview(R.chain[i],g,nb||null))return;
    HF.sess.g[old]--;
  }else{
    Progress.hifzRecordReview(R.chain[i],g,nb||null);
  }
  R.grades[i]=g;HF.sess.g[g]++;
  renderHifz();
}

// Русский текст — первый ВКЛЮЧЁННЫЙ не-арабский перевод в пользовательском порядке;
// если переводы выключены — первый kind:translation из конфига. Ничего не зашито.
function hifzRuId(){
  const en=getEnabledList().find(t=>t.id!=="_notes"&&t.lang!=="ar"&&t.kind==="translation");
  if(en)return en.id;
  const any=CONFIG.tafsirs.find(t=>t.kind==="translation"&&t.lang!=="ar");
  return any?any.id:null;
}
function hifzRuText(s,a){const id=hifzRuId();if(!id)return "";const c=getChunk(id,s);return (c&&c[String(a)])||"";}
function hifzSuName(s){const su=SURAHS.find(x=>x.id===s);return su?su.ru:("Сура "+s);}

function renderHifz(){
  const body=document.getElementById("hifzBody");if(!body)return;
  body.innerHTML=`<div class="prog-h">Проверка заучивания</div><div class="prog-sub">Карта памяти · взвешенный пул · цепочки · SRS</div>
    <div class="hf-tabs">
      <button class="${HF.tab==="map"?"on":""}" onclick="hifzTab('map')">🗺 Карта</button>
      <button class="${HF.tab==="quiz"?"on":""}" onclick="hifzTab('quiz')">🎯 Проверка</button>
    </div>
    <button class="cov-map-open" onclick="hrStart()" title="Полноэкранный показ: один аят, тап по экрану — следующий">🤲 Чтение наизусть — аят на весь экран, тап = дальше</button>`
    +(HF.tab==="map"?hifzMapHTML():hifzQuizHTML());
}
function hifzTab(t){HF.tab=t;if(t==="quiz"&&!HF.sess)hifzBeginSession();else renderHifz();}

// ═══ ОБЗОРНАЯ КАРТА: единая иерархия зума джузы → суры → аяты ═══
// Один компонент с тремя ступенями детализации. Все уровни — ЧИСТЫЕ рендеры
// производных агрегатов от одних и тех же по-аятных hifz-состояний store:
// никаких отдельных хранилищ, агрегат считается ОДИН раз на рендер (hifzAggAll)
// и передаётся вниз. Эпистемика везде одна: КОНТУР = декларация, ЗАЛИВКА =
// только подтверждённое проверками (красные провалы — лишь на уровне аятов).
// Состояние зума — HF.zoom={level:1|2|3, juz, surah}; по умолчанию уровень 2.

// Ординалы начал джузов (статика из qpcMeta на сессию; [31] — конец Корана+1).
let _hifzJuzOrds=null;
function hifzJuzOrds(){
  if(_hifzJuzOrds)return _hifzJuzOrds;
  const js=qpcMeta&&qpcMeta.juzStart;if(!js)return null;
  const arr=[];
  for(let j=1;j<=30;j++){const a=js[j];if(!a)return null;arr[j]=progVerseOrdinal(a.surah+":"+a.ayah);}
  arr[31]=PROG_AYAH_OFFSET[114]+1;
  _hifzJuzOrds=arr;return arr;
}
function hifzJuzSuraCount(j){                             // сколько сур пересекает джуз j
  const js=qpcMeta.juzStart,a=js[j],b=js[j+1];
  const endS=b?(b.ayah>1?b.surah:b.surah-1):114;
  return endS-a.surah+1;
}
// ЕДИНЫЙ агрегат для обзорных уровней: один проход по записям hifz-слоя
// (только тронутые аяты), суммы по сурам и джузам. Не хранится — на рендер.
function hifzAggAll(){
  const A=Progress.hifzAyahs();
  const bySura={};for(const su of SURAHS)bySura[su.id]={n:su.n,mast:0,part:0,dWorst:null};
  const jOrd=hifzJuzOrds();
  const byJuz={};if(jOrd)for(let j=1;j<=30;j++)byJuz[j]={total:jOrd[j+1]-jOrd[j],mast:0,part:0,dWorst:null};
  const rank=d=>d==="no"?3:d==="shaky"?2:d==="know"?1:0;
  for(const vk in A){
    const s=+vk.split(":")[0];const o=bySura[s];if(!o)continue;
    const st=Progress.hifzStage(vk);
    const d=A[vk].declared||null;
    if(rank(d)>rank(o.dWorst))o.dWorst=d;
    if(st==="mastered")o.mast++;
    else if(st==="strong"||st==="mid"||st==="weak")o.part++;   // «жёлтый градус»: проверено, в работе
    if(jOrd){
      const ord=progVerseOrdinal(vk);
      let j=1;while(j<30&&jOrd[j+1]<=ord)j++;
      const J=byJuz[j];
      if(rank(d)>rank(J.dWorst))J.dWorst=d;
      if(st==="mastered")J.mast++;else if(st==="strong"||st==="mid"||st==="weak")J.part++;
    }
  }
  return {bySura,byJuz};
}
// Ближайшие белые/слабые места в текущем окне работы (охвате): непрерывные
// куски не-освоенных аятов, первые maxN. Производная, не хранится.
function hifzWeakSpots(maxN){
  const out=[];
  for(const r of hifzScopeSuras()){
    let cur=null;
    for(let a=r.from;a<=r.to;a++){
      if(Progress.hifzStage(r.surah+":"+a)!=="mastered"){
        if(cur)cur.to=a;else cur={s:r.surah,from:a,to:a};
      }else if(cur){out.push(cur);cur=null;if(out.length>=maxN)return out;}
    }
    if(cur){out.push(cur);if(out.length>=maxN)return out;}
  }
  return out;
}
// Навигация зума. «Назад» (аппаратная/жест) поднимает на уровень выше — см.
// hifzZoomBack, встроенный в общий popstate-обработчик.
function hifzZoomTo(level,juz,surah){
  if(level===3&&surah&&!juz)juz=juzOfSurah(surah);
  HF.zoom={level,juz:juz||null,surah:surah||null};
  if(level===3&&surah)HF.open[surah]=true;                // аятный уровень — сура сразу развёрнута
  renderHifz();
  if(level===2&&juz)setTimeout(()=>{const el=document.querySelector(".hfz-cell.focus");if(el)el.scrollIntoView({block:"center"});},30);
}
function hifzZoomBack(){                                   // true = поднялись; false = уровень 1, пусть закрывается
  if(HF.tab==="quiz"){HF.tab="map";renderHifz();return true;}
  const z=HF.zoom||{};
  if(z.level===3){hifzZoomTo(2,z.juz);return true;}
  if(z.level===2){hifzZoomTo(1);return true;}
  return false;
}
function hifzBcHTML(){                                     // хлебная крошка: Коран → Джуз N → Сура M
  const z=HF.zoom,parts=[];
  parts.push(z.level===1?`<span class="cur">Коран</span>`:`<button onclick="hifzZoomTo(1)">Коран</button>`);
  if(z.level>=2&&z.juz)parts.push(z.level===2?`<span class="cur">Джуз ${z.juz}</span>`:`<button onclick="hifzZoomTo(2,${z.juz})">Джуз ${z.juz}</button>`);
  if(z.level===2&&!z.juz)parts.push(`<span class="cur">Все суры</span>`);
  if(z.level===3){const su=SURAHS.find(x=>x.id===z.surah);parts.push(`<span class="cur">${z.surah}. ${su?esc(su.ru):""}</span>`);}
  const whole=z.level===2?`<button class="hf-go" style="margin-left:auto" onclick="hifzZoomTo(1)">весь Коран</button>`:"";
  const cols=z.level<3?`<span style="margin-left:${z.level===2?"8px":"auto"}"></span>${qtColsCtl()}`:"";
  return `<div class="hfz-bc">${parts.join(`<span class="sep">→</span>`)}${whole}${cols}</div>`;
}
// ═══ ОВЕРЛЕЙ-ФИЛЬТРЫ структуры мусхафа (Мекка/Медина, периоды, мукатта'ат,
// мусаббихат, пары) — чисто ВИЗУАЛЬНЫЙ слой поверх уровней 1–2 карты. ═══
// Источник — статичный data/surah-classifications.json (класс surah_meta);
// грузится лениво один раз, кэш в памяти (НЕ localStorage). Никакой записи в
// store: оверлей — чистая функция от JSON + активного чипа (HF.ovl). На пул
// проверки и селектор охвата не влияет — это просмотр, не отбор.
// ИНВАРИАНТ: заливка = истина заучивания, контур = декларация; оверлей их не
// перекрашивает — несовпадающие ячейки притушаются, совпадающие получают бейдж.
let HFO=null,_hfoLoading=false;
// ДВЕ ПОВЕРХНОСТИ, одна механика: те же чипы фильтров/порядков и матчинг
// обслуживают (а) режим хифза (ST.hifzMode) и (б) таблицу Корана на Главной
// (QT). У каждой — своё независимое состояние; _ovlEnv() решает, чьё сейчас
// активно, по активному режиму (режимы взаимоисключающие — конфликтов нет).
const QT={level:"suras",juz:null,ovl:{group:null,value:null,sub:null},ord:"mushaf",
  rows:gs("qtRows","plain"),                              // разрывы рядов: plain|fatiha|manzil|period
  m89:gs("qtM89",false)};                                 // Анфаль+Тауба одной ячейкой
function _ovlEnv(){return ST.hifzMode?[HF,renderHifz]:[QT,renderQuranTable];}
// Плотность сетки таблицы (ячеек в ряду): 0 = авто (по ширине экрана), 3–16 —
// фиксированно. Общая настройка для таблицы Главной и карты хифза (tl_qtCols).
function qtGridCols(){const c=gs("qtCols",0);return c?`grid-template-columns:repeat(${c},1fr);`:"";}
function qtGridStyle(){const d=qtGridCols();return d?` style="${d}"`:"";}
function qtColsBump(d){
  let c=gs("qtCols",0);
  if(d>0)c=c?Math.min(16,c+1):4;                          // из «авто» плюс начинает с 4
  else c=(c&&c>3)?c-1:0;                                  // ниже 3 — обратно в «авто»
  ss("qtCols",c);
  _ovlEnv()[1]();                                         // перерисовать активную поверхность
}
function qtColsCtl(){
  const c=gs("qtCols",0);
  return `<span class="lbl">Сетка:</span><span class="qt-step"><button onclick="qtColsBump(-1)" title="Меньше ячеек в ряду">−</button><b>${c||"авто"}</b><button onclick="qtColsBump(1)" title="Больше ячеек в ряду">+</button></span>`;
}
function hfoLoad(){
  if(HFO||_hfoLoading)return;
  _hfoLoading=true;
  fetch(resolveUrl("surah_meta")).then(r=>r.ok?r.json():null).then(d=>{
    if(d&&Array.isArray(d.surahs)){HFO={data:d,by:{}};for(const s of d.surahs)HFO.by[s.n]=s;}
    _hfoLoading=false;
    if(ST.hifzMode)renderHifz();else if(ST.homeMode)renderQuranTable();
  }).catch(()=>{_hfoLoading=false;});
}
// Стабильные оттенки: семействам мукатта'ат — по порядку в families_legend, парам — по индексу.
function hfoFamColor(fam){
  const keys=Object.keys(HFO.data.families_legend||{});
  const i=Math.max(0,keys.indexOf(fam));
  return `hsl(${(i*31)%360},52%,42%)`;
}
function hfoPairColor(i){return `hsl(${(i*79+15)%360},55%,42%)`;}
const HFO_PERIODS=[["tiwal","ат-Тивал"],["miun","аль-Миун"],["mathani","аль-Масани"],["mufassal","аль-Муфассаль"]];
const HFO_SUBS=[["tiwal_mufassal","длинный"],["awsat_mufassal","средний"],["qisar_mufassal","короткий"]];
// Матчинг суры против активного чипа: null = фильтра нет, false = притушить,
// объект = совпала (бейдж {t:текст, c:цвет, title}).
function hfoMatch(sid){
  const o=_ovlEnv()[0].ovl;if(!o||!o.group||!HFO)return null;
  const c=HFO.by[sid];if(!c)return false;
  if(o.group==="rev"){
    if(c.revelation!==o.value)return false;
    return c.revelation_disputed
      ?{t:"?",c:"#8a8a8a",title:"место ниспослания оспаривается"}
      :{t:"●",c:o.value==="meccan"?"#c98a1e":"#3a7bd5",title:o.value==="meccan"?"мекканская":"мединская"};
  }
  if(o.group==="period"){
    if(c.period!==o.value)return false;
    if(o.value==="mufassal"&&o.sub&&c.mufassal_sub!==o.sub)return false;
    const sub=c.mufassal_sub?(HFO_SUBS.find(x=>x[0]===c.mufassal_sub)||[])[1]:null;
    return {t:"●",c:"#3a7bd5",title:(HFO_PERIODS.find(x=>x[0]===c.period)||[])[1]+(sub?" · "+sub:"")};
  }
  if(o.group==="muq"){
    if(!c.muqattaat)return false;
    if(o.value&&c.muqattaat_family!==o.value)return false;
    // при активном фильтре в бейдже — сами буквы, цвет семейства
    return {t:c.muqattaat,c:hfoFamColor(c.muqattaat_family),title:HFO.data.families_legend[c.muqattaat_family]||c.muqattaat};
  }
  if(o.group==="musab"){
    if(!c.musabbihat)return false;
    return c.musabbihat==="core"
      ?{t:"●",c:"#3a7bd5",title:"мусаббихат: начинается с тасбиха"}
      :{t:"◐",c:"#8a6cc9",title:"мусаббихат — расширенный список (императив «саббих»)"};  // вторая тональность (87)
  }
  if(o.group==="pairs"){
    const i=(HFO.data.pairs||[]).findIndex(p=>(p.surahs||[]).includes(sid));
    if(i<0)return false;
    const p=HFO.data.pairs[i];
    return {t:"⧉",c:hfoPairColor(i),title:p.label+" — "+(p.note||"")};
  }
  return null;
}
function hfoBadge(m){return m?`<span class="ob" style="background:${m.c}" title="${escAttr(m.title)}">${esc(m.t)}</span>`:"";}
// Совпадения по джузам (сура «в джузе», если пересекает его) — для уровня 1.
function hfoJuzCounts(){
  const jOrd=hifzJuzOrds(),out={};
  for(const su of SURAHS){
    if(!hfoMatch(su.id))continue;
    const o1=PROG_AYAH_OFFSET[su.id-1]+1,o2=PROG_AYAH_OFFSET[su.id];
    let j1=1;while(j1<30&&jOrd[j1+1]<=o1)j1++;
    let j2=j1;while(j2<30&&jOrd[j2+1]<=o2)j2++;
    for(let j=j1;j<=j2;j++)out[j]=(out[j]||0)+1;
  }
  return out;
}
// Чипы: активна ОДНА группа за раз, повторный тап по активному — снимает.
// Работают в активном контексте (_ovlEnv): карта хифза или таблица на Главной.
function hfoChip(group,value){
  const [S,rr]=_ovlEnv(),o=S.ovl;
  if(o.group===group&&(o.value||null)===(value||null))S.ovl={group:null,value:null,sub:null};
  else S.ovl={group,value:value||null,sub:null};
  rr();
}
function hfoSub(sub){const [S,rr]=_ovlEnv();S.ovl.sub=(S.ovl.sub===sub?null:sub);rr();}
function hfoFam(fam){const [S,rr]=_ovlEnv();S.ovl.value=(S.ovl.value===fam?null:fam);rr();}
function hfoChipsHTML(){
  if(!HFO)return _hfoLoading?`<div class="hf-muted" style="margin-top:8px">Загружаю классификации сур…</div>`:"";
  const o=_ovlEnv()[0].ovl;
  const chip=(g,v,lab,title)=>`<button class="chip ${o.group===g&&(o.value||null)===(v||null)?"on":""}" ${title?`title="${escAttr(title)}"`:""} onclick="hfoChip('${g}'${v?`,'${v}'`:""})">${lab}</button>`;
  let row=`<div class="hfo-chips"><span class="lbl">Фильтр:</span>`
    +chip("rev","meccan","Мекка")+chip("rev","medinan","Медина")
    +HFO_PERIODS.map(p=>{
      // группа периодов: чип активен и при выбранном подтипе
      const on=o.group==="period"&&o.value===p[0];
      return `<button class="chip ${on?"on":""}" onclick="hfoChip('period','${p[0]}')">${p[1]}</button>`;
    }).join("")
    +chip("muq",null,"Мукатта'ат","суры с «разрозненными буквами»")
    +chip("musab",null,"Мусаббихат","суры, начинающиеся с тасбиха")
    +chip("pairs",null,"Пары","классические пары сур")+`</div>`;
  if(o.group==="period"&&o.value==="mufassal")
    row+=`<div class="hfo-chips"><span class="lbl">муфассаль:</span>`+HFO_SUBS.map(s=>
      `<button class="chip ${o.sub===s[0]?"on":""}" onclick="hfoSub('${s[0]}')">${s[1]}</button>`).join("")+`</div>`;
  return row+hfoLegendHTML();
}
// Компактная сворачиваемая легенда активного фильтра (из families_legend / meta).
function hfoLegendHTML(){
  const o=_ovlEnv()[0].ovl;if(!o.group)return "";
  const M=HFO.data.meta||{};let body="";
  if(o.group==="rev")body=esc(M.revelation_basis||"")+" Бейдж «?» — место ниспослания оспаривается.";
  else if(o.group==="period")body=esc(M.period_rule||"");
  else if(o.group==="muq")body=Object.entries(HFO.data.families_legend||{}).map(([k,v])=>
    `<button class="fam ${o.value===k?"on":""}" onclick="hfoFam('${k}')" title="показать только это семейство"><span class="sw" style="background:${hfoFamColor(k)}"></span>${esc(v)}</button>`).join("");
  else if(o.group==="musab")body=esc(M.musabbihat_note||"");

    `<span class="fam"><span class="sw" style="background:${hfoPairColor(i)}"></span>${esc(p.label)} (${p.surahs.join(", ")}) — ${esc(p.note||"")}</span>`).join("");
  return `<details class="hfo-leg" open><summary>Легенда фильтра</summary><div class="body">${body}</div></details>`;
}

// Уровень 1 — джузы: 30 ячеек, заливка «уровнем жидкости» по доле закреплённого.
function hifzL1HTML(agg){
  // активный оверлей: джузы без совпадающих сур притушить, у остальных — бейдж с числом
  const jc=HF.ovl&&HF.ovl.group&&HFO?hfoJuzCounts():null;

      <div class="fg" style="height:${g.toFixed(1)}%"></div><div class="fy" style="bottom:${g.toFixed(1)}%;height:${y.toFixed(1)}%"></div>
      <div class="big">${j}</div><div class="sub">${hifzJuzSuraCount(j)} сур · ${J.total} а.</div>

}
// Порядки сур для уровня 2: мусхафный (общепринятый), хронологический
// (тартиб ан-нузуль из surah-classifications.json, египетская хронология —
// та же разметка, что в мусхафе Короля Фахда) и по длине (от коротких —
// естественный порядок заучивания). Порядок — только способ РАССТАНОВКИ
// ячеек; состояние, заливки и охват не меняются.
function hifzOrdChip(v,lab,title){return `<button class="chip ${_ovlEnv()[0].ord===v?"on":""}" title="${escAttr(title)}" onclick="hifzSetOrd('${v}')">${lab}</button>`;}
function hifzSetOrd(v){const [S,rr]=_ovlEnv();S.ord=v;rr();}
function hifzOrdRowHTML(){
  return `<div class="hfo-chips"><span class="lbl">Порядок:</span>`
    +hifzOrdChip("mushaf","мусхаф","общепринятый порядок мусхафа (1 → 114)")
    +(HFO?hifzOrdChip("chrono","ниспослание","хронологический — тартиб ан-нузуль (египетская хронология, как в мусхафе Короля Фахда)"):"")
    +hifzOrdChip("length","по длине","от коротких к длинным — естественный порядок заучивания")+`</div>`;
}
function hifzOrderedSuras(){
  const ord=_ovlEnv()[0].ord;
  if(ord==="chrono"&&HFO)return [...SURAHS].sort((a,b)=>((HFO.by[a.id]||{}).chrono||999)-((HFO.by[b.id]||{}).chrono||999));
  if(ord==="length")return [...SURAHS].sort((a,b)=>a.n-b.n||a.id-b.id);
  return SURAHS;                                           // мусхафный — как есть
}
// Уровень 2 — все 114 сур плотной сеткой («таблица Менделеева»).
// Группировка по джузам (чипы «дж N») — только в мусхафном порядке; в
// хронологическом вместо неё — номер ниспослания.
function hifzL2HTML(agg){
  const js=qpcMeta.juzStart;
  const juzAt={};for(let j=2;j<=30;j++)juzAt[js[j].surah]=(juzAt[js[j].surah]||[]).concat(j);
  const mushaf=HF.ord==="mushaf",chrono=HF.ord==="chrono";
  let cells="";
  for(const su of hifzOrderedSuras()){
    const o=agg.bySura[su.id];
    const g=(o.mast/o.n*100),y=(o.part/o.n*100);
    const chips=mushaf?(juzAt[su.id]||[]).map(j=>`дж ${j}`).join(","):
      (chrono&&HFO&&HFO.by[su.id]?`${HFO.by[su.id].chrono}-я`:"");  // в хронологии — номер ниспослания
    const focus=HF.zoom.juz&&juzOfSurah(su.id)===HF.zoom.juz;
    // оверлей: m=null (фильтра нет) / false (притушить) / бейдж; заливку и контур не трогаем
    const m=hfoMatch(su.id);
    // вечная микро-метка «аномальной ячейки»: ат-Тауба без басмалы (независимо от фильтров)
    const anom=HFO&&HFO.by[su.id]&&HFO.by[su.id].no_basmala?`<span class="anom" title="${escAttr(su.ru)}: единственная сура без басмалы">٭</span>`:"";
    cells+=`<div class="hfz-cell ${o.dWorst?"d-"+o.dWorst:""} ${focus?"focus":""} ${m===false?"hfo-dim":""}" onclick="hifzZoomTo(3,null,${su.id})" title="${su.id}. ${escAttr(su.ru)}: закреплено ${o.mast} из ${o.n}${m?` · ${escAttr(m.title)}`:""}">
      <div class="fg" style="height:${g.toFixed(1)}%"></div><div class="fy" style="bottom:${g.toFixed(1)}%;height:${y.toFixed(1)}%"></div>

  }
  return `<div class="hfz-grid suras"${qtGridStyle()}>${cells}</div>`;
}
// ═══ ТАБЛИЦА КОРАНА НА ГЛАВНОЙ (навигатор структуры мусхафа) ═══
