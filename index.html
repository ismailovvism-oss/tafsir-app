.vp-step button{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:15px;cursor:pointer;line-height:1}
.vp-step b{min-width:48px;text-align:center;font-size:12px;font-weight:600}
.vp-note{font-size:11px;color:var(--text-muted);line-height:1.4;padding:6px 0 2px}
.vp-reset{width:100%;margin-top:8px;padding:7px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text-sec);font-family:inherit;font-size:12px;cursor:pointer}
.vp-reset:hover{color:var(--text)}
.vp-close{width:100%;margin-top:6px;padding:8px;border:none;border-radius:7px;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.np-sel,.np-num{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--text);outline:none}
/* segmented mode switch (Аяты | Мусхаф) */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:none;background:var(--bg);color:var(--text-sec);font-family:inherit;cursor:pointer;padding:6px 11px;font-size:12px}
.seg button.on{background:var(--accent);color:#fff}
.seg-sm button{padding:5px 9px;font-size:11px}
/* shared bottom prev/next navigation bar */
.bottom-nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--border);background:var(--bg-card);flex-shrink:0}
.bn-arrow{background:var(--bg-alt);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:16px;line-height:1;color:var(--text);flex:none}
.bn-arrow:disabled{opacity:.35;cursor:default}
.bn-mid{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
/* Единый навигатор (2026-08-07): селекты .bn-unit/.bn-val заменены кнопкой-позицией */
.bn-pos{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn-pos:hover{border-color:var(--accent)}
.bn-chev{opacity:.5;font-size:9px;flex-shrink:0}
.ash-units{display:flex;gap:5px;padding:0 10px 10px}
.ash-units button{flex:1;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:7px 3px;font-size:12px;font-weight:600;color:var(--text-sec);cursor:pointer;font-family:inherit}
.ash-units button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ash-numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;padding:2px 10px 8px}
.ash-numgrid .ash-chip{text-align:center;padding:7px 0}
.ash-numgrid .ash-chip.cur{background:var(--accent);border-color:var(--accent);color:#fff}
/* Режим без касания: кнопочная панель вне области текста + блокировка касаний текста */
.notouch-nav{display:flex;align-items:stretch;gap:6px;padding:6px 8px}
.nt-btn{flex:1;min-height:48px;border:1px solid var(--border);border-radius:8px;background:var(--bg-alt);color:var(--text);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.nt-btn:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.nt-side{flex:1.4}
.nt-scroll{flex:1;font-size:18px}
body.notouch #readingArea,body.notouch .mushaf-shell{pointer-events:none}

/* SEARCH */
.sp-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0}
.sp-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;outline:none;color:var(--text);background:var(--bg)}
.sp-input:focus{border-color:var(--accent)}
.sp-close{background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-muted);padding:4px}
.sp-opts{padding:4px 2px 6px;display:flex;gap:10px;align-items:center;font-size:11px;color:var(--text-sec);flex-wrap:wrap}
.sp-opt-label{display:flex;align-items:center;gap:3px;cursor:pointer}
.sp-opt-label input{margin:0}
.sp-results{padding:2px 0}
.sp-result{padding:10px 12px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:background .1s}
.sp-result:hover{background:var(--bg-alt)}
.sp-result:last-child{border-bottom:none}
.sp-ref{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px}
.sp-jump{background:var(--bg-alt);border-bottom:1px solid var(--border)}
.sp-jump .sp-ref{font-size:13px}
.sp-src{font-size:10px;color:var(--text-muted);margin-bottom:4px}
.sp-text{font-size:13px;line-height:1.6;color:var(--text-sec)}
.sp-text.rtl{direction:rtl;text-align:right;font-family:'Noto Naskh Arabic','Amiri',serif;font-size:15px}
.sp-hl{background:#FFE082;color:#333;border-radius:2px;padding:0 1px}
.sp-status{padding:12px;text-align:center;color:var(--text-muted);font-size:12px}
.sp-count{font-size:11px;color:var(--text-muted);padding:3px 2px 6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.sp-count.hidden{display:none}   /* правила не было вовсе: класс вешался, а счётчик оставался виден */
@media print{body{display:none!important}}
/* — Главная (5-й режим) — */
.home{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.home-inner{max-width:680px;margin:0 auto;padding:18px 16px 40px}
.home-cont{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-hover) 100%);color:#fff;border-radius:14px;padding:16px 18px;cursor:pointer;margin-bottom:22px;box-shadow:0 4px 16px rgba(var(--accent-rgb),.35)}
.home-cont:active{opacity:.9}
.home-cont .hc-lbl{font-size:12px;opacity:.85;margin-bottom:6px;letter-spacing:.02em}
.home-cont .hc-main{font-size:21px;font-weight:600}
.home-cont .hc-main .ar{font-size:18px;opacity:.9;margin-right:4px}
.home-cont .hc-sub{font-size:13px;opacity:.85;margin-top:4px}
.home-sec{margin-bottom:24px}
.home-sec-h{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:8px;border-left:3px solid var(--accent);padding-left:8px}
.home-nav-link{display:flex;align-items:center;gap:12px;border:1px solid rgba(var(--accent-rgb),.25);border-radius:12px;padding:14px 16px;cursor:pointer;background:linear-gradient(180deg,transparent 0%,rgba(var(--accent-rgb),.06) 100%);transition:border-color .12s,box-shadow .12s}
.home-nav-link:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(var(--accent-rgb),.18)}
.home-nav-link .hnl-ic{font-size:22px;line-height:1}
.home-nav-link .hnl-main{flex:1;font-size:16px;font-weight:600;color:var(--text)}
.home-nav-link .hnl-sub{font-size:12px;color:var(--text-muted);font-weight:400}
.home-nav-link .hnl-arrow{color:var(--accent);font-size:18px;font-weight:700}
.home-edit-btn{margin-left:auto;background:none;border:none;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px;color:var(--text-muted)}
.home-edit-btn:hover{background:var(--border)}
.home-recent{display:flex;flex-direction:column;gap:2px}
.home-rrow{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:10px;cursor:pointer;background:var(--card,transparent)}
.home-rrow:hover{background:var(--border)}
.home-rrow .hr-name{font-size:16px}
.home-rrow .hr-name .ar{opacity:.7;margin-right:4px;font-size:15px}
.home-rrow .hr-sub{font-size:12px;color:var(--text-muted);white-space:nowrap}
.home-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.home-tile{border:1px solid rgba(var(--accent-rgb),.25);border-radius:12px;padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,transparent 0%,rgba(var(--accent-rgb),.06) 100%);transition:border-color .12s,box-shadow .12s}
.home-tile:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(var(--accent-rgb),.22)}
.home-tile:active{opacity:.85}
.home-tile .ht-main{font-size:15px;font-weight:500;line-height:1.25}
.home-tile .ht-ar{font-size:14px;opacity:.6}
.home-tile.friday{border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.home-tile.friday .ht-tag{font-size:12px;color:var(--accent);font-weight:600}
.home-ta{width:100%;box-sizing:border-box;min-height:120px;font-family:inherit;font-size:14px;line-height:1.5;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);resize:vertical}
.home-edit-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.home-btn{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:14px}
.home-btn.prim{background:var(--accent);color:#fff;border-color:var(--accent)}
.home-btn.ghost{color:var(--text-muted)}
/* — Бэкап личных данных (экспорт/импорт) — */
.data-io{padding:8px 10px 4px;margin-top:2px}
.data-io-lbl{font-size:10px;color:var(--text-muted);margin-bottom:6px}
.data-io-btns{display:flex;gap:8px}
.data-io-btn{flex:1;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;font-size:12px}
.data-io-btn:hover{border-color:var(--accent)}
.io-ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:18px}
.io-box{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:14px;max-width:380px;width:100%;padding:18px 18px 16px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.io-h{font-size:17px;font-weight:600;margin-bottom:10px}
.io-sum{font-size:13px;line-height:1.6;color:var(--text);background:var(--note-bg,rgba(127,127,127,.08));border-radius:8px;padding:9px 11px;margin-bottom:12px}
.io-p{font-size:13px;line-height:1.5;color:var(--text-muted);margin-bottom:12px}
.io-acts{display:flex;gap:8px;justify-content:flex-end}
.io-acts.io-wrap{flex-wrap:wrap;margin-bottom:8px}
/* — Экран «📥 Скачать для офлайна» (наборы данных) — */
.off-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light)}
.off-main{flex:1;min-width:0}
.off-name{font-size:13px;font-weight:600;color:var(--text)}
.off-note{font-size:11px;color:var(--text-muted);line-height:1.35;margin-top:2px}
.off-dl{flex-shrink:0;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:16px;cursor:pointer}
.off-dl:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.off-dl.done{border-color:var(--accent);color:var(--accent)}
.off-dl:disabled{opacity:.35;cursor:default}
/* — Модуль ПРОГРЕССА ЧТЕНИЯ (дашборд + карта покрытия) — */
.prog-box{max-width:660px;width:100%;text-align:left}
.prog-h{font-size:18px;font-weight:700;margin:0 0 2px;color:var(--text)}
.prog-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.prog-card{background:var(--bg-alt);border:1px solid rgba(var(--accent-rgb),.2);border-radius:12px;padding:14px 15px;margin-bottom:12px}
.prog-card h3{font-size:12px;font-weight:700;color:var(--accent);margin:0 0 11px;text-transform:uppercase;letter-spacing:.05em}
.prog-row{display:flex;align-items:center;gap:14px}
.prog-grow{flex:1;min-width:0}
.prog-big{font-size:26px;font-weight:700;line-height:1;color:var(--text)}
.prog-muted{color:var(--text-muted);font-size:12px}
.prog-ring{position:relative;width:112px;height:112px;flex:none}
.prog-ring svg{transform:rotate(-90deg)}
.prog-ring .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.prog-ring .pc b{font-size:22px;color:var(--text)}
.prog-streak{font-size:38px;font-weight:800;color:var(--accent);line-height:1}
.prog-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;background:var(--bg);border:1px solid var(--border);color:var(--text-muted)}
.prog-pill.ok{color:var(--accent);border-color:var(--accent)}
.prog-pill.used{color:#c98a1e;border-color:#c98a1e}
.prog-week{display:flex;gap:7px;align-items:flex-end;height:92px}
.prog-week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.prog-week .bar{width:100%;background:var(--bg);border-radius:5px 5px 2px 2px;min-height:4px;border:1px solid var(--border)}
.prog-week .bar.today{background:var(--accent);border-color:var(--accent)}
.prog-week .lab{font-size:10px;color:var(--text-muted)}
.prog-week .val{font-size:9px;color:var(--text-muted);height:11px}
.prog-track{height:9px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.prog-track>i{display:block;height:100%;background:var(--accent)}
.prog-tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.prog-tile{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 8px;text-align:center}
.prog-tile b{display:block;font-size:18px;color:var(--text)}
.prog-tile span{font-size:10px;color:var(--text-muted)}
.prog-heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.prog-heat .col{display:flex;flex-direction:column;gap:3px}
.prog-heat .cell{width:12px;height:12px;border-radius:3px;background:var(--border)}
.prog-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;font-size:11px;color:var(--text-muted)}
.prog-legend .cell{width:11px;height:11px;border-radius:3px}
.prog-pages{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.prog-pg{aspect-ratio:1;border-radius:2px;background:var(--border)}
.prog-pg.read{background:var(--accent)}
.prog-pg.learning{background:#7c6cf0}
.prog-pg.review{background:#b06cf0}
.prog-pg.mastered{background:#f06c9b}
.prog-cont{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px}
.prog-goalset{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--border)}
.prog-seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.prog-seg button{border:none;background:var(--bg);color:var(--text-sec);font-family:inherit;cursor:pointer;padding:5px 11px;font-size:12px}
.prog-seg button.on{background:var(--accent);color:#fff}
.prog-step{display:inline-flex;align-items:center;gap:9px}
.prog-step button{width:27px;height:27px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:16px;line-height:1;cursor:pointer}
.prog-step b{min-width:24px;text-align:center;font-size:14px;color:var(--text)}
.prog-debug{border-style:dashed}
.prog-btns{display:flex;flex-wrap:wrap;gap:7px}
.prog-btns button{font-family:inherit;font-size:12px;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:7px 10px;border-radius:8px;cursor:pointer}
.prog-kv{font-size:11px;color:var(--text-muted);margin-top:9px;line-height:1.6;font-family:ui-monospace,Menlo,monospace}

/* ── Проверка заучивания (хифз-тренажёр) ─────────────────────
   Эпистемика на карте: КОНТУР ячейки = декларация («я считаю, что знаю»),
   ЗАЛИВКА = свидетельство проверок. Цвета силы памяти: красный (не помню) →
   янтарный (с трудом) → светло-зелёный (уверенно, в повторении) → зелёный (закреплено). */
.hf-tabs{display:flex;gap:7px;margin:0 0 13px}
.hf-tabs button{flex:1;font-family:inherit;font-size:13px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text-sec);cursor:pointer}
.hf-tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hf-scope{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-sec)}
.hf-scope select,.hf-scope input{font-family:inherit;font-size:12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 7px;max-width:170px}
.hf-scope input{width:56px}
.hf-bar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--bg-alt);border:1px solid var(--border);margin-top:9px}
.hf-bar i{display:block;height:100%}
.hf-sura{border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin-top:8px}
.hf-sura.mastered{border-color:var(--accent);background:rgba(46,160,110,.10)}
.hf-sura-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.hf-sura-name{font-size:13px;color:var(--text);font-weight:600;flex:1;min-width:130px;cursor:pointer}
.hf-sura-name small{font-weight:400;color:var(--text-muted)}
.hf-decl{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.hf-decl button{border:none;background:var(--bg);color:var(--text-muted);font-family:inherit;font-size:11px;padding:4px 8px;cursor:pointer}
.hf-decl button.k.on{background:#2ea06e;color:#fff}
.hf-decl button.s.on{background:#e0a030;color:#fff}
.hf-decl button.n.on{background:#e05252;color:#fff}
.hf-heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:3px;margin-top:9px}
.hf-cell{height:22px;border-radius:4px;background:var(--bg-alt);border:2px solid transparent;font-size:9px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;cursor:pointer}
.hf-go{border:1px solid var(--border);background:var(--bg);border-radius:7px;font-size:13px;line-height:1;padding:4px 8px;cursor:pointer}
.hf-go:hover{border-color:var(--accent)}
.hf-cell.v-weak{background:#e05252;color:#fff}
.hf-cell.v-mid{background:#e0a030;color:#fff}
.hf-cell.v-strong{background:rgba(46,160,110,.55);color:#fff}
.hf-cell.v-mast{background:#2ea06e;color:#fff}
.hf-cell.d-know{border-color:#2ea06e}
.hf-cell.d-shaky{border-color:#e0a030}
.hf-cell.d-no{border-color:#e05252}
.hf-suras{flex:1;min-width:120px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg-card);color:var(--text);font-family:inherit;font-size:12px;outline:none}
.hf-suras:focus{border-color:var(--accent)}
.hf-quiz-card{border:1px solid var(--border);border-radius:10px;padding:13px;margin-top:10px}
.hf-ar{font-size:calc(21px*var(--rs-ar,1));line-height:calc(1.9*var(--lh-ar,1));direction:rtl;text-align:right;color:var(--text)}
.hf-ru{font-size:14px;line-height:1.55;color:var(--text)}
.hf-ru.sec{font-size:12px;color:var(--text-muted);margin-top:5px}
.hf-ref{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:6px}
/* Адрес спрятан: «какая это сура?» — часть проверки, а не подсказка. Кнопка
   открывает его отдельно от цепочки (вспомнил суру, но не продолжение). */
.hf-ref-hide{font-family:inherit;font-size:12px;font-weight:700;color:var(--text-muted);background:var(--bg-alt);border:1px dashed var(--border);border-radius:7px;padding:4px 9px;margin-bottom:6px;cursor:pointer}
.hf-ref-hide:hover{color:var(--accent);border-color:var(--accent)}
/* Тот же вопрос под цепочкой: суру часто узнаёшь только по последнему аяту, и
   тянуться обратно к верхней кнопке неудобно. */
.hf-ref-hide.bot{display:block;width:100%;margin:13px 0 0;padding:9px}
.hf-grade{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.hf-grade button{font-family:inherit;font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text-sec);cursor:pointer}
.hf-grade button.g0.on{background:#e05252;border-color:#e05252;color:#fff}
.hf-grade button.g1.on{background:#e0a030;border-color:#e0a030;color:#fff}
.hf-grade button.g2.on{background:#2ea06e;border-color:#2ea06e;color:#fff}
.hf-chain-item{border-top:1px dashed var(--border);padding:11px 0 4px}
.hf-set{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-sec)}
.hf-set label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.hf-muted{font-size:12px;color:var(--text-muted)}
.hf-legend{display:flex;gap:11px;flex-wrap:wrap;margin-top:9px;font-size:10px;color:var(--text-muted);align-items:center}
.hf-legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:3px}
/* обзорные уровни зума карты хифза (джузы/суры); аятный уровень — прежние .hf-cell */
.hfz-bc{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px}
.hfz-bc button{font-family:inherit;font-size:12px;border:none;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.hfz-bc .cur{color:var(--text);font-weight:600}
.hfz-bc .sep{color:var(--text-muted)}
.hfz-grid{display:grid;gap:7px;margin-top:11px;grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.hfz-grid.suras{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
/* ячейка живёт в тонах ТЕКУЩЕЙ ТЕМЫ (тонированный градиент + акцентная рамка);
   семантические цвета памяти (зелёный/янтарный/красный) — поверх, без изменений */
.hfz-cell{position:relative;height:60px;border:2px solid rgba(var(--accent-rgb),.28);border-radius:9px;background:linear-gradient(180deg,var(--bg) 0%,rgba(var(--accent-rgb),.09) 100%);overflow:hidden;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s}
.hfz-cell:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(var(--accent-rgb),.28);transform:translateY(-1px)}
.hfz-cell.jcell{height:66px;background:linear-gradient(180deg,rgba(var(--accent-rgb),.05) 0%,rgba(var(--accent-rgb),.14) 100%)}
.hfz-cell .fg{position:absolute;left:0;right:0;bottom:0;background:rgba(46,160,110,.5)}   /* заливка: подтверждённо закреплено */
.hfz-cell .fy{position:absolute;left:0;right:0;background:rgba(224,160,48,.42)}           /* «жёлтый градус»: проверено, в работе */
.hfz-cell .num{position:absolute;top:2px;left:5px;font-size:9px;color:var(--accent);font-weight:700;z-index:1}
.hfz-cell .jz{position:absolute;top:2px;right:3px;font-size:8px;color:var(--accent);border:1px solid rgba(var(--accent-rgb),.45);border-radius:4px;padding:0 3px;z-index:1;background:var(--accent-bg)}
.hfz-cell .nm{position:absolute;inset:10px 2px 12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9.5px;line-height:1.15;color:var(--text);z-index:1;overflow:hidden;font-weight:500}
.hfz-cell .sub{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:8px;color:var(--text-muted);z-index:1;white-space:nowrap;overflow:hidden}
.hfz-cell .big{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:19px;font-weight:700;color:var(--accent);z-index:1}
.hfz-cell.focus{box-shadow:0 0 0 2px var(--accent)}
.hfz-cell.d-know{border-color:#2ea06e}
.hfz-cell.d-shaky{border-color:#e0a030}
.hfz-cell.d-no{border-color:#e05252}
/* оверлей-фильтры структуры мусхафа: dim НЕсовпадающих + бейдж у совпадающих;
   заливку (истина заучивания) и контур (декларация) НЕ трогаем */
.hfz-cell.hfo-dim{opacity:.28}
.hfz-cell .ob{position:absolute;bottom:1px;right:2px;z-index:2;font-size:8px;line-height:1.3;border-radius:5px;padding:1px 4px;color:#fff;background:var(--accent);max-width:80%;overflow:hidden;white-space:nowrap}
.hfz-cell .anom{position:absolute;bottom:1px;left:2px;z-index:2;font-size:8px;line-height:1.2;color:#e05252;border:1px solid #e05252;border-radius:4px;padding:0 2px;background:var(--bg)}
.hfo-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;align-items:center}
.hfo-chips .lbl{font-size:10px;color:var(--text-muted)}
.hfo-chips .chip{font-family:inherit;font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.06);color:var(--text-sec);cursor:pointer;transition:border-color .12s,color .12s}
.hfo-chips .chip:hover{border-color:var(--accent);color:var(--accent)}
.hfo-chips .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hfo-leg{margin-top:7px;font-size:11px;color:var(--text-sec)}
.hfo-leg summary{cursor:pointer;color:var(--text-muted);font-size:11px}
.hfo-leg .body{margin-top:5px;line-height:1.55}
.hfo-leg .fam{display:inline-flex;align-items:center;gap:4px;margin:3px 9px 0 0;cursor:pointer;border:none;background:none;font-family:inherit;font-size:11px;color:var(--text-sec);padding:0}
.hfo-leg .fam.on{font-weight:700;color:var(--text)}
.hfo-leg .fam .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ── Скорость чтения (осознанные замеры беглости) ── */
.spd-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:60;display:flex;align-items:center;gap:10px;
  background:var(--bg);border:1px solid var(--accent);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.spd-pill .t{font-size:17px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;min-width:52px}
.spd-pill .pg{font-size:11px;color:var(--text-muted);white-space:nowrap}
.spd-pill button{font-family:inherit;font-size:12px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:6px 11px;cursor:pointer}
.spd-pill button.fin{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.spd-pill.paused .t{color:var(--text-muted)}
/* — медиа-панель (аудио-плеер media.js): НЕ плавает — обычный ряд flex-колонки
   main.center, вставляется над нижней навигацией (bottomNav.before). Кнопки
   ПЕРЕНОСЯТСЯ по строкам (flex-wrap) — на узком экране ничего не обрезается.
   Состояние «свёрнут» (.min) — узкая полоска: ▶/⏸ + аят + развернуть — */
.media-bar{position:relative;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;flex-shrink:0;
  padding:6px 8px;border-top:1px solid var(--border);background:var(--bg-card)}
.media-bar .mb-grp{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.media-bar button{font-family:inherit;font-size:13px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:5px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.media-bar button.pp{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;font-size:15px;padding:5px 13px}
.media-bar button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.media-bar button.ghost{border-color:transparent;background:transparent;color:var(--text-muted);padding:5px 8px}
.media-bar button.src{max-width:132px;overflow:hidden;text-overflow:ellipsis}
.media-bar .lbl{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;cursor:pointer;padding:0 4px;white-space:nowrap}
.media-bar .lbl small{font-weight:400;color:var(--text-muted)}
.media-bar .err{flex-basis:100%;text-align:center;font-size:11px;color:#c0392b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-bar.min{padding:3px 8px;gap:4px;justify-content:center}
.media-bar.min button{padding:3px 9px;font-size:12px}
.media-bar.min button.pp{font-size:13px;padding:3px 11px}
@media(max-width:430px){
  .media-bar{gap:4px;padding:6px 4px}
  .media-bar .mb-grp{gap:4px}
  .media-bar button{font-size:12px;padding:5px 8px}
  .media-bar button.pp{font-size:14px;padding:5px 11px}
  .media-bar button.src{max-width:108px}
  .media-bar .lbl{font-size:13px;padding:0 2px}
}
/* выпадающее меню выбора источника (чтец / набор записей) над панелью */
.media-menu{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 6px);z-index:70;
  min-width:210px;max-width:92vw;max-height:50vh;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.3);padding:6px}
.media-menu .mm-h{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:6px 10px 2px}
.media-menu button{display:block;width:100%;text-align:right;font-family:inherit;font-size:14px;border:none;background:transparent;
  color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.media-menu button:hover{background:var(--bg)}
.media-menu button.on{color:var(--accent);font-weight:700}
/* поля диапазона повтора «с … по …» */
.media-menu .mm-range{display:flex;align-items:center;flex-wrap:wrap;gap:6px;justify-content:flex-end;padding:6px 10px;font-size:13px;color:var(--text)}
.media-menu .mm-in{width:56px;font-family:inherit;font-size:14px;text-align:center;padding:6px 4px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.media-menu button.mm-go{display:inline-block;width:auto;text-align:center;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;padding:7px 12px;margin-left:4px}
.media-menu button.mm-go:hover{opacity:.9;background:var(--accent)}
/* визуальный слой (media.js, фаза 3): полоса-картинка над лентой чтения —
   персистентный сосед #centerBody; два слоя для crossfade + Ken Burns */
.visual-band{position:relative;flex-shrink:0;height:22vh;max-height:200px;min-height:118px;overflow:hidden;background:var(--bg-card);border-bottom:1px solid var(--border)}
.visual-band .vb-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s ease;will-change:opacity,transform}
.visual-band .vb-layer.kb{animation:kenburns 20s ease-out forwards}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.13)}}
.visual-band.empty{display:none!important}
.visual-band .vb-x{position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border:none;border-radius:50%;background:rgba(0,0,0,.34);color:#fff;cursor:pointer;font-size:12px;opacity:.5;transition:opacity .15s}
.visual-band .vb-x:hover{opacity:1}
@media(max-width:520px){.visual-band{height:19vh;min-height:104px}}
/* Диафильм — полноэкранный визуальный ряд (один аят = один кадр) */
.diafilm{position:fixed;inset:0;z-index:70;background:#000;overflow:hidden;touch-action:pan-y}
.diafilm .df-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s ease;will-change:opacity,transform}
.diafilm .df-layer.kb{animation:kenburns 22s ease-out forwards}
.diafilm .df-layer.df-neutral{background:radial-gradient(125% 120% at 50% 18%,#1b2431 0%,#10151d 62%,#05070b 100%)}
.df-scrim{position:absolute;left:0;right:0;bottom:0;height:58%;z-index:2;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 42%,rgba(0,0,0,0) 100%)}
.df-text{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:22px 24px calc(30px + env(safe-area-inset-bottom));color:#fff;text-align:center;transition:opacity .3s}
.df-text.hidden{opacity:0;pointer-events:none}
.df-key{font-size:12px;opacity:.55;letter-spacing:.06em;margin-bottom:9px}
.df-ar{font-size:calc(27px * var(--df-scale,1));line-height:1.95;direction:rtl;margin-bottom:13px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.65)}
.df-tr{font-size:calc(16px * var(--df-scale,1));line-height:1.55;opacity:.95;text-shadow:0 1px 7px rgba(0,0,0,.7);max-width:760px;margin:0 auto}
.df-ctrls{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:5;display:flex;gap:8px}
.df-btn{min-width:40px;height:40px;padding:0 8px;border:none;border-radius:22px;background:rgba(0,0,0,.42);color:#fff;font-size:14px;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.df-btn:active{background:rgba(0,0,0,.62)}
.df-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:46px;height:70px;border:none;background:rgba(0,0,0,.2);color:#fff;font-size:32px;line-height:1;cursor:pointer;opacity:.45;transition:opacity .15s}
.df-nav:active{opacity:.85}
.df-prev{left:0;border-radius:0 12px 12px 0}
.df-next{right:0;border-radius:12px 0 0 12px}
.diafilm.df-audio .df-nav{display:none}          /* аудио ведёт — стрелки не нужны */
/* Фит «вписать» (contain): вся альбомная картинка целиком, поля-леттербокс.
   Нейтральный градиент не трогаем (у него нет своего размера). */
.diafilm.df-contain .df-layer:not(.df-neutral){background-size:contain;background-repeat:no-repeat}
body.df-open{overflow:hidden}
/* Крупный шрифт — только на БОЛЬШИХ экранах (десктоп/планшет): требуем и ширину,
   и высоту, иначе повёрнутый телефон (широкий, но низкий) раздувал бы текст. */
@media(min-width:820px) and (min-height:600px){.df-ar{font-size:calc(33px * var(--df-scale,1))}.df-tr{font-size:calc(19px * var(--df-scale,1))}}
/* Короткий альбом (телефон повёрнут): компактный текст/поля, чтобы не теснить. */
@media (orientation:landscape) and (max-height:520px){
  .df-text{padding:8px 20px calc(10px + env(safe-area-inset-bottom))}
  .df-key{margin-bottom:3px}
  .df-ar{font-size:calc(20px * var(--df-scale,1));line-height:1.65;margin-bottom:5px}
  .df-tr{font-size:calc(13px * var(--df-scale,1));line-height:1.4}
  .df-scrim{height:78%}
  .df-nav{height:56px}
}
.ayah-block.media-cur{box-shadow:0 0 0 2px var(--accent);border-radius:8px}
.ab-play-btn,.ab-rec-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:1px 7px;cursor:pointer;font-size:11px;color:var(--text-muted)}
.ab-play-btn:hover,.ab-rec-btn:hover{color:var(--accent);border-color:var(--accent)}
.ab-rec-btn.has{color:var(--accent);border-color:var(--accent)}
/* попап записи аята (🎙): НИЖНИЙ ЛИСТ по центру снизу — НЕ закрывает аят
   (текст записываемого аята подкручен выше, читается во время записи) */
/* Чтение наизусть (hifz-ридер) — полноэкранный показ ОДНОГО аята (как диафильм).
   Тап по ЛЮБОМУ месту экрана = следующий аят (можно нажимать не глядя);
   крупная ‹ снизу — назад; свайпы ←/→ тоже листают. */
.hreader{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;
  cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.hreader .hr-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.hreader .hr-key{font-size:13px;color:var(--text-muted);letter-spacing:.04em}
.hreader .hr-x{background:var(--bg-card);color:var(--text-muted);font-size:16px;cursor:pointer;
  width:40px;height:40px;border-radius:20px;border:1px solid var(--border)}
/* Кнопки живут в ВЕРХНЕЙ полосе: тап «дальше» ловит весь экран, а сверху рука
   бывает реже — случайных нажатий меньше, чем если положить их к ‹ внизу. */
.hreader .hr-tools{display:flex;align-items:center;gap:7px}
.hreader .hr-b{background:var(--bg-card);color:var(--text-muted);font-family:inherit;font-size:12px;
  cursor:pointer;height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--border)}
.hreader .hr-b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hreader .hr-main{flex:1;display:flex;overflow-y:auto;padding:10px 20px}
/* margin:auto на обёртке — короткий аят центрован, длинный скроллится */
.hreader .hr-body{margin:auto;max-width:860px;width:100%}
.hreader .hr-ar{font-size:calc(30px*var(--rs-ar,1));line-height:2.1;direction:rtl;text-align:center;
  color:var(--text)}
.hreader .hr-ru{font-size:calc(15px*var(--rs-ru,1));line-height:calc(1.6*var(--lh-ru,1));text-align:center;
  color:var(--text-muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.hreader .hr-ru:empty{display:none}
.hreader .hr-bottom{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 14px calc(12px + env(safe-area-inset-bottom))}
.hreader .hr-prev{flex:0 0 auto;width:88px;height:64px;border:1px solid var(--border);border-radius:14px;
  background:var(--bg-card);color:var(--text);font-size:28px;line-height:1;cursor:pointer}
.hreader .hr-hint{flex:1;text-align:center;font-size:12px;color:var(--text-muted)}
@media(min-width:820px) and (min-height:600px){.hreader .hr-ar{font-size:calc(38px*var(--rs-ar,1))}}
@media (orientation:landscape) and (max-height:520px){
  .hreader .hr-ar{font-size:calc(23px*var(--rs-ar,1));line-height:1.8}
  .hreader .hr-prev{height:48px}
}
body.hr-open{overflow:hidden}

.rec-pop{position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:10px;
  background:var(--bg-card);border:1px solid var(--accent);border-radius:14px;
  box-shadow:0 -4px 24px rgba(0,0,0,.28);padding:12px 14px;width:min(380px,94vw);font-size:13px;color:var(--text)}
.rec-pop .rp-title{font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.rec-pop .rp-x{border:none;background:transparent;color:var(--text-muted);font-size:16px;cursor:pointer;padding:0 4px}
.rec-pop select{width:100%;margin:4px 0 10px;font-family:inherit;font-size:13px;padding:7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.rec-pop .rp-row{display:flex;gap:8px;flex-wrap:wrap}
.rec-pop .rp-row button{flex:1;min-width:96px;font-family:inherit;font-size:14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:11px 12px;cursor:pointer}
.rec-pop .rp-row button.hot{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.rec-pop .rp-row button.danger{flex:0 0 auto;min-width:0;color:#c0392b}
.rec-pop .rp-note{font-size:11px;color:var(--text-muted);margin-top:8px}
.rec-pop .rp-rec{display:inline-flex;align-items:center;gap:5px;color:#c0392b;font-weight:700}
.rec-pop .rp-rec::before{content:"";width:10px;height:10px;border-radius:50%;background:#c0392b;animation:recblink 1.2s infinite}
@keyframes recblink{50%{opacity:.3}}
.spd-big{font-size:26px;font-weight:700;color:var(--text)}
.spd-big small{font-size:13px;font-weight:400;color:var(--text-muted)}
.spd-rec{color:#c98a1e;font-weight:700}
.spd-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.spd-kpi b{display:block;font-size:16px;color:var(--text)}
.spd-kpi span{font-size:11px;color:var(--text-muted)}
.spd-trend{display:flex;align-items:flex-end;gap:6px;height:92px;margin-top:10px}
.spd-trend .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.spd-trend .bar{width:100%;max-width:34px;background:var(--accent);opacity:.75;border-radius:4px 4px 0 0}
.spd-trend .lab{font-size:9px;color:var(--text-muted);white-space:nowrap}
.spd-trend .val{font-size:10px;color:var(--text-sec)}
.spd-runs{margin-top:6px;font-size:12px;color:var(--text-sec)}
.spd-runs .r{display:flex;gap:9px;padding:6px 0;border-top:1px dashed var(--border);align-items:baseline;flex-wrap:wrap}
.spd-runs .r b{color:var(--text)}
.spd-zone{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;border:1px solid var(--border);color:var(--text-sec)}
.spd-zone.in{border-color:var(--accent);color:var(--accent)}

/* ── Единая система режимов/панелей ── */
/* переключатель режимов: иконка+подпись; на узких экранах — только иконки */
.seg-modes .ml{margin-left:4px}
/* этап 2: сегментов стало два («Аяты|Мусхаф») — подписи видны всегда */
@media(max-width:680px){.seg-modes button{padding:5px 9px;font-size:12px}}
.seg-modes button{display:inline-flex;align-items:center;gap:5px}
.seg-modes svg.svgi{width:14px;height:14px}
/* режим «Хифз» в главном окне (бывший оверлей) */
.hifz-screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 46px}
.hifz-screen>#hifzBody{max-width:760px;margin:0 auto}
/* ── 🎓 Эрудит: занимательные упражнения (разметку рисует ленивый erudit.js) ── */
.erd-screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 46px}
.erd-screen>#erdBody{max-width:640px;margin:0 auto}
.erd-h1{font-size:19px;font-weight:700;color:var(--text);margin-bottom:6px}
.erd-lead{font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:14px}
.erd-note{font-size:12px;color:var(--text-muted);margin-top:7px}
.erd-bad{font-size:12px;color:#e05252;margin-top:5px}
.erd-back{font-size:13px;color:var(--accent);cursor:pointer;padding:4px 0;margin-bottom:8px;display:block;background:none;border:none;font-family:inherit;width:100%}
.erd-card{border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;background:var(--bg-card);cursor:pointer}
.erd-card:hover{border-color:var(--accent)}
.erd-card-h{display:flex;align-items:center;gap:9px}
.erd-ic{font-size:20px;line-height:1}
.erd-card-t{font-size:15px;font-weight:600;color:var(--text);flex:1}
.erd-arrow{color:var(--text-muted);font-size:17px}
.erd-card-s{font-size:12px;color:var(--text-sec);line-height:1.5;margin-top:6px}
.erd-card-m{font-size:11px;color:var(--text-muted);margin-top:7px}
.erd-soon{font-size:11px;color:var(--text-muted);line-height:1.6;border-top:1px dashed var(--border);padding-top:11px;margin-top:14px}
.erd-set{border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:11px}
.erd-set-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:9px}
.erd-chips{display:flex;gap:6px;flex-wrap:wrap}
.erd-chip{font-family:inherit;font-size:12px;padding:6px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text-sec);cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.erd-chip small{font-size:9px;opacity:.7}
.erd-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.erd-inp{width:100%;margin-top:8px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.erd-inp:focus{border-color:var(--accent)}
.erd-kind{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:6px 0;cursor:pointer;font-size:13px;color:var(--text)}
.erd-kind-h{font-size:11px;color:var(--text-muted)}
.erd-start{display:block;width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.erd-start:hover{background:var(--accent-hover)}
.erd-start.ghost{background:var(--bg);color:var(--text-sec);border:1px solid var(--border);font-weight:500;font-size:13px}
.erd-top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-muted)}
.erd-count{font-weight:600;color:var(--text-sec)}
.erd-score{color:var(--accent);font-weight:600}
.erd-streak{color:#e0a030;font-weight:600}
.erd-quit{margin-left:auto;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);border-radius:7px;font-size:13px;line-height:1;padding:4px 8px;cursor:pointer;font-family:inherit}
.erd-prog{height:5px;border-radius:4px;background:var(--bg-alt);overflow:hidden;margin:7px 0 16px}
.erd-prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.erd-q{margin-bottom:15px}
.erd-q-sub{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px}
.erd-q-ask{font-size:18px;line-height:1.45;color:var(--text);font-weight:500}
/* Аят в вопросе и в разборе: оригинал — RTL, шрифт и размер как в ленте чтения */
.erd-ayah{font-family:'Amiri Quran','Amiri',serif;direction:rtl;text-align:right;
  font-size:calc(22px*var(--rs-ar,1));line-height:calc(1.95*var(--lh-ar,1));color:var(--text);margin-top:10px}
.erd-tr{font-size:13px;line-height:1.55;color:var(--text-sec);margin-top:7px}
.erd-tr.big{font-size:16px;line-height:1.5;color:var(--text);margin-top:10px}
.erd-addr{font-size:11px;color:var(--text-muted);margin-top:6px}
.erd-gap{display:inline-block;min-width:3.2em;text-align:center;color:var(--accent);
  border-bottom:2px solid var(--accent);letter-spacing:.06em}
.erd-hl{background:rgba(var(--accent-rgb),.18);border-bottom:2px solid var(--accent);border-radius:3px;padding:0 2px}
.erd-tj{background:rgba(224,160,48,.22);border-bottom:2px solid #e0a030;border-radius:3px;padding:0 2px}
.erd-card-p{font-size:12px;color:var(--accent);margin-top:7px}
/* ── «Кто хочет стать учёным»: лестница ступеней, подсказки, отметки вычитки ── */
.erd-ladder{display:flex;gap:3px;margin:9px 0 5px}
.erd-rung{flex:1;min-width:0;text-align:center;padding:5px 0;border-radius:5px;
  font-size:10px;font-weight:600;color:var(--text-muted);background:var(--bg-alt);
  border-bottom:2px solid transparent}
.erd-rung.safe{border-bottom-color:#e0a030}
.erd-rung.done{background:rgba(46,160,110,.22);color:var(--text-sec)}
.erd-rung.now{background:var(--accent);color:#fff}
.erd-rung-cap{font-size:11px;color:var(--text-muted);margin-bottom:14px}
.erd-hints{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.erd-hint{flex:1;min-width:92px;font-family:inherit;font-size:12px;padding:9px 6px;border:1px solid var(--border);
  border-radius:9px;background:var(--bg-card);color:var(--text-sec);cursor:pointer}
.erd-hint:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.erd-hint.used{opacity:.4;cursor:default;text-decoration:line-through}
.erd-draft{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#e0a030;
  border:1px solid #e0a030;border-radius:5px;padding:1px 6px}
.erd-mark{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;
  border-top:1px dashed var(--border);padding-top:8px}
.erd-mk{font-family:inherit;font-size:11px;padding:4px 9px;border:1px solid var(--border);
  border-radius:7px;background:var(--bg);color:var(--text-sec);cursor:pointer}
.erd-mk.ok{background:#2ea06e;border-color:#2ea06e;color:#fff}
.erd-mk.bad{background:#e05252;border-color:#e05252;color:#fff}
.erd-fb-acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}
.erd-fb-acts .erd-link{margin-top:0}
.erd-ar{font-family:'Amiri Quran','Amiri',serif;direction:rtl;unicode-bidi:isolate;font-size:1.15em}
.erd-opt .erd-ar{font-size:1.45em}   /* в варианте ответа арабское имя часто единственный текст — мельчить нельзя */
.erd-opts{display:flex;flex-direction:column;gap:8px}
.erd-opt{display:flex;align-items:center;gap:9px;text-align:left;width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text);font-family:inherit;font-size:15px;cursor:pointer;line-height:1.35}
.erd-opt:hover:not(:disabled){border-color:var(--accent)}
.erd-num,.erd-pos{flex-shrink:0;width:21px;height:21px;border-radius:6px;background:var(--bg-alt);color:var(--text-muted);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.erd-pos{background:var(--accent);color:#fff}
.erd-opt.chosen{border-color:var(--accent)}
.erd-opt.ok{border-color:#2ea06e;background:rgba(46,160,110,.12)}
.erd-opt.bad{border-color:#e05252;background:rgba(224,82,82,.10)}
.erd-opt.dim{opacity:.5}
.erd-opt:disabled{cursor:default}
.erd-sortline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.erd-slot{flex:1;min-width:64px;max-width:50%;text-align:center;font-size:11px;padding:7px 4px;border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erd-slot.full{border-style:solid;border-color:var(--accent);color:var(--text)}
.erd-fb{margin-top:14px;padding:11px 12px;border-radius:10px;border:1px solid var(--border)}
.erd-fb.ok{border-color:#2ea06e;background:rgba(46,160,110,.09)}
.erd-fb.bad{border-color:#e05252;background:rgba(224,82,82,.08)}
.erd-fb-t{font-size:13px;font-weight:700;margin-bottom:5px;color:var(--text)}
.erd-fb-x{font-size:13px;line-height:1.5;color:var(--text-sec)}
.erd-link{margin-top:7px;border:none;background:none;color:var(--accent);font-family:inherit;font-size:12px;cursor:pointer;padding:0}
.erd-res{text-align:center;padding:18px 0 6px}
.erd-res-ic{font-size:38px;line-height:1}
.erd-res-score{font-size:30px;font-weight:700;color:var(--text);margin-top:8px}
.erd-res-sub{font-size:12px;color:var(--text-muted);margin-top:5px}
.erd-record{font-size:13px;font-weight:600;color:var(--accent);margin-top:9px}
.erd-wrong{border-top:1px dashed var(--border);padding:9px 0}
.erd-wrong-q{font-size:13px;color:var(--text);line-height:1.4}
.erd-wrong-a{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.45}
/* вкладка «Вид» в боковой панели */
.vp-wrap{padding:10px 12px 34px}
/* панель закладок: кнопка разворота в главное окно */
.bm-tools{padding:9px 10px 3px}
/* «недавнее» на Главной — акцентный ховер в тон темы */
.home-rrow:hover{background:rgba(var(--accent-rgb),.07)}
/* разрыв ряда таблицы (структурные раскладки: Фатиха/манзили/периоды) */
.hfz-break{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-height:4px;margin:3px 0 1px;font-size:9px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.hfz-break::before,.hfz-break::after{content:"";flex:1;height:1px;background:rgba(var(--accent-rgb),.35)}
/* объединённая ячейка 8–9 (Анфаль+Тауба) — двойной ширины */
.hfz-cell.wide{grid-column:span 2}
/* степпер плотности сетки (ячеек в ряду) таблицы Корана / карты хифза */
.hfz-bc .lbl{font-size:10px;color:var(--text-muted)}
.qt-step{display:inline-flex;align-items:center;gap:6px}
.qt-step button{width:22px;height:22px;border:1px solid rgba(var(--accent-rgb),.35);border-radius:6px;background:rgba(var(--accent-rgb),.06);color:var(--text);cursor:pointer;font-size:13px;line-height:1;font-family:inherit}
.qt-step b{min-width:34px;text-align:center;font-size:11px;color:var(--text)}

/* ═══ Редизайн, этап 1 (UI_REDESIGN.md): SVG-иконки, шапка, панелька аята, листы ═══ */
svg.svgi{width:19px;height:19px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;pointer-events:none}
.btn-i{display:inline-flex;align-items:center;justify-content:center;min-width:38px;min-height:36px}
.h-ctx-btn{background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;padding:5px 8px;border-radius:8px;display:flex;align-items:center;gap:5px;min-height:36px}
.h-ctx-btn:hover{background:rgba(255,255,255,.09)}
.h-ctx-btn:empty{display:none}
.h-ctx-chev{opacity:.55;font-size:9px;flex-shrink:0}
.hdr-menu{position:fixed;top:48px;right:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:5px;z-index:250;min-width:215px}
.hdr-menu button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;padding:10px 12px;border-radius:9px;font-size:13.5px;font-family:inherit;color:var(--text);cursor:pointer}
.hdr-menu button:hover{background:var(--bg-alt)}
.hdr-menu svg.svgi{color:var(--text-sec);width:17px;height:17px}
/* панелька аята: номер · ▶ · метки · ☆ · ⋯ */
.ab-row{display:flex;align-items:center;gap:2px;width:100%}
.ab-num-btn{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:32px;padding:0 9px;border:1px solid var(--border);border-radius:999px;background:var(--bg-card);color:var(--accent);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.ab-num-btn:hover{border-color:var(--accent)}
.ab-ico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:32px;border:none;background:none;color:var(--text-sec);border-radius:999px;cursor:pointer;padding:0}
.ab-ico:hover{color:var(--accent);background:var(--bg-card)}
.ab-ico svg.svgi{width:16px;height:16px}
.ab-ico.ab-bm.on{color:#c8971b}
.ab-ico.ab-bm.on svg.svgi{fill:#c8971b;stroke:#c8971b}
.ab-marks{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:11px;cursor:pointer;padding:0 4px;min-height:32px}
.ab-marks .mk{display:inline-flex;align-items:center;gap:3px}
.ab-marks svg.svgi{width:13px;height:13px}
/* нижний лист (лист аята / навигатор) */
.ash-veil{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:300}
.ash{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--bg-card);border:1px solid var(--border);border-bottom:none;border-radius:16px 16px 0 0;z-index:301;max-height:82vh;max-height:82dvh;display:flex;flex-direction:column;animation:ashUp .22s ease-out}
@keyframes ashUp{from{transform:translateY(40%);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ash{animation:none}}
.ash-grab{width:36px;height:4px;border-radius:2px;background:var(--border);margin:8px auto 2px;flex-shrink:0}
.ash-head{display:flex;align-items:center;gap:10px;padding:6px 16px;flex-shrink:0}
.ash-head .t{font-size:14px;font-weight:700}
.ash-head .s{font-size:11.5px;color:var(--text-sec)}
.ash-x{margin-left:auto;border:none;background:var(--bg-alt);border-radius:999px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--text-sec);cursor:pointer;flex-shrink:0}
.ash-body{overflow-y:auto;padding:0 8px 14px}
.ash-row{display:flex;align-items:center;gap:13px;width:100%;border:none;background:none;text-align:left;padding:11px 12px;border-radius:10px;font-size:13.5px;font-family:inherit;color:var(--text);cursor:pointer}
.ash-row:hover{background:var(--bg-alt)}
.ash-row svg.svgi{color:var(--text-sec);width:17px;height:17px}
.ash-row .sub{margin-left:auto;font-size:11px;color:var(--text-muted);text-align:right;flex-shrink:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ash-row.on svg.svgi{color:#c8971b;fill:#c8971b;stroke:#c8971b}
.ash-div{border-top:1px solid var(--border-light);margin:5px 10px}
.ash-jump{display:flex;gap:7px;padding:4px 10px 10px}
.ash-jump input{flex:1;padding:10px 12px;border:1.4px solid var(--accent);border-radius:9px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;min-width:0}
.ash-jump input.bad{border-color:#d23b2c}
.ash-jump button{border:none;background:var(--accent);color:#fff;border-radius:9px;padding:0 16px;font-size:14px;cursor:pointer;font-family:inherit}
.ash-cap{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:8px 12px 3px}
.ash-chips{display:flex;gap:6px;flex-wrap:wrap;padding:2px 10px 6px}
.ash-chip{border:1px solid var(--border);background:var(--bg-alt);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--text-sec);cursor:pointer;font-family:inherit}
.ash-chip:hover{border-color:var(--accent);color:var(--accent)}
.rp-reorder-btn{margin-left:auto;border:1px solid var(--border);background:var(--bg-card);border-radius:7px;padding:2px 8px;font-size:11px;cursor:pointer;color:var(--text-sec);font-family:inherit}
.rp-reorder-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.col-num{cursor:pointer}
/* ═══ Этап 2: панель чтения [🏠][Аяты|Мусхаф][чипы], вкладки 📚, подсказка ═══ */
.cb-read{display:flex;align-items:center;gap:7px;width:100%;min-width:0}
.cb-home{display:inline-flex;align-items:center;justify-content:center;width:36px;height:32px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-sec);border-radius:9px;cursor:pointer;flex-shrink:0;padding:0}
.cb-home:hover{border-color:var(--accent);color:var(--accent)}
.cb-home.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.cb-home svg.svgi{width:16px;height:16px}
.cb-chips{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.cb-chips::-webkit-scrollbar{display:none}
.cb-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-sec);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;min-height:30px}
.cb-chip:hover{border-color:var(--accent);color:var(--accent)}
.cb-chip svg.svgi{width:14px;height:14px}
.cb-chip .chip-lbl{max-width:110px;overflow:hidden;text-overflow:ellipsis}
/* сег «Аяты|Мусхаф» и 🏠 НЕ сжимаются (подписи всегда целиком) — ужимаются чипы;
   на узких экранах чип «Слои» остаётся одной иконкой (текст под ней и так ясен) */
.cb-read .seg,.cb-read .cb-home{flex-shrink:0}
@media(max-width:430px){
  .cb-read{gap:5px}
  .cb-read .cb-home{width:32px;min-width:32px}
  .cb-read .seg button{padding:5px 7px;font-size:11.5px;gap:4px}
  .cb-read .seg svg.svgi{width:13px;height:13px}
  .cb-chip{padding:5px 8px;gap:4px}
  .cb-chip .chip-lbl{max-width:74px}
  .cb-chip.cb-chip-layers span{display:none}
}
.center-bar{transition:max-height .22s,padding .22s;max-height:90px}
.center-bar.cb-hide{max-height:0;padding-top:0;padding-bottom:0;border-bottom-width:0;overflow:hidden}
@media (prefers-reduced-motion:reduce){.center-bar{transition:none}}
.read-hint{margin:2px 0 10px;display:flex;align-items:center;gap:9px;background:var(--accent-bg);border:1px solid rgba(var(--accent-rgb),.35);color:var(--text);border-radius:12px;padding:9px 12px;font-size:12.5px}
.read-hint b{color:var(--accent)}
.read-hint button{margin-left:auto;border:none;background:none;color:var(--text-sec);cursor:pointer;padding:4px;font-size:13px;flex-shrink:0}
.rp-tabs{display:flex;gap:5px;padding:0 0 8px;position:sticky;top:0;background:var(--panel,var(--bg-alt));z-index:2}
.rp-tabs button{flex:1;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:7px 3px;font-size:11.5px;font-weight:600;color:var(--text-sec);cursor:pointer;font-family:inherit}
.rp-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rp-presets{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.rp-preset{border:1px solid var(--border);background:var(--bg-card);border-radius:999px;padding:6px 11px;font-size:11.5px;color:var(--text-sec);cursor:pointer;font-family:inherit}
.rp-preset:hover{border-color:var(--accent);color:var(--accent)}
.rp-filters-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--bg-card);border-radius:9px;padding:8px 12px;font-size:12px;color:var(--text-sec);cursor:pointer;font-family:inherit;margin:0 0 8px;width:100%}
.rp-filters-btn.on{border-color:var(--accent);color:var(--accent)}
.rp-add-cat{display:flex;align-items:center;gap:8px;width:100%;border:1px dashed var(--border);background:none;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;font-family:inherit;margin-top:8px}
.rp-add-cat:hover{border-color:var(--accent)}
/* ═══ Этап 3: бокс перевода текущего аята в мусхафе (tanzil-паттерн) ═══ */
#mtrHost{display:contents} /* иначе sticky заперт в собственном мини-контейнере */
.mtr-box{position:sticky;bottom:6px;z-index:5;width:min(640px,96%);margin:10px auto 0;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:13.5px;line-height:1.55;flex-shrink:0}
.mtr-head{display:flex;align-items:center;gap:6px;padding:6px 10px}
.mtr-head .mtr-pos{border:none;background:var(--bg-alt);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;font-family:inherit}
.mtr-head .mtr-nav{border:none;background:none;color:var(--text-sec);cursor:pointer;width:32px;height:30px;border-radius:8px;font-size:14px;padding:0}
.mtr-head .mtr-nav:hover{background:var(--bg-alt)}
.mtr-head .mtr-src{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-left:2px}
.mtr-head .mtr-x{margin-left:auto;border:none;background:none;color:var(--text-sec);cursor:pointer;padding:4px 8px;font-size:12px}
.mtr-body{padding:0 14px 10px;max-height:26vh;overflow-y:auto}
.mtr-closed{position:sticky;bottom:6px;z-index:5;margin:10px auto 0;display:block;border:1px solid var(--border);background:var(--bg-card);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--text-sec);cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.1);flex-shrink:0}
.mtr-closed:hover{border-color:var(--accent);color:var(--accent)}
/* этап 3: отдельный размер шрифта ТАФСИРОВ — записи kind:tafsir получают свой
   множитель через подмену --rs-ru (внутри entry все правила уже на этой var) */
.ab-entry.taf{--rs-ru:var(--rs-ru-taf,1)}
/* ═══ Этап 3, порция 2: Study Mode — фокус-экран одного аята ═══ */
.study-ovl{position:fixed;inset:0;z-index:260;background:var(--bg);display:flex;flex-direction:column}
.stu-head{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--header-bg);color:var(--header-text);flex-shrink:0}
.stu-head .stu-pos{flex:1;text-align:center;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-head .stu-pos .ar{font-family:'Hafs','Amiri',serif;opacity:.75;font-weight:400}
.stu-head button{display:flex;align-items:center;justify-content:center;min-width:40px;min-height:38px;border:none;background:none;color:var(--header-text);border-radius:9px;cursor:pointer;font-size:17px;font-family:inherit}
.stu-head button:hover{background:rgba(255,255,255,.09)}
.stu-tabs{display:flex;gap:5px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--border-l,var(--border-light));flex-shrink:0}
.stu-tabs button{flex:1;border:1px solid var(--border);background:var(--bg-card);border-radius:9px;padding:8px 4px;font-size:12.5px;font-weight:600;color:var(--text-sec);cursor:pointer;font-family:inherit}
.stu-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stu-body{flex:1;overflow-y:auto;padding:14px 16px 40px;max-width:760px;width:100%;margin:0 auto}
.stu-ar{font-size:calc(26px*var(--rs-ar,1));line-height:calc(2*var(--lh-ar,1));text-align:right;direction:rtl;margin-bottom:14px;color:var(--text)}
.stu-entry{margin-bottom:18px}
.stu-entry .who{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.stu-note-ta{width:100%;min-height:130px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text);font-family:inherit;font-size:13.5px;line-height:1.6;padding:10px 12px;resize:vertical}
.stu-tagrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.stu-tag{border:1px solid var(--border);background:var(--bg-alt);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--text-sec)}
/* ═══ Этап 3, порция 3: «По памяти» в hifz-ридере + полировка ═══ */
.hreader .hr-body.hr-veiled .hr-ar,.hreader .hr-body.hr-veiled .hr-ru{filter:blur(14px);opacity:.3;pointer-events:none}
.hr-veil-hint{display:none;position:absolute;inset:0;align-items:center;justify-content:center;pointer-events:none;
  font-size:14px;color:var(--text-sec);text-align:center;padding:0 30px;line-height:1.6}
.hr-body.hr-veiled~.hr-veil-hint,.hr-main:has(.hr-veiled) .hr-veil-hint{display:flex}
/* тактильный отклик на новых контролах; глобальный видимый фокус с клавиатуры */
.ab-ico:active,.ab-num-btn:active,.ash-row:active,.cb-chip:active,.cb-home:active,.hdr-menu button:active,.rp-preset:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.ab-ico:active,.ab-num-btn:active,.ash-row:active,.cb-chip:active,.cb-home:active,.hdr-menu button:active,.rp-preset:active{transform:none}}
button:focus-visible,[onclick]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body data-theme="light">

<!-- Шапка (редизайн этап 1): 9 кнопок → 4, монохромные SVG вместо эмодзи.
     Позиция (hCtx) — КНОПКА-навигатор (openNavSheet); 📊/🎧/⚙/⛶ — в меню ⋯. -->
<header class="header">
  <div class="header-left">
    <button class="btn-i" onclick="toggleSidebar()" title="Панель: суры, поиск, теги, закладки, настройки"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
    <div class="h-brand"><div class="h-title">مكتبة التفاسير</div><div class="h-sub">TAFSIR LIBRARY</div></div>
    <button class="h-ctx h-ctx-btn" id="hCtx" onclick="openNavSheet()" title="Перейти: сура и аят"></button>
  </div>
  <div class="h-right">
    <button class="btn-i" onclick="openSearchTab()" title="Поиск по текстам и переход по номеру аята"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14z"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button class="btn-i" onclick="toggleRPanel()" title="Переводы и тафсиры"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button>
    <button class="btn-i" id="hMoreBtn" onclick="toggleHdrMenu(event)" title="Ещё: прогресс, аудио, вид, весь экран"><svg class="svgi" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button>
  </div>
</header>

<div class="app-body">
  <aside class="sidebar collapsed" id="sidebar">
    <!-- Вкладки — ВЕРТИКАЛЬНЫМ РЕЛЬСОМ слева: их число растёт (за неделю прибавились
         Темы и Корни), а горизонтальный бар с каждым новым пунктом жмётся; у рельса
         запас по вертикали, и добавление седьмого пункта ничего не ломает. -->
    <nav class="sb-rail" id="sbRail">
      <button class="sb-rail-b" onclick="setSbTab('search')" id="sbTabSearch" title="Поиск по текстам и переход по номеру аята"><span class="rb-i">🔍</span><span class="rb-l">Поиск</span></button>
      <button class="sb-rail-b active" onclick="setSbTab('surahs')" id="sbTabSurahs" title="Суры и джузы"><span class="rb-i">📖</span><span class="rb-l">Суры</span></button>
      <button class="sb-rail-b" onclick="setSbTab('tags')" id="sbTabTags" title="Мои теги"><span class="rb-i">🏷</span><span class="rb-l">Теги</span></button>
      <button class="sb-rail-b" onclick="setSbTab('topics')" id="sbTabTopics" title="Тематический указатель"><span class="rb-i">📑</span><span class="rb-l">Темы</span></button>
      <button class="sb-rail-b" onclick="setSbTab('roots')" id="sbTabRoots" title="Указатель корней (конкорданс)"><span class="rb-i">🌿</span><span class="rb-l">Корни</span></button>
      <button class="sb-rail-b" onclick="setSbTab('bookmarks')" id="sbTabBookmarks" title="Закладки"><span class="rb-i">★</span><span class="rb-l">Закл.</span></button>
      <button class="sb-rail-b" onclick="setSbTab('notes')" id="sbTabNotes" title="Мои заметки — список"><span class="rb-i">📝</span><span class="rb-l">Замет.</span></button>
      <button class="sb-rail-b" onclick="setSbTab('view')" id="sbTabView" title="Вид: шрифты, размеры, темы"><span class="rb-i">⚙</span><span class="rb-l">Вид</span></button>
    </nav>
    <div class="sb-pane">
      <div class="sb-head">
        <input id="sbSearchInp" placeholder="Поиск..." oninput="onSearch(this.value)" onkeydown="onSearchKey(event)">
        <div class="sb-jump" id="sbJump">
          <input id="sbJumpInp" inputmode="numeric" autocomplete="off" placeholder="К аяту: 255 или 2:255" onkeydown="if(event.key==='Enter')sbJumpGo()">
          <button class="sb-jump-go" onclick="sbJumpGo()" title="Перейти к аяту">➜</button>
        </div>
      </div>
      <div class="sb-content" id="sbContent"></div>
    </div>
  </aside>

  <main class="center">
    <div class="center-bar" id="centerBar"></div>
    <div id="centerBody" style="flex:1;overflow:hidden;display:flex;flex-direction:column;"></div>
    <div id="bottomNav" class="bottom-nav"></div>
  </main>

  <aside class="rpanel collapsed" id="rpanel">
    <div class="rp-head"><span>📚 Тексты и тафсиры</span><button class="btn-i" onclick="closeRPanel()" style="font-size:11px" title="Закрыть">✕</button></div>
    <div class="rp-search"><input placeholder="Поиск по названию / автору…" oninput="ST.rpFilter=this.value.toLowerCase();if(ST.rpFilter)ST.rpTab='cat';renderRP();" id="rpSearchInput"></div>
    <div class="rp-list" id="rpList"></div>
  </aside>

  <aside class="rpanel collapsed" id="apanel">
    <div class="rp-head"><span>🎧 Аудио</span><button class="btn-i" onclick="closeAudioPanel()" style="font-size:11px" title="Закрыть">✕</button></div>
    <div class="rp-list" id="apList"></div>
  </aside>
</div>
<div class="panel-backdrop" id="panelBackdrop" onclick="panelBackdrop()"></div>
<button class="immersive-exit" onclick="exitImmersive()" title="Выйти из режима чтения (или кнопка «Назад»)">✕</button>

<footer class="footer"><span id="footerInfo"></span><span>v4.5</span></footer>
