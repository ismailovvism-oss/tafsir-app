// ============================================================
// ОФЛАЙН: service worker (оболочка) + Cache API (скачанное)
// ============================================================
// Слой 1 — воркер sw.js: держит оболочку по стратегии NETWORK-FIRST, поэтому
//   приложение запускается без сети, но обновления доезжают как обычно.
// Слой 2 — экран «📥 Офлайн»: пользователь сам выбирает, что скачать; кеш
//   наполняем ОТСЮДА (Cache API доступен странице), воркер оттуда только читает.
// Имена кешей ОБЯЗАНЫ совпадать с sw.js.
const SW_SHELL_CACHE="tl-shell-1";
const SW_OFFLINE_CACHE="tl-offline-1";
function swOk(){return "serviceWorker" in navigator && "caches" in window && window.isSecureContext;}
function offlineOn(){return gs("offlineSw",1)?true:false;}   // по умолчанию включено (слой 1 — без настройки)

async function swInit(){
  if(!swOk())return;
  // Аварийный выключатель. Если воркер когда-нибудь начнёт мешать, а отладить
  // чужой телефон нельзя — «?nosw=1» снимает регистрацию и чистит ОБА кеша.
  if(/[?&]nosw=1(?:&|$)/.test(location.search)){ss("offlineSw",0);await swTeardown(true);return;}
  if(!offlineOn()){await swTeardown(false);return;}
  try{await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});}catch(e){return;}
  // Догрузку оболочки откладываем: она не должна конкурировать с первым рендером.
  setTimeout(offlineWarm,4000);
}
// Снять воркер. dropOffline=false — скачанное СОХРАНЯЕМ (человек может вернуть
// галочку; терять мегабайты из-за переключателя нечестно).
async function swTeardown(dropOffline){
  try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();}catch(e){}
  try{for(const n of await caches.keys()){
    if(n===SW_OFFLINE_CACHE&&!dropOffline)continue;
    if(n.indexOf("tl-")===0)await caches.delete(n);
  }}catch(e){}
}
// Что воркер не может доложить сам: версионные модули (он не знает MEDIA_VER/
// ERUDIT_VER) и шрифты Google — их <link> уходит no-cors, ответ непрозрачный и
// кешировать его нечем; забираем те же адреса обычным CORS-запросом.
async function offlineWarm(){
  if(!swOk()||!offlineOn())return;
  try{
    const c=await caches.open(SW_SHELL_CACHE);
    const list=["media.js?v="+MEDIA_VER,"erudit.js?v="+ERUDIT_VER];
    const gf=document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis.com"]');
    if(gf){
      const r=await fetch(gf.href,{mode:"cors"});
      if(r.ok){
        const css=await r.clone().text();
        await c.put(gf.href,r);
        (css.match(/https:\/\/fonts\.gstatic\.com\/[^)"']+/g)||[]).forEach(u=>list.push(u));
      }
    }
    // Параллельно, а не по очереди: на медленной сети последовательный цикл не
    // успевает добежать до конца за сеанс, и часть шрифтов офлайн так и не появится.
    await Promise.all(list.map(async u=>{if(!(await c.match(u)))await c.add(u).catch(()=>{});}));
  }catch(e){}
}

// ─── Что скачивать: охват (суры) × набор (класс данных) ───
// Охват держим в ST (не в localStorage): это выбор «на сейчас», а не настройка.
function offScopeSuras(){
  const sc=ST.offScope||"juz";
  if(sc==="sura")return [ST.surah||1];
  if(sc==="all")return SURAHS.map(s=>s.id);
  const j=offCurJuz(),r=j?hifzJuzRange(j):null;
  if(!r)return [ST.surah||1];
  const out=[];for(let s=r.from.s;s<=r.to.s;s++)out.push(s);
  return out;
}
// Джуз, в котором сейчас читаем: по первому аяту текущей суры (границы — из qpcMeta).
function offCurJuz(){
  const js=qpcMeta&&qpcMeta.juzStart;if(!js)return null;
  let cur=1;
  for(let j=1;j<=30;j++){
    const a=js[j];if(!a)continue;
    if(a.surah<(ST.surah||1)||(a.surah===(ST.surah||1)&&a.ayah<=1))cur=j;else break;
  }
  return cur;
}
// Источники, включённые в чтение: арабские редакции, переводы, тафсиры. Скан
// (kind:image) не берём — у него нет по-аятных данных, там страницы-картинки.
function offEnabledIds(){

}
function offUrlsTexts(su){

  return out;
}
function offUrlsWbw(su){
  const out=[resolveUrl("concordance",{})];

function offUrlsTajweed(su){return su.map(s=>resolveUrl("tajweed_spans",{sura:s}));}
// Мусхаф — самый тяжёлый набор: на каждую страницу свой шрифт (~80 КБ).
// Страницы берём по паку, которым мусхаф реально рисуется (pagePack).
function offUrlsMushaf(su){
  const pack=pagePack();if(!pack)return [];
  const out=[resolveUrl("mushaf_glyphs",{path:pack.meta})],pages=new Set();
  for(const s of su){
    const info=SURAHS.find(x=>x.id===s);if(!info)continue;
    out.push(resolveUrl("mushaf_glyphs",{path:`${pack.dataDir}/${s}.json`}));
    const a=verseToPage(s+":1"),b=verseToPage(s+":"+info.n);
    if(a&&b)for(let p=a;p<=b;p++)pages.add(p);
  }
  for(const p of pages){
    out.push(resolveUrl("mushaf_glyphs",{path:`${pack.pageDir}/${p}.json`}));
    out.push(resolveUrl(pack.fontSrc||"mushaf_fonts",{path:pack.fontFile(p)}));
  }
  return out;
}

// Ключи офлайн-кеша одним запросом: поштучный match на тысячах адресов заметно
// тормозил бы отрисовку экрана.
async function offCachedSet(){
  try{const c=await caches.open(SW_OFFLINE_CACHE);
    return new Set((await c.keys()).map(r=>r.url));}catch(e){return new Set();}
}
function offFmtMB(b){return b>=1048576?(b/1048576).toFixed(b>=10485760?0:1)+" МБ":Math.max(1,Math.round(b/1024))+" КБ";}
// «1 файл / 2 файла / 5 файлов» — без этого счётчики читаются как машинный лог.
function offFiles(n){
  const a=n%100,b=n%10;
  return n+" "+((a>=11&&a<=14)?"файлов":b===1?"файл":(b>=2&&b<=4)?"файла":"файлов");
}

// Итог последней докачки: переживает перерисовку экрана, иначе сообщение
// «Готово: N файлов» гасло бы в тот же миг, когда список обновляется.
let _offBusy=false,_offMsg="";
// Качаем ПАРАЛЛЕЛЬНО по 6: последовательно 604 страницы мусхафа ждать невозможно,
// а больше шести соединений браузер всё равно не даст.
async function offlineDownload(setId){
  if(_offBusy)return;
  const set=OFF_SETS.find(s=>s.id===setId);if(!set)return;
  const prog=document.getElementById("offProg");
  const urls=[...new Set(set.urls(offScopeSuras()))];
  // Охват «Весь Коран» на десятке включённых источников — это сотни мегабайт и
  // долгие минуты; молча начинать такое с одного касания нельзя.
  if(urls.length>300&&!confirm(`Скачать ${offFiles(urls.length)}? Это может занять сотни мегабайт и несколько минут.`))return;
  _offBusy=true;_offMsg="";
  let done=0,bytes=0,fail=0;
  const say=()=>{if(prog)prog.textContent=`Скачивание: ${done}/${urls.length} · ${offFmtMB(bytes)}${fail?` · не удалось: ${fail}`:""}`;};
  say();
  try{
    const c=await caches.open(SW_OFFLINE_CACHE);
    let i=0;
    const worker=async()=>{
      while(i<urls.length){
        const u=urls[i++];
        try{
          if(await c.match(u)){done++;if(done%12===0)say();continue;}
          const r=await fetch(u);
          if(r.ok){bytes+=+(r.headers.get("content-length")||0);await c.put(u,r);}
          else fail++;
        }catch(e){fail++;}
        done++;
        if(done%12===0)say();
      }
    };
    await Promise.all(Array.from({length:6},worker));
    _offMsg=fail
      ? `Готово: ${urls.length-fail} из ${urls.length} (${offFmtMB(bytes)}). Не удалось скачать ${fail} — проверьте связь и повторите.`
      : `Готово: ${offFiles(urls.length)}, ${offFmtMB(bytes)}.`;
  }catch(e){
    _offMsg="Не удалось сохранить: возможно, на устройстве кончилось место.";
  }
  if(prog)prog.textContent=_offMsg;
  _offBusy=false;
  renderOfflineManager();
}
async function offlineDropAll(fromModal){
  if(!confirm("Удалить всё скачанное для офлайна? Оболочка приложения останется, тексты будут снова браться из сети."))return;
  try{await caches.delete(SW_OFFLINE_CACHE);}catch(e){}
  if(fromModal)renderOfflineManager();else{renderViewPanel();setTimeout(offlineStatLine,200);}
}

// --- 📑 Переход: jump by surah / juz / rub al-hizb / page (both modes) -------
function juzForPage(pg){
  const js=qpcMeta&&qpcMeta.juzStart;if(!js)return null;
  let cur=1;for(let j=1;j<=30;j++){if(js[j]&&js[j].page<=pg)cur=j;else break;}return cur;
}
// Hizb (60) derives from the rub al-hizb index (4 rubs per hizb): hizb h → rub (h-1)*4+1
function hizbStart(h){const r=qpcMeta&&qpcMeta.rubStart;return r?r[(h-1)*4+1]||null:null;}
function hizbForPage(pg){let cur=1;for(let h=1;h<=60;h++){const s=hizbStart(h);if(s&&s.page<=pg)cur=h;else break;}return cur;}
function pageLocation(pg){
  const total=qpcMeta&&qpcMeta.pages||604;
  const pf=qpcMeta&&qpcMeta.pageStart&&qpcMeta.pageStart[pg];
  const su=pf?SURAHS.find(s=>s.id===pf.surah):null;
  const juz=juzForPage(pg);
  return `${su?esc(su.ru):"Мусхаф"}${juz?` · Джуз ${juz}`:""} · стр. ${pg}/${total}`;
}
// Ссылка на аят из свободного ввода: «2:255» (сура:аят, разделитель : . , / пробел
// дефис) либо голое число = аят ТЕКУЩЕЙ суры. Вне диапазона суры/аята → null, чтобы
// вызывающий не предлагал переход в никуда. Общий разбор для строки поиска и поля
// «перейти к аяту» в панели «Суры».
function parseAyahRef(raw){
  const s=String(raw||"").trim();
  if(!s)return null;
  const m=s.match(/^(\d{1,3})\s*[:.,\/\s-]\s*(\d{1,3})$/);
  let surah,ayah;
  if(m){surah=+m[1];ayah=+m[2];}
  else if(/^\d{1,3}$/.test(s)){surah=ST.surah;ayah=+s;}
  else return null;
  const su=SURAHS.find(x=>x.id===surah);
  if(!su||ayah<1||ayah>su.n)return null;
  return {surah,ayah,su};
}
// Единый переход по разобранной ссылке — из строки поиска и из панели «Суры».
// Страницу мусхафа резолвим по САМОМУ аяту (verseToPage), а не по началу суры:
// иначе в режиме 📕 прыжок на 2:255 оставлял бы на первой странице Аль-Бакары.
// jumpTo сам разведёт режимы (мусхаф → gotoPage, остальные → goAyah).
function goAyahRef(ref){
  if(!ref)return;
  const pg=verseToPage(ref.surah+":"+ref.ayah);
  jumpTo(pg?{page:pg,surah:ref.surah,ayah:ref.ayah}:{surah:ref.surah,ayah:ref.ayah});
  if(!ST.pageMode)flashAyah(ref.ayah);
}
function goAyah(surah,ayah){
  ST.surah=surah;ST.selectedTag=null;ST.topicSel=null;ST.rootView=null;ST.warnMap=null;ST.homeMode=false;ST.hifzMode=false;ST.eruditMode=false;ST.bmView=false;ST.notesView=false;ST.bookIntro=false;ST.scrollToAyah=ayah||1;
  if(isM()){ST.sidebarOpen=false;document.getElementById("sidebar").classList.add("collapsed");}
  pushSurahHash(surah);render();
}
function jumpTo(t){ // {page?, surah?, ayah?}
  // resolve a page for EVERY jump and keep ST.mushafPage as the position of
  // record in both modes — otherwise prev/next loses where we are within a
  // surah and juz/hizb/page stepping gets stuck
  let pg=t.page;
  if(pg==null&&t.surah){const st=qpcMeta&&qpcMeta.surahStart&&qpcMeta.surahStart[t.surah];pg=st?st.page:1;}
  if(pg!=null)ST.mushafPage=pg;
  if(ST.pageMode){
    gotoPage(pg||1);
  }else{
    if(t.surah)goAyah(t.surah,t.ayah||1);
    else if(t.page){const pf=qpcMeta&&qpcMeta.pageStart&&qpcMeta.pageStart[t.page];if(pf)goAyah(pf.surah,pf.ayah);}
  }
}
function navJumpSurah(v){jumpTo({surah:+v});}
function navJumpJuz(v){const j=qpcMeta&&qpcMeta.juzStart&&qpcMeta.juzStart[+v];if(j)jumpTo(j);}
function navJumpHizb(v){const s=hizbStart(Math.max(1,Math.min(60,+v||1)));if(s)jumpTo(s);}
function navJumpPage(v){const total=qpcMeta&&qpcMeta.pages||604;v=Math.max(1,Math.min(total,+v||1));jumpTo({page:v});}
// Switch reading mode (Аяты ↔ Мусхаф); keeps your place via togglePageMode.
function setReadMode(toPage){if(!!ST.pageMode!==!!toPage)togglePageMode();}
// Three-way reading mode: 'ayat' | 'words' (пословный) | 'page' (мусхаф).
function setMode(mode){
  // Явный выбор режима гасит экраны-результаты: они проверяются в renderCenterBody
  // РАНЬШЕ ленты/мусхафа, и без сброса тап по «📖 Аяты» с экрана тем/тегов/корней
  // не уводил бы никуда (правило «новый экран сбрасывает конкурирующие флаги»).
  ST.bookIntro=false;ST.bmView=false;ST.notesView=false;ST.topicSel=null;ST.selectedTag=null;ST.rootView=null;ST.warnMap=null;
  if(mode==="hifz"){                           // 6-й режим «Хифз» (проверка заучивания)
    if(!ST.hifzMode){
      ST.hifzMode=true;ST.homeMode=false;ST.srcMode=false;ST.pageMode=false;
      hifzEnterMode();                         // асинхронная инициализация + рендер
    }
    return;
  }
  if(mode==="erudit"){                         // 7-й режим «🎓 Эрудит» (упражнения)
    if(!ST.eruditMode){
      if(ST.hifzMode){ST.hifzMode=false;consumeOverlay();}
      ST.eruditMode=true;ST.homeMode=false;ST.srcMode=false;ST.pageMode=false;
      eruditEnterMode();
    }
    return;
  }
  if(ST.eruditMode){                                    // уходим из эрудита: снять его ov-запись
    ST.eruditMode=false;if(ERUDIT)ERUDIT.leave();consumeOverlay();
  }
  if(ST.hifzMode){ST.hifzMode=false;consumeOverlay();}   // уходим из хифза: снять его ov-запись «Назад»
  if(mode==="home"){                           // 5-й режим «Главная»
    ST.homeMode=true;ST.srcMode=false;ST.pageMode=false;ST.homeEdit=false;
    pushHomeHash();renderCB();renderBottomNav();renderSB();renderCenter();return;
  }
  ST.homeMode=false;
  if(mode==="source"){                         // 4-й режим «Источник» (чтение по покрытию)
    ST.srcMode=true;ST.pageMode=false;
    renderCB();renderBottomNav();renderSB();renderCenter();return;
  }
  ST.srcMode=false;                            // выход из режима источника при выборе другого
  if(mode==="page"){ if(!ST.pageMode)togglePageMode(); else renderSB(); return; }
  // 'ayat': лента; «words» больше не режим — старый вызов просто приводит в ленту
  if(ST.pageMode){togglePageMode();renderSB();return;} // leaving page mode re-renders for us
  renderCB();renderBottomNav();renderSB();renderCenter();
}

// --- bottom prev/next navigation by a chosen unit (+ swipe) ------------------
function curPos(){
  const page=ST.mushafPage||1; // tracked on every jump (both modes)
  const surah=ST.pageMode?((qpcMeta&&qpcMeta.pageStart&&qpcMeta.pageStart[page]||{}).surah||1):ST.surah;
  return {page,surah,juz:juzForPage(page)||1,hizb:hizbForPage(page)||1};
}
function setNavUnit(u){ST.navUnit=u;ss("navUnit",u);renderBottomNav();}
function navJumpValue(v){
  if(v==="intro"){openBookIntro();return;}                              // «§ Введение» — мукаддима книги
  if(typeof v==="string"&&v[0]==="j"){navJumpJuz(+v.slice(1));return;}  // «▸ Джуз N» из объединённого пикера
  const u=ST.navUnit;
  if(u==="surah")navJumpSurah(v);else if(u==="page")navJumpPage(v);
  else if(u==="juz")navJumpJuz(v);else navJumpHizb(v);}
// In mushaf mode only one page is shown, so the arrows always flip PAGES
// regardless of the picker unit; the picker is for jumping to a surah/juz/etc.
function stepUnit(){return ST.pageMode?"page":ST.navUnit;}
function stepSection(dir){
  const p=curPos(),u=stepUnit();
  if(u==="surah"){
    if(!ST.pageMode)surahPos[p.surah]=curTopAyah();              // запомнить, где был в текущей суре
    const dst=Math.max(1,Math.min(114,p.surah+dir));
    jumpTo({surah:dst,ayah:surahPos[dst]||1});                  // вернуться туда, где был в целевой суре
  }
  else if(u==="page")navJumpPage(p.page+dir);
  else if(u==="juz")navJumpJuz(Math.max(1,Math.min(30,p.juz+dir)));
  else navJumpHizb(Math.max(1,Math.min(60,p.hizb+dir)));
}
// One unified navigation bar (both modes): step unit + a full picker list of
// that unit + prev/next arrows. All four units always available.
function renderBottomNav(){
  const el=document.getElementById("bottomNav");if(!el)return;
  ntStopScroll();                                    // на всякий случай гасим непрерывную прокрутку
  el.className="bottom-nav";el.style.height="";       // сброс к обычному виду
  if(ST.homeMode||ST.selectedTag||ST.hifzMode||ST.bmView){el.style.display="none";return;}
  el.style.display="flex";
  if(ST.noTouch){                                     // кнопочная панель вне области текста
    el.classList.add("notouch-nav");el.style.height=(ST.ntH||60)+"px";
    el.innerHTML=
      `<button class="nt-btn nt-side" onclick="stepSection(-1)" title="Предыдущий раздел/страница">‹ пред.</button>`+
      `<button class="nt-btn nt-scroll" data-dir="-1" title="Вверх (тап — экран, удержание — плавно)">▲</button>`+
      `<button class="nt-btn nt-scroll" data-dir="1" title="Вниз (тап — экран, удержание — плавно)">▼</button>`+
      `<button class="nt-btn nt-side" onclick="stepSection(1)" title="Следующий раздел/страница">след. ›</button>`;
    bindNoTouchScroll(el);
    return;
  }
  // ЕДИНЫЙ НАВИГАТОР (2026-08-07): вместо двух селектов — кнопка-подпись позиции,
  // открывающая тот же лист «Перейти», что и позиция в шапке (openNavSheet, там
  // единицы Сура/Страница/Джуз/Хизб, поле и сетки). Стрелки ‹ › остаются.
  const p=curPos(),total=qpcMeta&&qpcMeta.pages||604;
  // arrow bounds follow the STEP unit (page in mushaf mode), not the picker
  const su=stepUnit();
  const aidx=su==="surah"?p.surah:su==="page"?p.page:su==="juz"?p.juz:p.hizb;
  const amax=su==="surah"?114:su==="page"?total:su==="juz"?30:60;
  const tip=su==="page"?"страница":su==="surah"?"сура":su==="juz"?"джуз":"хизб";
  el.innerHTML=`<button class="bn-arrow" onclick="stepSection(-1)" ${aidx<=1?"disabled":""} title="Предыдущая ${tip}">‹</button>`+

    `<button class="bn-arrow" onclick="stepSection(1)" ${aidx>=amax?"disabled":""} title="Следующая ${tip}">›</button>`;
}
// Подпись позиции для нижней панели — по текущей единице листания
function navPosLabel(p,total){

  if(ST.pageMode)return`стр. ${p.page} / ${total} · ${sn}`;

// Горизонтальный свайп по области чтения → пред./след. раздел. Включается
// настройкой ST.swipeNav (⚙ Вид). Отключён в «Колонках» (свой горизонтальный
// скролл) и в режиме без касания; гасится при вертикальной прокрутке/мультитаче;
// порог строгий, чтобы не листать суру нечаянно.
let _swipeX=0,_swipeY=0,_swipeOk=false,_swipeVScroll=false;
function setupSwipe(){
  const c=document.getElementById("centerBody");if(!c)return;
  c.addEventListener("touchstart",e=>{
    if(e.touches.length>1){_swipeOk=false;return;}            // мультитач (зум) — не свайп
    const t=e.changedTouches[0];_swipeX=t.clientX;_swipeY=t.clientY;_swipeVScroll=false;
    _swipeOk=ST.swipeNav&&!ST.noTouch&&!(!ST.pageMode&&ST.layout==="v"); // настройка + не колонки
  },{passive:true});
  c.addEventListener("touchmove",e=>{
    if(!_swipeOk||e.touches.length>1)return;const t=e.changedTouches[0];
    if(Math.abs(t.clientY-_swipeY)>40)_swipeVScroll=true;      // была вертикальная прокрутка
  },{passive:true});
  c.addEventListener("touchend",e=>{
    if(!_swipeOk||_swipeVScroll)return;const t=e.changedTouches[0];const dx=t.clientX-_swipeX,dy=t.clientY-_swipeY;
    if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2)stepSection(dx<0?1:-1); // swipe left → next
  },{passive:true});
}
function toggleSwipeNav(){ST.swipeNav=!ST.swipeNav;ss("swipeNav",ST.swipeNav);} // обработчик живёт постоянно, читает флаг

// Lazily inject one @font-face per page the first time that page is shown.

  const key=pack.id+":"+page;

// --- Mushaf page mode: faithful page-by-page layout (QPC v1) ----------------
// qpcMeta — мета ТЕКУЩЕГО отображаемого пака (pagePack()): границы страниц/джузов,
// старты сур. Прогресс/хифз/закладки якорятся на verse_key, страница всегда
// ПРОИЗВОДИТСЯ из меты — поэтому смена пака просто меняет систему координат
// страниц целиком, консистентно с тем, что нарисовано. Кэш — по пакам.
let qpcMeta=null;
const _qpcMetaCache={};
let mushafResizeObs=null; // re-fits line scaling when the column width changes
async function loadQpcMeta(){
  const pack=pagePack();
  if(_qpcMetaCache[pack.id]===undefined){
    try{const r=await fetch(resolveUrl("mushaf_glyphs",{path:pack.meta}));_qpcMetaCache[pack.id]=r.ok?await r.json():null;}
    catch(e){_qpcMetaCache[pack.id]=null;}
  }
  qpcMeta=_qpcMetaCache[pack.id];
  if(!qpcMeta&&pack.id!=="qpc1"){ // мета пака не загрузилась — геометрия v1 как фолбэк
    if(_qpcMetaCache.qpc1===undefined){
      try{const r=await fetch(resolveUrl("mushaf_glyphs",{path:PACKS.qpc1.meta}));_qpcMetaCache.qpc1=r.ok?await r.json():null;}
      catch(e){_qpcMetaCache.qpc1=null;}
    }
    qpcMeta=_qpcMetaCache.qpc1;
  }
  return qpcMeta;
}
const qpcPageCache={}; // ключ "<packId>|<page>" — контент страницы зависит от пака
async function loadQpcPage(pack,p){
  const k=pack.id+"|"+p;
  if(qpcPageCache[k]!==undefined)return qpcPageCache[k];
  try{const r=await fetch(resolveUrl("mushaf_glyphs",{path:`${pack.pageDir}/${p}.json`}));qpcPageCache[k]=r.ok?await r.json():null;}catch(e){qpcPageCache[k]=null;}
  return qpcPageCache[k];
}
async function togglePageMode(){
  const meta=await loadQpcMeta();

    const st=meta&&meta.surahStart&&meta.surahStart[ST.surah];if(st)ST.mushafPage=st.page;
  }else{ // leaving: continue from the surah/ayah shown on the current page

  }

}
async function gotoPage(p){

// One physical mushaf line of glyphs. The glyphs carry no kashida, so a line at
// a single size only fills ~80-95% of the column; instead of stretching the
// SPACES (which makes "rivers"), fitMushafLines() scales each line's font-size up
// to fill the column — words stay dense, spaces normal. Surah-end / framed lines
// are centered and left unscaled.
function mushafGlyphLine(pack,words,centered){
  let h="";for(const wp of words){const g=wp[0],p=wp[1];ensurePageFont(pack,p);h+=`<span class="qpc-w" style="font-family:'${pack.fontFamily(p)}'">${g}</span> `;}
  return `<div class="m-line${centered?' m-line-c':''} selectable"><span class="m-inner">${h}</span></div>`;
}
// Uniform page fit: every line on a page is scaled by the SAME factor, so all
// glyphs are one size (no per-line "ballooning"). The factor is chosen so the
// widest line exactly fills the column; shorter lines stay narrower and are
// centered. Shrink (narrow screens) is uncapped; growth is capped so a page of
// short lines doesn't balloon. Recomputed from the live column width on resize.
const MUSHAF_MAX_FIT=1.5;
const MUSHAF_FIT_SAFE=0.99; // keep final width strictly inside the column
function fitMushafLines(host){
  const lines=host.querySelectorAll(".m-line:not(.m-empty)");
  // reset to the CSS base size first, so we measure true natural widths under
  // the CURRENT column width — never a previously-scaled value
  for(const ln of lines)ln.style.fontSize="";
  void host.offsetWidth; // force one reflow before measuring
  // the widest (tightest) line dictates the single page-wide scale
  let minRatio=Infinity;
  for(const ln of lines){
    const inner=ln.querySelector(".m-inner");if(!inner)continue;
    const colW=ln.clientWidth, natW=inner.scrollWidth;
    if(!colW||!natW)continue;
    minRatio=Math.min(minRatio,colW/natW);
  }
  if(!isFinite(minRatio))return;
  const scale=Math.min(minRatio,MUSHAF_MAX_FIT)*MUSHAF_FIT_SAFE;
  for(const ln of lines){
    const base=parseFloat(getComputedStyle(ln).fontSize);
    ln.style.fontSize=(base*scale)+"px"; // same kegl for every line on the page
  }
}
async function renderMushafPage(el){
  const pack=pagePack();
  const meta=await loadQpcMeta();const total=meta?.pages||604;
  let pg=Math.max(1,Math.min(total,ST.mushafPage||1));ST.mushafPage=pg;
  el.innerHTML=`<div class="mushaf-shell"><div id="mushafPage" class="mushaf-page"><div style="text-align:center;color:var(--text-muted);padding:40px">Загрузка страницы ${pg}…</div></div><div id="mtrHost"></div></div>`;
  mtrOnPage(pg);                                     // бокс перевода текущего аята (tanzil)
  const data=await loadQpcPage(pack,pg);
  const host=document.getElementById("mushafPage");if(!host)return;
  if(!data){host.innerHTML=`<div style="padding:40px;text-align:center;color:var(--text-muted)">Нет данных для страницы ${pg}</div>`;}
  else{
    // header & basmala occupy their own lines above each surah's first ayah line
    const headerAt={},basmalaAt={};
    for(const s of (data.starts||[])){
      const hasB=s.surah!==1&&s.surah!==9;
      const hl=s.line-(hasB?2:1);if(hl>=1)headerAt[hl]=s.surah;
      if(hasB&&s.line-1>=1)basmalaAt[s.line-1]=s.surah;
    }
    const centerSet=new Set(data.center||[]);
    const framed=pg<=2; // first two pages are decorative/framed → centered, not justified
    let html="";
    for(let ln=1;ln<=15;ln++){
      if(headerAt[ln]!=null){
        const su=SURAHS.find(x=>x.id===headerAt[ln]);
        html+=`<div class="m-surah-head"><span class="m-surah-name">سورة ${su?su.name:''}</span></div>`;
      }else if(basmalaAt[ln]!=null){
        html+=`<div class="m-basmala">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
      }else if(data.lines[String(ln)]){
        html+=mushafGlyphLine(pack,data.lines[String(ln)],framed||centerSet.has(ln));
      }else{
        html+=`<div class="m-line m-empty"></div>`;
      }
    }
    host.innerHTML=html;
    // measure & fit only after the page glyph font is actually loaded
    try{await document.fonts.ready;}catch(e){}
    fitMushafLines(host);
    // re-fit when the column width changes (orientation / window resize), so the
    // scale always matches the CURRENT column and never overflows
    if(mushafResizeObs){mushafResizeObs.disconnect();mushafResizeObs=null;}
    let lastFitW=host.clientWidth;
    mushafResizeObs=new ResizeObserver(()=>{
      if(!document.body.contains(host)){mushafResizeObs.disconnect();mushafResizeObs=null;return;}
      const w=host.clientWidth;
      if(Math.abs(w-lastFitW)<1)return; // ignore height-only changes
      lastFitW=w;fitMushafLines(host);
    });
    mushafResizeObs.observe(host);
  }
  // prev/next handled by the shared bottom navigation bar
}

// ── Бокс перевода текущего аята в мусхафе (этап 3, tanzil-паттерн) ──────────
// Страница остаётся чистой; перевод ОДНОГО аята — плашкой под ней: листается
// ‹ › в пределах страницы, следует за чтецом (подписка на ось аята media.js),
// тап по номеру — лист аята. Выключенный бокс — узкая пилюля «Перевод».
let MTR=null;            // {s,a} — текущий аят бокса
let mtrSubbed=false;     // подписка на onAyahChange сделана (после загрузки media)
function mtrNextA(s,a,dir){
  const su=SURAHS.find(x=>x.id===s);if(!su)return null;
  if(dir>0){if(a<su.n)return{s,a:a+1};return s<114?{s:s+1,a:1}:null;}
  if(a>1)return{s,a:a-1};
  return s>1?{s:s-1,a:SURAHS[s-2].n}:null;
}
function mtrOnPage(pg){
  const st=qpcMeta&&qpcMeta.pageStart&&qpcMeta.pageStart[pg];
  if(st&&(!MTR||pageOfAyahIdx(MTR.s,MTR.a)!==pg))MTR={s:st.surah,a:st.ayah};
  renderMtrBox();
  if(MEDIA&&!mtrSubbed){mtrSubbed=true;MEDIA.onAyahChange((s,a)=>{if(ST.pageMode&&ST.mushafTr){MTR={s,a};renderMtrBox();}});}
}
// Страница аята (линейно по pageStart — как pageOfAyah в media.js)
function pageOfAyahIdx(s,a){
  if(!qpcMeta||!qpcMeta.pageStart)return null;
  const total=qpcMeta.pages||604,k=s*1000+a;
  let pg=null;
  for(let p=1;p<=total;p++){
    const st=qpcMeta.pageStart[p];if(!st)continue;
    if(st.surah*1000+st.ayah<=k)pg=p;else break;
  }
  return pg;
}
function mtrStep(dir){
  const nx=MTR&&mtrNextA(MTR.s,MTR.a,dir);
  if(!nx)return;
  // в пределах текущей страницы; шаг за границу листает страницу мусхафа
  const pg=pageOfAyahIdx(nx.s,nx.a);
  MTR={s:nx.s,a:nx.a};
  if(pg&&pg!==ST.mushafPage){ST.mushafPage=pg;renderCenter();}
  else renderMtrBox();
}
function mtrToggle(on){ST.mushafTr=on;ss("mushafTr",on);renderMtrBox();}
async function renderMtrBox(){
  const host=document.getElementById("mtrHost");if(!host)return;
  if(!ST.mushafTr){host.innerHTML=`<button class="mtr-closed" onclick="mtrToggle(true)">Перевод аята ▴</button>`;return;}
  if(!MTR){host.innerHTML="";return;}
  const {s,a}=MTR;
  const su=SURAHS.find(x=>x.id===s);
  const t=getEnabledList().find(x=>x.kind!=="image"&&x.kind!=="quran"&&x.id!=="_notes"&&x.lang!=="ar")
    ||CONFIG.tafsirs.find(x=>x.id==="kuliev")||null;
  host.innerHTML=`<div class="mtr-box"><div class="mtr-head">
      <button class="mtr-nav" onclick="mtrStep(-1)" title="Предыдущий аят">‹</button>
      <button class="mtr-pos" onclick="ST.surah=${s};openAyahSheet(${a})" title="Действия с аятом">${su?esc(su.ru):s} ${s}:${a}</button>
      <button class="mtr-nav" onclick="mtrStep(1)" title="Следующий аят">›</button>
      <span class="mtr-src">${t?esc(t.name):""}</span>
      <button class="mtr-x" onclick="mtrToggle(false)" title="Свернуть">Скрыть ▾</button>
    </div><div class="mtr-body md selectable" id="mtrBody">…</div></div>`;
  const body=document.getElementById("mtrBody");
  if(!t){if(body)body.textContent="Включите перевод в панели 📚";return;}
  await loadChunk(t.id,s);
  const txt=getChunk(t.id,s)?.[String(a)]||"";
  // за время загрузки могли перелистнуть — не затираем чужой аят
  if(body&&MTR&&MTR.s===s&&MTR.a===a)body.innerHTML=txt?mdRender(txt):'<span style="color:var(--text-muted)">— у этого аята нет текста в выбранном переводе</span>';
}

// ── Study Mode — фокус-экран одного аята (этап 3, порция 2) ──────────────────
// Дополняет ленту, НЕ заменяет (тафсиры из ленты не выселяются — принцип из
// UI_REDESIGN.md). Вкладки: Тафсиры (все включённые, без сворачивания) /
// Слова (пословный разбор, тап по слову → грам-карточка) / Моё (заметка+теги).
// Листание ‹ › сквозь границы сур; выход — на просмотренный аят.
let STU=null;   // {s,a,tab}
function openStudy(aid){
  if(ST.noTouch)return;
  closeAyahSheet();
  STU={s:ST.surah,a:aid,tab:gs("stuTab","taf")};
  pushOverlay();                                     // «Назад» закрывает фокус-экран
  renderStudy();
}
function closeStudy(viaBack){
  if(!STU)return;
  const {s,a}=STU;STU=null;
  const ov=document.getElementById("studyOvl");if(ov)ov.remove();
  if(!viaBack)consumeOverlay();
  if(!ST.pageMode&&s===ST.surah)jumpToAyahEl(a,true);
  else goAyah(s,a);                                  // ушли в другую суру — честный переход
}
function stuStep(dir){
  if(!STU)return;
  const nx=mtrNextA(STU.s,STU.a,dir);if(!nx)return;
  if(nx.s!==STU.s)ST.surah=nx.s;                     // теги/заметки/попапы читают ST.surah
  STU.s=nx.s;STU.a=nx.a;
  renderStudy();
}
function stuTab(t){if(!STU)return;STU.tab=t;ss("stuTab",t);renderStudy();}
function renderStudy(){
  if(!STU)return;
  let ov=document.getElementById("studyOvl");
  if(!ov){ov=document.createElement("div");ov.id="studyOvl";ov.className="study-ovl";document.body.appendChild(ov);}
  const su=SURAHS.find(x=>x.id===STU.s);
  const tabBtn=(id,lab)=>`<button class="${STU.tab===id?'on':''}" onclick="stuTab('${id}')">${lab}</button>`;
  ov.innerHTML=`<div class="stu-head">
      <button onclick="closeStudy()" title="Закрыть (Esc)">${IC.x}</button>
      <button onclick="stuStep(-1)" title="Предыдущий аят (←)">‹</button>
      <div class="stu-pos">${su?esc(su.ru):STU.s} · ${STU.s}:${STU.a} <span class="ar">${su?su.name:""}</span></div>
      <button onclick="stuStep(1)" title="Следующий аят (→)">›</button>
    </div>
    <div class="stu-tabs">${tabBtn("taf","Тафсиры")+tabBtn("words","Слова")+tabBtn("mine","Моё")}</div>
    <div class="stu-body" id="stuBody"><div style="text-align:center;color:var(--text-muted);padding:30px">Загрузка…</div></div>`;
  renderStuBody();
}
async function renderStuBody(){
  if(!STU)return;
  const {s,a,tab}=STU;
  const body=()=>document.getElementById("stuBody");
  const stale=()=>!STU||STU.s!==s||STU.a!==a||STU.tab!==tab;  // за время await могли листнуть
  await loadChunk("_arabic",s);
  if(stale())return;
  const ar=getArabicFromCache(s,a)||"";
  let html=ar?`<div class="stu-ar selectable">${ar}</div>`:"";
  if(tab==="taf"){
    const en=getEnabledList().filter(t=>t.id!=="_notes"&&t.kind!=="image"&&t.kind!=="quran");
    if(!en.length)html+=`<div class="vp-note">Ни один перевод или тафсир не включён — чип источников в панели чтения.</div>`;
    for(const t of en){
      await loadChunk(t.id,s);
      if(stale())return;
      const text=getChunk(t.id,s)?.[String(a)]||"";
      if(!text)continue;
      const {body:tb,notes}=splitNotes(text);
      html+=`<div class="stu-entry ab-entry ${t.kind==="tafsir"?'taf':''}" style="border:none;padding:0">
        <div class="who">${esc(t.name)}</div>
        <div class="ab-entry-text md selectable ${t.lang==="ar"?'rtl':''}">${tb?renderRefs(tb):'—'}</div>
        ${notes.length?renderFootnotes(notes):''}</div>`;
    }
  }else if(tab==="words"){
    // напрямую (не loadWbwLayer: тот выходит при выключенном слое «Со словами»)
    const loaded={_arabic:getChunk("_arabic",s)};   // сплошной текст — для слов-кусков и таджвида
    const ps=[loadWbwWords(s).then(d=>loaded.__wbwW=d)];
    if(activePack())ps.push(loadPackSurah(ST.arFont,s).then(d=>loaded.__qpc=d));
    else{
      ps.push(loadWbwMorph(s).then(d=>loaded.__wbwM=d));
      if(tajweedActive())ps.push(loadTajweed(s).then(d=>loaded.__tj=d));
    }
    await Promise.all(ps);
    if(stale())return;
    const grid=wbwGridHTML(s,a,loaded);
    html=(grid?`<div class="arabic-main" style="margin-bottom:10px">${grid}</div><div class="vp-note">Тап по слову — грамматика и корень; тап по корню в карточке — все вхождения.</div>`
              :html+`<div class="vp-note">Пословный разбор для этого аята недоступен.</div>`)+wbwAttrHTML();
  }else{
    const tags=getATList(s,a);
    html+=`<div class="stu-entry"><div class="who">Заметка</div>
      <textarea class="stu-note-ta" placeholder="Заметка к аяту ${s}:${a}…" oninput="saveNote(${s},${a},this.value);refreshAyahMarks(${a})">${esc(getNote(s,a))}</textarea></div>`+
      `<div class="stu-entry"><div class="who">Теги</div><div class="stu-tagrow">${tags.length?tags.map(p=>`<span class="stu-tag">${esc(p.split("/").pop())}</span>`).join(""):'<span style="color:var(--text-muted);font-size:12px">нет тегов</span>'}
      <button class="ash-chip" onclick="openTagPopup(${a},this)">🏷 Изменить…</button></div></div>`;
  }
  const el=body();if(el&&!stale())el.innerHTML=html;
}

// --- Слой «Со словами»: сетка слов вместо арабской строки аята ---------------
// Бывший отдельный режим 🔤. Каждое слово несёт data-loc="сура:аят:слово" (тап →
// грам-карточка корпуса) и рисуется ОДНИМ ИЗ ДВУХ способов:
//   • печатное начертание (пак qpc1/qpc4t) — глиф своей страницы, как в мусхафе;
//   • текстовое (насх/хафс/амири/куфи) — склейка сегментов морфологии.
// Глиф — символ приватной области, привязанный к шрифту СВОЕЙ страницы: в Amiri он
// физически не отрисуется, поэтому слой обязан следовать начертанию ⚙ Вид (отдельному
// режиму это сходило с рук — он был всегда печатным). Слова паков и морфологии сходятся
// 1:1 по позиции — сверено на всех 6236 аятах, поэтому адрес слова общий для обоих путей.
function wbwCellHTML(loc,arHTML,gloss){
  return `<span class="wbw-cell" data-loc="${loc}">${arHTML}<span class="wbw-gl">${esc(gloss||"")}</span></span>`;
}
// Сетка одного аята. Возвращает "" если данных нет — вызывающий тогда покажет
// обычную арабскую строку (слой ничего не ломает, просто не появляется).
function wbwGridHTML(surah,aid,loaded){
  const key=String(aid);
  const pack=activePack();                      // null → текстовое начертание
  const wg=(loaded.__wbwW||{})[key];
  const gloss=pos=>{const w=wg&&wg[String(pos)];return (w&&(w.ru||w.en))||"";};
  let cells="";
  if(pack){
    const entry=(loaded.__qpc||{})[key];
    if(!entry||!entry.w)return "";
    entry.w.forEach((wp,i)=>{
      ensurePageFont(pack,wp[1]);
      cells+=wbwCellHTML(`${surah}:${aid}:${i+1}`,
        `<span class="wbw-ar" style="font-family:'${pack.fontFamily(wp[1])}'">${wp[0]}</span>`,gloss(i+1));
    });
  }else{
    const ws=(loaded.__wbwM||{})[key];
    if(!ws)return "";
    const posKeys=Object.keys(ws).sort((a,b)=>+a-+b);
    // ЦВЕТА ТАДЖВИДА НА СЛОВАХ (2026-08-07): пословный счёт сплошного _arabic
    // (по пробелам, без токенов-знаков, минус басмала в 1-х аятах) совпадает с
    // корпусом на 6232/6236 аятах — тогда слово рисуется КУСКОМ _arabic, и его
    // фрагмент разметки таджвида пересчитывается в локальные координаты. В 4
    // аятах-исключениях (напр. 37:130 «Иль-Ясин») — старая склейка морфологии.
    const arFull=(loaded["_arabic"]||{})[key];
    const aw=arFull?arWordTokens(arFull,surah,aid,posKeys.length):null;
    if(aw){
      const tj=loaded.__tj&&loaded.__tj[key];
      posKeys.forEach((pos,i)=>{
        const t=aw[i];
        const inner=tj?tajweedSliceHTML(arFull,tj,t.off,t.off+t.w.length):t.w;
        cells+=wbwCellHTML(`${surah}:${aid}:${pos}`,`<span class="wbw-ar wbw-ar-text">${inner}</span>`,gloss(pos));
      });
    }else{
      for(const pos of posKeys){
        const text=ws[pos].map(sg=>sg.ar||"").join("");
        cells+=wbwCellHTML(`${surah}:${aid}:${pos}`,`<span class="wbw-ar wbw-ar-text">${esc(text)}</span>`,gloss(pos));
      }
    }
  }
  if(!cells)return "";
  // Концевой знак аята не рисуем: у блока аята в ленте есть свой номер (в кружке),
  // а в паке этот знак — глиф, которого у текстовых начертаний просто нет.
  return `<div class="wbw-grid">${cells}</div>`;
}
// Слова сплошного _arabic с их смещениями: токен считается словом, только если
// содержит арабскую букву (знаки вакфа ۛ ۖ — не слова); в 1-х аятах сур (кроме
// 1 и 9) отрезается басмала (в корпусе её нет). null = счёт не сошёлся.
function arWordTokens(t,surah,aid,expectN){
  const re=/[^ ]+/g,out=[];let m;
  while((m=re.exec(t)))if(/[ء-يٱ]/.test(m[0]))out.push({w:m[0],off:m.index});
  if(out.length===expectN)return out;
  if(aid===1&&surah!==1&&surah!==9&&out.length===expectN+4)return out.slice(4);
  return null;
}
// Фрагмент разметки таджвида для подстроки [a,b): глобальные спаны аята
// клипуются пересечением и сдвигаются в координаты слова.
function tajweedSliceHTML(text,spans,a,b){
  const local=[];
  for(const sp of spans){
    const s=Math.max(sp[0],a),e=Math.min(sp[1],b);
    if(s<e)local.push([s-a,e-a,sp[2]]);
  }
  const w=text.slice(a,b);
  return local.length?tajweedHTML(w,local):w;
}
// Атрибуция глосса/разбора — требование лицензий (data-quran CC BY-NC-ND, корпус GPL),
// поэтому висит там же, где показан глосс: под лентой, пока слой включён.
function wbwAttrHTML(){
  return `<div class="wbw-attr">Русский пословный глосс — наш черновой перевод (сверка по смыслу с переводом Э. Кулиева; сам перевод Кулиева не распространяется). Английский глосс: <a href="https://github.com/hablullah/data-quran" target="_blank" rel="noopener">data-quran</a> (CC BY-NC-ND, без изменений). Грамматический разбор: <a href="http://corpus.quran.com" target="_blank" rel="noopener">Quranic Arabic Corpus</a> (GPL).</div>`;
}
// Данные слоя для текущей суры: глоссы всегда; глифы — печатному начертанию (их
// грузит вызывающий как __qpc), морфология — текстовому (она же кормит грам-карточку).
async function loadWbwLayer(surah,loaded){
  if(!ST.wbwLayer)return;
  const ps=[loadWbwWords(surah).then(d=>loaded.__wbwW=d)];
  if(!activePack())ps.push(loadWbwMorph(surah).then(d=>loaded.__wbwM=d));
  await Promise.all(ps);
}
function toggleWbwLayer(){
  ST.wbwLayer=!ST.wbwLayer;ss("wbwLayer",ST.wbwLayer);
  renderCenter();renderRP();
}

function toggleEn(id){ST.enabled[id]=!ST.enabled[id];setEnabled(ST.enabled);renderRP();renderCenter();}

function saveNote(s,a,text){setNote(s,a,text);}

let openPopupAyah=null;

// Single source of truth for a tag-popup node (used by open + refresh)
function popupNodeHTML(node,anc,aid,current){
  const path=tagPath(anc,node.name);
  const has=node.children?.length>0;
  const isOn=current.includes(path);
  const isOpen=!collapsedG["tp_"+path];
  let h=`<div class="tp-node">
    <div class="tp-row" onclick="popupToggleTag(${aid},'${escAttr(path)}')">
      <span class="tp-arrow" onclick="event.stopPropagation();collapsedG['tp_${escAttr(path)}']=!collapsedG['tp_${escAttr(path)}'];refreshTagPopup(${aid})">${has?(isOpen?'▼':'▶'):' '}</span>
      <span class="tp-check">${isOn?'☑':'☐'}</span>
      <span style="flex:1">${esc(node.name)}</span>
    </div>`;
  if(has&&isOpen)h+=node.children.map(ch=>popupNodeHTML(ch,[...anc,node.name],aid,current)).join("");
  return h+"</div>";
}

// ── Разметка потоком: недавние теги + диапазон аятов ──────────────────────
// Систематическая разметка при чтении упирается не в дерево, а в число касаний:
// раскрыть ветку, найти тег, поставить — и так на каждом аяте. Поэтому сверху
// попапа лежат ПОСЛЕДНИЕ использованные теги (одно касание), а снизу — поле
// «по аят N»: тогда один тег ложится сразу на смысловой блок (история Юсуфа,
// аяты о рибе), а не на каждый аят отдельно.
function getRecentTags(){
  const raw=gs("recentTags",[]);
  return Array.isArray(raw)?raw.filter(p=>typeof p==="string"&&tagExists(p)):[];  // переименованные/удалённые теги отсеиваем
}
function pushRecentTag(path){
  const list=getRecentTags().filter(p=>p!==path);
  list.unshift(path);
  ss("recentTags",list.slice(0,8));
}
function tagExists(path){
  let cur=getTagTree();
  for(const part of String(path).split("/")){
    const f=(cur||[]).find(n=>n.name===part);
    if(!f)return false;
    cur=f.children||[];
  }
  return true;
}
const tagLeaf=p=>{const i=p.lastIndexOf("/");return i<0?p:p.slice(i+1);};
const tagParent=p=>{const i=p.lastIndexOf("/");return i<0?"":p.slice(0,i);};

let _tagRangeTo=null;                      // верхняя граница диапазона (null = только текущий аят)
function tagRangeList(aid){
  const to=_tagRangeTo;
  if(!to||to<=aid)return [aid];
  const su=SURAHS[ST.surah-1],last=Math.min(to,su?su.n:to);
  const out=[];for(let a=aid;a<=last;a++)out.push(a);
  return out;
}
function tpSetRange(aid,val){
  const n=parseInt(val,10);
  _tagRangeTo=(n&&n>aid)?n:null;
  const hint=document.querySelector("#tagPopup .tp-range-hint");
  if(hint){
    const list=tagRangeList(aid);
    hint.textContent=list.length>1?`Тег ляжет на аяты ${aid}–${list[list.length-1]} (${list.length})`:"";
  }
  refreshTagPopup(aid);                    // галочки показывают состояние всего диапазона
}
// Счётчик у аята перерисовываем точечно: перерисовка всей ленты сбросила бы
// прокрутку, а при разметке диапазона обновить нужно сразу несколько строк.
function refreshTagBtn(aid){
  refreshAyahMarks(aid);                            // метки в панельке аята (лента)
  const b=document.querySelector(`[data-tagbtn="${aid}"]`);
  if(!b)return;                                     // старая кнопка 🏷 (режим «Источник»)
  const n=getATList(ST.surah,aid).length;
  b.classList.toggle("has",n>0);
  b.textContent="🏷"+(n?" "+n:"");
}

function openTagPopup(aid,btnEl){
  if(ST.noTouch)return;
  closeTagPopup();
  openPopupAyah=aid;
  _tagRangeTo=null;

  const tree=getTagTree();
  if(!tree.length){alert("Создайте теги в боковой панели (☰ → Теги)");return;}

  const su=SURAHS[ST.surah-1];
  const rect=btnEl.getBoundingClientRect();
  const popup=document.createElement("div");
  popup.className="tag-popup";
  popup.id="tagPopup";
  popup.style.position="fixed";
  popup.style.top=Math.min(rect.bottom+4,window.innerHeight-400)+"px";
  popup.style.left=Math.min(rect.left,window.innerWidth-300)+"px";
  popup.innerHTML=`<div class="tag-popup-head"><span>🏷 Теги · аят ${aid}</span><button class="tag-popup-close" onclick="closeTagPopup()">✕</button></div>
    <div id="tpRecent">${recentTagsHTML(aid)}</div>
    <div class="tag-popup-list">${tree.map(n=>popupNodeHTML(n,[],aid,commonTags(aid))).join("")}</div>
    <div class="tp-range">
      <div class="tp-range-row"><span>Пометить аяты ${aid}–</span>
        <input type="number" min="${aid+1}" max="${su?su.n:6236}" placeholder="${aid}"
          onclick="event.stopPropagation()" oninput="tpSetRange(${aid},this.value)"></div>
      <div class="tp-range-hint"></div>
    </div>`;
  document.body.appendChild(popup);

  setTimeout(()=>document.addEventListener("click",closeOnOutside),10);
}
// Галочка стоит, только если тег есть У ВСЕХ аятов диапазона: иначе касание
// должно ДОБАВЛЯТЬ недостающим, а не снимать у тех, где он уже есть.
function commonTags(aid){
  const ayahs=tagRangeList(aid);
  let out=getATList(ST.surah,ayahs[0]).slice();
  for(const a of ayahs.slice(1)){
    const l=getATList(ST.surah,a);
    out=out.filter(p=>l.includes(p));
    if(!out.length)break;
  }
  return out;
}
function recentTagsHTML(aid){
  const list=getRecentTags();
  if(!list.length)return "";
  const common=commonTags(aid);
  let h=`<div class="tp-recent"><div class="tp-recent-h">Недавние</div><div class="tp-chips">`;
  for(const p of list){
    const on=common.includes(p);
    const par=tagParent(p);
    h+=`<button class="tp-chip${on?" on":""}" onclick="event.stopPropagation();popupToggleTag(${aid},'${escAttr(p)}')" title="${escAttr(p)}">
      ${on?"☑ ":""}<b>${esc(tagLeaf(p))}</b>${par?` <small>${esc(par)}</small>`:""}</button>`;
  }
  return h+`</div></div>`;
}

function closeOnOutside(e){
  const popup=document.getElementById("tagPopup");
  if(!popup)return;
  if(popup.contains(e.target))return;
  if(e.target.closest("[onclick*='openTagPopup']"))return;
  closeTagPopup();
}

function closeTagPopup(){
  const popup=document.getElementById("tagPopup");
  if(popup)popup.remove();
  openPopupAyah=null;_tagRangeTo=null;
  document.removeEventListener("click",closeOnOutside);
}

// Диапазон переключается как одно целое: если тег стоит НЕ у всех — доставляем
// недостающим (частая правка «дотянуть блок»), если у всех — снимаем со всех.
function popupToggleTag(aid,path){
  if(typeof event!=="undefined"&&event)event.stopPropagation();
  const ayahs=tagRangeList(aid);
  const all=ayahs.every(a=>getATList(ST.surah,a).includes(path));
  const at=getAyahTags();
  for(const a of ayahs){
    const k=ST.surah+":"+a,list=at[k]||[];
    const has=list.includes(path);
    if(all&&has)at[k]=list.filter(p=>p!==path);
    else if(!all&&!has)at[k]=list.concat([path]);
    if(at[k]&&!at[k].length)delete at[k];
  }
  setAyahTags(at);
  pushRecentTag(path);                       // даже при снятии: тег «в работе», он ещё понадобится
  for(const a of ayahs)refreshTagBtn(a);
  refreshTagPopup(aid);
}

function refreshTagPopup(aid){
  const popup=document.getElementById("tagPopup");
  if(!popup)return;
  const common=commonTags(aid);
  const listEl=popup.querySelector(".tag-popup-list");
  if(listEl)listEl.innerHTML=getTagTree().map(n=>popupNodeHTML(n,[],aid,common)).join("");
  const rec=document.getElementById("tpRecent");
  if(rec)rec.innerHTML=recentTagsHTML(aid);
}

// Tag management
function addTag(val){
  if(!val.trim())return;
  const parts=val.split("/").map(s=>s.trim()).filter(Boolean);
  const tree=getTagTree();let cur=tree;
  for(const p of parts){let f=cur.find(n=>n.name===p);if(!f){f={name:p,children:[]};cur.push(f);}cur=f.children;}
  setTagTree(tree);renderSB();
}
// Выбор тега открывает его результаты в ГЛАВНОМ окне — поэтому сбрасываем все
// экраны, которые renderCenter проверяет РАНЬШЕ selectedTag (Главная, скан,
// режим источника, введение): иначе тап по тегу оттуда молча ничего не делал.
function selectTag(path){
  ST.selectedTag=path;ST.bookIntro=false;ST.homeMode=false;ST.scanSource=null;ST.srcMode=false;ST.hifzMode=false;ST.eruditMode=false;ST.bmView=false;ST.notesView=false;
  if(isM()){ST.sidebarOpen=false;document.getElementById("sidebar").classList.add("collapsed");}
  render();
}
function renameTag(path){
  const parts=path.split("/");const oldName=parts[parts.length-1];
  const newName=prompt("Новое название:",oldName);
  if(!newName||!newName.trim()||newName===oldName)return;
  const tree=getTagTree();
  function findNode(arr,idx){
    const n=arr.find(x=>x.name===parts[idx]);
    if(!n)return null;
    if(idx===parts.length-1)return n;
    return findNode(n.children,idx+1);
  }
  const node=findNode(tree,0);
  if(node){
    const newPath=parts.slice(0,-1).concat(newName.trim()).join("/");
    // Update tag assignments
    const at=getAyahTags();
    for(const k in at){at[k]=at[k].map(p=>p===path?newPath:p.startsWith(path+"/")?newPath+p.slice(path.length):p);}
    setAyahTags(at);
    node.name=newName.trim();
    setTagTree(tree);
    if(ST.selectedTag===path)ST.selectedTag=newPath;
    render();
  }
}
function moveTag(path,dir){
  const parts=path.split("/");
  const tree=getTagTree();
  let arr=tree;
  for(let i=0;i<parts.length-1;i++){const n=arr.find(x=>x.name===parts[i]);if(!n)return;arr=n.children;}
  const idx=arr.findIndex(x=>x.name===parts[parts.length-1]);
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=arr.length)return;
  [arr[idx],arr[newIdx]]=[arr[newIdx],arr[idx]];
  setTagTree(tree);renderSB();
}
function deleteTag(path){
  if(!confirm("Удалить «"+path+"»?"))return;
  const parts=path.split("/");const tree=getTagTree();
  let arr=tree;
  for(let i=0;i<parts.length-1;i++){const n=arr.find(x=>x.name===parts[i]);if(!n)return;arr=n.children;}
  const idx=arr.findIndex(x=>x.name===parts[parts.length-1]);
  if(idx>=0)arr.splice(idx,1);
  setTagTree(tree);
  const at=getAyahTags();for(const k in at){at[k]=at[k].filter(t=>t!==path&&!t.startsWith(path+"/"));if(!at[k].length)delete at[k];}
  setAyahTags(at);
  if(ST.selectedTag===path)ST.selectedTag=null;ST.topicSel=null;ST.rootView=null;ST.warnMap=null;
  render();
}

ST.lhRu=_vnum(gs("lhRu",_oldLh),1);

// Оформление чтения: у НОВЫХ пользователей (нет сохранённого выбора) скина НЕТ —

ST.skin=gs("skin",null);

ST.collapsedKinds=gs("collapsedKinds",{translation:true}); // под аятом: какие группы свёрнуты (переводы — по умолч.)
ST.wbwLayer=gs("wbwLayer",gs("wbwMode",false)); // слой «Со словами»; миграция: у кого был включён режим 🔤 — получит слой
ST.mushafTr=gs("mushafTr",false); // мусхаф: бокс перевода текущего аята (этап 3, tanzil)
ST.noTouch=gs("noTouch",false); ST.ntH=gs("ntH",60); // «Режим без касания»
ST.swipeNav=gs("swipeNav",true); // свайп смены суры (вкл. по умолчанию)

// Keep immersive state in sync if the user leaves browser fullscreen via Esc/F11/gesture.

document.addEventListener("fullscreenchange",onFsChange);
document.addEventListener("webkitfullscreenchange",onFsChange);
// word/grammar cards: open on tap of a [[…]] word OR a word with data-loc
// (corpus card), dismiss on outside tap/scroll
document.addEventListener("click",e=>{
  if(ST.noTouch)return;                              // режим без касания: точечные действия по тексту отключены
  if(!(e.target.closest))return;
  // a word carrying an address → grammar card from the corpus (lazy-loaded).
  // skip when the user is selecting text so copying isn't interrupted.
  const loc=e.target.closest("[data-loc]");
  if(loc&&(window.getSelection?window.getSelection().isCollapsed:true)){openMorphCard(loc);return;}
  // окрашенная буква таджвида → карточка с названием правила
  const tj=e.target.closest(".tj");
  if(tj&&(window.getSelection?window.getSelection().isCollapsed:true)){showTjCard(tj);return;}
  const w=e.target.closest(".wcard");
  if(w){showWordCard(w);return;}
  if(!e.target.closest("#wordCard"))hideWordCard();
});
document.addEventListener("scroll",hideWordCard,true);
document.addEventListener("scroll",saveLastPosSoon,true);  // обновлять последнюю позицию по мере чтения
// Open sidebar by default on desktop
if(!isM()){ST.sidebarOpen=true;document.getElementById("sidebar").classList.remove("collapsed");}
// Клавиатурная навигация (этап 3, tanzil-паттерн; только вне полей ввода):
// ←/→ — сура или страница (текущая единица низа), пробел — плеер с текущего
// аята, Esc — закрыть фокус-экран аята; в фокус-экране ←/→ листают аяты.
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;
  if(STU){                                            // фокус-экран аята
    if(e.key==="ArrowLeft"){stuStep(-1);e.preventDefault();}
    else if(e.key==="ArrowRight"){stuStep(1);e.preventDefault();}
    else if(e.key==="Escape"){closeStudy();e.preventDefault();}
    return;
  }
  if(ashEl||hdrMenuEl){if(e.key==="Escape"){closeAyahSheet();closeHdrMenu();e.preventDefault();}return;}
  if(anyOverlayOpen()||noteEd)return;                 // свои клавиши у оверлеев — не мешаем
  if(ST.homeMode||ST.hifzMode||ST.eruditMode||ST.selectedTag||ST.bmView||ST.notesView||ST.warnMap||ST.rootView||ST.topicSel)return;
  if(e.key==="ArrowLeft"){stepSection(-1);e.preventDefault();}
  else if(e.key==="ArrowRight"){stepSection(1);e.preventDefault();}
  else if(e.key===" "){
    const pp=document.querySelector('#mediaPill [data-act="pp"]');
    if(pp)pp.click();
    else{const a=curTopAyah();if(a)mediaPlayAyah(a);}
    e.preventDefault();
  }
});
// Auto-hide бара чтения (этап 2): прокрутка ленты вниз прячет [Аяты|Мусхаф]+чипы,
// вверх — возвращает; шапка остаётся. Scroll не всплывает — ловим capture-фазой.
(function(){
  const cb=document.getElementById("centerBody");if(!cb)return;
  let lastY=0;
  cb.addEventListener("scroll",e=>{
    const t=e.target;
    if(!t.classList||!t.classList.contains("reading"))return;   // только лента
    if(ST.pageMode||ST.homeMode||ST.hifzMode||ST.eruditMode)return;
    const bar=document.getElementById("centerBar");if(!bar)return;
    const y=t.scrollTop;
    const d=y-lastY;lastY=y;
    if(Math.abs(d)>400)return;                        // прыжок (переход к аяту) — не прятать
    if(Math.abs(d)>4)bar.classList.toggle("cb-hide",d>0&&y>80);
  },true);
})();
