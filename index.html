      <div class="src-bar-row">
        <span class="src-gap-lbl">Разрывы:</span>
        ${gbtn('show','серым','Показывать непокрытые аяты заглушкой')}
        ${gbtn('collapse','схлопнуть','Сворачивать подряд идущие непокрытые в одну полоску')}
        ${gbtn('hide','скрыть','Скрывать непокрытые совсем')}
      </div>
    </div>
  </div>`;

  const area=document.getElementById("readingArea");
  if(!area)return;
  const items=sourceModeItems(id,ayahIds);
  // Введение к суре (ключ "0") — тем же блоком, что и в режиме Аяты, для согласованности.
  let html=buildSuraIntro(enabled,loaded);
  if(!items.length){html+=`<div style="text-align:center;color:var(--text-muted);padding:40px">В этой суре у источника нет покрытия.<br>Нажмите «след. ▶» для перехода к покрытию.</div>`;}
  for(const it of items){
    if(it.gap){
      const [f,t]=it.gap;const key=ST.surah+":"+f+"-"+t;
      const label=f===t?`аят ${f}`:`аяты ${f}–${t}`;
      html+=`<div class="cov-gap-strip" onclick="toggleGapExpand('${key}')">⋯ ${label} — нет толкования <span class="cov-gap-exp">развернуть ▾</span></div>`;
      continue;
    }
    if(it.gapHead){const [f,t]=it.gapHead;const key=ST.surah+":"+f+"-"+t;
      html+=`<div class="cov-gap-strip open" onclick="toggleGapExpand('${key}')">⋯ аяты ${f}–${t} — нет толкования <span class="cov-gap-exp">свернуть ▴</span></div>`;
      continue;}
    const aid=it.ayah;
    const hn=hasNote(ST.surah,aid);const ht=hasAT(ST.surah,aid);
    html+=`<div class="ayah-block ${it.covered?'':'uncovered'}" data-aid="${aid}"><div class="ab-head">
      <div style="display:flex;align-items:center;gap:8px"><span class="ab-num">${aid}</span>
        <button class="cov-cnt-btn" onclick="event.stopPropagation();openCovPopup(${aid},this)" title="Переводов и тафсиров">${covCountLabel(ST.surah,aid)}</button>
        <button class="ab-bm-btn ${isBookmarked(ST.surah,aid)?'on':''}" onclick="event.stopPropagation();toggleBookmark(${aid},this)" title="Закладка">${isBookmarked(ST.surah,aid)?'★':'☆'}</button>
        <button class="ab-note-btn ${hn?'has':''}" onclick="event.stopPropagation();toggleNote(${aid},this)" title="Заметка к аяту">📝</button>
        ${it.covered?'':'<span class="uncov-tag">нет толкования</span>'}
      </div>
      <div class="ab-tag-dots">${hn?'<span class="ab-note-dot"></span>':''}</div>
    </div><div class="ab-body" data-aid="${aid}" style="min-height:40px"></div></div>`;
  }
  area.innerHTML=html;
  setupHydration(area,enabled,loaded);
  if(ST.scrollToAyah!=null){const t=area.querySelector(`.ayah-block[data-aid="${ST.scrollToAyah}"]`);if(t)t.scrollIntoView({block:"start"});ST.scrollToAyah=null;}
  lastReadingSurah=ST.surah;
}

// Экран ВЫБОРА источника = компактная карта покрытия (Переводы/Тафсиры), скроллится.
function renderSourcePicker(el){
  // 3 группы: русские тафсиры, русские переводы, арабские тафсиры.
  const buckets={ru_tafsir:[],translation:[],ar_tafsir:[]};
  for(const t of CONFIG.tafsirs){
    if(!COV.sources[t.id])continue;
    if(t.kind==="tafsir")buckets[t.lang==="ar"?"ar_tafsir":"ru_tafsir"].push(t);
    else if(t.kind==="translation")buckets.translation.push(t);
  }
  const section=(key,title,icon,items)=>{
    if(!items.length)return"";
    const col=pickCollapsed(key);
    let h=`<div class="srcp-gname clickable ${col?'collapsed':''}" onclick="pickToggleKind('${key}')" title="Свернуть/развернуть">${icon} ${title} · ${items.length} <span class="grp-chev">${col?'▸ показать':'▾'}</span></div>`;
    if(col)return h;
    for(const {t,depth} of srcOrderNested(items)){
      const src=COV.sources[t.id];const pct=Math.round(src.n*100/COV.total);
      const full=pct>=100;const cls=full?'full':(pct>=50?'mid':'low');
      h+=`<button class="srcp-item${depth?' src-child':''}" onclick="setSrcSel('${escAttr(t.id)}')">
        <div class="srcp-row1"><span class="srcp-name">${esc(t.name)}</span><span class="srcp-pct ${cls}">${pct}%</span></div>
        <div class="srcp-bar"><div class="srcp-bar-fill ${cls}" style="width:${pct}%"></div></div>
        <div class="srcp-extent">${full?'полное · 114 сур':covExtentText(t.id)}</div>
      </button>`;
    }
    return h;
  };
  el.innerHTML=`<div class="src-picker">
    <div class="srcp-head">📖 Чтение по источнику</div>
    <div class="srcp-sub">Выберите перевод или тафсир — читать будете по его покрытию, разрывы сворачиваются. Видно, у кого сколько и где дыры.</div>
    ${covLoadFailed?`<div class="about-warn">⚠ Индекс покрытия не загрузился (нет сети?). Без него режим «Источник» недоступен — проверьте подключение и обновите страницу.</div>`:''}
    ${section("ru_tafsir","Русские тафсиры","🇷🇺",buckets.ru_tafsir)}
    ${section("translation","Русские переводы","🌐",buckets.translation)}
    ${section("ar_tafsir","Арабские тафсиры","📜",buckets.ar_tafsir)}
  </div>`;
}

// Virtualization: hydrate ayah bodies near the viewport, empty those far away (cap DOM size)
function setupHydration(area,enabled,loaded){
  if(hydrationObserver){hydrationObserver.disconnect();hydrationObserver=null;}
  const obs=new IntersectionObserver(entries=>{
    for(const e of entries){
      const el=e.target;
      if(e.isIntersecting){
        if(el.dataset.hyd!=="1"){el.innerHTML=buildAyahBody(+el.dataset.aid,enabled,loaded);el.dataset.hyd="1";el.style.minHeight="";}
      }else if(el.dataset.hyd==="1"){
        const h=el.offsetHeight;
        if(h)el.style.minHeight=h+"px"; // freeze height so scroll position is preserved
        el.innerHTML="";el.dataset.hyd="0";
      }
    }
  },{root:area,rootMargin:"1200px 0px"});
  area.querySelectorAll(".ab-body").forEach(b=>obs.observe(b));
  hydrationObserver=obs;
}

// Заметка к ОДНОМУ аяту (кнопка 📝 в панели аята) — инлайн-редактор прямо под панелью.
// Вставляется в .ayah-block, переживает виртуализацию; при смене суры — сбрасывается.
function toggleNote(aid,btn){
  if(ST.noTouch)return;
  // btn может быть null — вызов из листа аята (openAyahSheet); блок ищем по aid
  const block=(btn&&btn.closest(".ayah-block"))||document.querySelector(`.ayah-block[data-aid="${aid}"]`);
  if(!block)return;
  const ex=block.querySelector(".ab-note-inline");
  if(ex){ex.remove();if(btn){btn.classList.toggle("on",false);btn.classList.toggle("has",hasNote(ST.surah,aid));}return;}
  if(btn)btn.classList.add("on");
  const div=document.createElement("div");div.className="ab-note-inline";
  div.innerHTML=`<div class="ab-note-bar"><button class="ab-note-expand" onclick="openNoteEditor(${ST.surah},${aid})" title="Развернуть на весь экран с форматированием">⤢ Развернуть</button></div>`+
    `<textarea class="ab-note-area" placeholder="Заметка к аяту ${aid}…" oninput="noteInput(this,${aid})">${esc(getNote(ST.surah,aid))}</textarea>`;
  block.appendChild(div);
  const ta=div.querySelector("textarea");if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
}
// Сохранение + живое обновление индикатора заметки (точка + подсветка кнопки).
function noteInput(ta,aid){
  saveNote(ST.surah,aid,ta.value);
  const block=ta.closest(".ayah-block");if(!block)return;
  const has=hasNote(ST.surah,aid);
  const btn=block.querySelector(".ab-note-btn");if(btn)btn.classList.toggle("has",has);
  const dots=block.querySelector(".ab-tag-dots");if(dots)dots.innerHTML=has?'<span class="ab-note-dot"></span>':'';
  refreshAyahMarks(aid);                            // метка ✏ в панельке аята
  renderF();
}

// ── Большой редактор заметки (модал на весь экран) ──────────────────────────
// Хранилище — то же (getNote/setNote), исходник остаётся markdown. Предпросмотр
// рендерит тем же движком mdRender, что и тафсиры/паспорт (HTML экранируется внутри).
let noteEd=null; // {s,a} — какой аят редактируем
function openNoteEditor(s,a){
  if(ST.noTouch)return;
  noteEd={s,a};
  let ov=document.getElementById("neOvl");
  if(!ov){ov=document.createElement("div");ov.id="neOvl";ov.className="ne-ovl";
    ov.onclick=e=>{if(e.target===ov)closeNoteEditor();};document.body.appendChild(ov);}
  const tb=(t,title,inner)=>`<button class="ne-btn" onclick="neFmt('${t}')" title="${title}">${inner}</button>`;
  ov.innerHTML=`<div class="ne-box" data-m="edit" role="dialog" aria-modal="true">
    <div class="ne-head">
      <span class="ne-title">📝 Заметка · аят ${a}</span>
      <span class="ne-modes">
        <button class="ne-mode on" data-m="edit" onclick="neMode('edit')">✏ Правка</button>
        <button class="ne-mode" data-m="preview" onclick="neMode('preview')">👁 Просмотр</button>
      </span>
      <button class="ne-close" onclick="closeNoteEditor()" aria-label="Закрыть">×</button>
    </div>
    <div class="ne-toolbar">
      ${tb('bold','Жирный','<b>Ж</b>')}${tb('italic','Курсив','<i>К</i>')}${tb('mono','Моноширинный','&lt;/&gt;')}
      <span class="ne-sep"></span>
      ${tb('h','Заголовок','H')}${tb('quote','Цитата','❝')}${tb('ul','Список','•')}${tb('ol','Нумерованный список','1.')}
      <span class="ne-sep"></span>
      ${tb('hr','Линия','―')}${tb('table','Таблица','▦')}${tb('card','Карточка [[ ::подсказка ]]','[[ ]]')}
    </div>
    <div class="ne-body">
      <div class="ne-pane edit"><textarea id="neArea" class="ne-area" placeholder="Пишите заметку… поддерживается markdown: **жирный**, *курсив*, &gt; цитата, # заголовок, списки, | таблицы |" oninput="neInput()">${esc(getNote(s,a))}</textarea></div>
      <div class="ne-pane preview"><div id="nePreview" class="ne-preview md"></div></div>
    </div>
  </div>`;
  ov.style.display="flex";
  neInput(); // первичный предпросмотр
  const ta=document.getElementById("neArea");if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
}
function neMode(m){
  const box=document.querySelector("#neOvl .ne-box");if(!box)return;
  box.dataset.m=m;box.querySelectorAll(".ne-mode").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  if(m==="preview")neInput();
  else{const ta=document.getElementById("neArea");if(ta)ta.focus();}
}
// Автосохранение по вводу + живой предпросмотр (то же хранилище, что у инлайн-поля).
function neInput(){
  if(!noteEd)return;
  const ta=document.getElementById("neArea");if(!ta)return;
  saveNote(noteEd.s,noteEd.a,ta.value);
  const pv=document.getElementById("nePreview");
  if(pv)pv.innerHTML=ta.value.trim()?mdRender(ta.value):'<span style="color:var(--text-muted)">Здесь появится предпросмотр…</span>';
}
// Оборачивание выделения / вставка markdown — только синтаксис, который умеет mdRender.
function neWrap(before,after,placeholder){
  const ta=document.getElementById("neArea");if(!ta)return;
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
  const sel=v.slice(s,e)||placeholder||"текст";
  ta.value=v.slice(0,s)+before+sel+after+v.slice(e);
  ta.focus();ta.setSelectionRange(s+before.length,s+before.length+sel.length);
  neInput();
}
function neLinePrefix(prefix){
  const ta=document.getElementById("neArea");if(!ta)return;
  const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd;
  const ls=v.lastIndexOf("\n",s-1)+1;
  let le=v.indexOf("\n",e);if(le<0)le=v.length;
  const seg=v.slice(ls,le)||"текст";
  const newSeg=seg.split("\n").map(l=>prefix+l).join("\n");
  ta.value=v.slice(0,ls)+newSeg+v.slice(le);
  ta.focus();ta.setSelectionRange(ls,ls+newSeg.length);
  neInput();
}
function neInsert(text){
  const ta=document.getElementById("neArea");if(!ta)return;
  const s=ta.selectionStart,v=ta.value;
  ta.value=v.slice(0,s)+text+v.slice(ta.selectionEnd);
  const pos=s+text.length;ta.focus();ta.setSelectionRange(pos,pos);
  neInput();
}
function neFmt(type){
  if(type==="bold")neWrap("**","**","жирный");
  else if(type==="italic")neWrap("*","*","курсив");
  else if(type==="mono")neWrap("`","`","код");
  else if(type==="quote")neLinePrefix("> ");
  else if(type==="h")neLinePrefix("## ");
  else if(type==="ul")neLinePrefix("- ");
  else if(type==="ol")neLinePrefix("1. ");
  else if(type==="hr")neInsert("\n\n---\n\n");
  else if(type==="table")neInsert("\n\n| Столбец | Столбец |\n| --- | --- |\n| ячейка | ячейка |\n\n");
  else if(type==="card")neWrap("[[","::подсказка]]","слово");
}
function closeNoteEditor(){
  const ov=document.getElementById("neOvl");if(ov)ov.style.display="none";
  if(noteEd){                         // синхронизируем индикаторы и инлайн-поле под аятом
    const a=noteEd.a,has=hasNote(noteEd.s,a);
    const block=document.querySelector(`.ayah-block[data-aid="${a}"]`);
    if(block){
      const btn=block.querySelector(".ab-note-btn");if(btn){btn.classList.toggle("has",has);btn.classList.remove("on");}
      const inlineTa=block.querySelector(".ab-note-inline textarea");if(inlineTa)inlineTa.value=getNote(noteEd.s,a);
      const dots=block.querySelector(".ab-tag-dots");if(dots)dots.innerHTML=has?'<span class="ab-note-dot"></span>':'';
    }
  }
  noteEd=null;renderF();
}

// Разовый показ перевода/оригинала ОДНОГО аята (кнопка ru/ar в панели аята).
// Блок вставляется в .ayah-block (рядом с .ab-body), переживает виртуализацию;
// при смене суры/режима всё перерисовывается заново — состояние само сбрасывается.
async function togglePeek(aid,btn,kindArg){
  if(ST.noTouch)return;
  // btn может быть null — вызов из листа аята; тогда kind приходит аргументом
  const block=(btn&&btn.closest(".ayah-block"))||document.querySelector(`.ayah-block[data-aid="${aid}"]`);
  if(!block)return;
  const ex=block.querySelector(".ab-peek");
  if(ex){ex.remove();if(btn)btn.classList.remove("on");return;}
  if(btn)btn.classList.add("on");
  const kind=btn?btn.dataset.peek:kindArg;
  const lbl=kind==="ru"?"Перевод":"Оригинал";
  const div=document.createElement("div");div.className="ab-peek";
  div.innerHTML=`<span class="ab-peek-lbl">${lbl}</span><span style="color:var(--text-muted)">…</span>`;
  block.appendChild(div);
  let text="";
  if(kind==="ru"){
    const tid=(CONFIG.tafsirs.find(t=>t.lang!=="ar"&&t.group==="translations")||{}).id||"kuliev";
    await loadChunk(tid,ST.surah);text=getChunk(tid,ST.surah)?.[String(aid)]||getAnyTranslation(ST.surah,aid);
  }else{
    await loadChunk("_arabic",ST.surah);text=getArabicFromCache(ST.surah,aid);
  }
  if(!block.contains(div))return;
  div.innerHTML=`<span class="ab-peek-lbl">${lbl}</span>`+
    (kind==="ru"?`<div class="ab-peek-t md selectable">${text?mdRender(text):'—'}</div>`
                :`<div class="ab-peek-t rtl selectable">${text||'—'}</div>`);
}

// Копировать: арабский + первый включённый перевод + адрес
async function copyAyah(aid,btn){
  const sub=btn?btn.querySelector(".sub"):null;
  try{
    await loadChunk("_arabic",ST.surah);
    const ar=getArabicFromCache(ST.surah,aid)||"";
    let tr="";
    const t=getEnabledList().find(x=>x.kind!=="image"&&x.kind!=="quran"&&x.id!=="_notes"&&x.lang!=="ar");
    if(t){await loadChunk(t.id,ST.surah);tr=getChunk(t.id,ST.surah)?.[String(aid)]||"";}
    const su=SURAHS.find(s=>s.id===ST.surah);
    const txt=(ar?ar+"\n\n":"")+(tr?tr+"\n\n":"")+`(Коран, ${su?su.ru+", ":""}${ST.surah}:${aid})`;
    await navigator.clipboard.writeText(txt);
    if(sub)sub.textContent="скопировано ✓";
  }catch(e){if(sub)sub.textContent="не удалось";}
}
// Копировать диапазон аятов (арабский + первый перевод + адрес, до 50 аятов)
async function copyAyahRange(aid){
  const su=SURAHS.find(x=>x.id===ST.surah);const max=su?su.n:aid;
  const v=prompt(`Копировать аяты с ${aid} по (не больше ${Math.min(max,aid+49)}):`,Math.min(aid+2,max));
  if(v===null)return;
  const to=Math.max(aid,Math.min(max,aid+49,parseInt(v,10)||aid));
  closeAyahSheet();
  try{
    await loadChunk("_arabic",ST.surah);
    const t=getEnabledList().find(x=>x.kind!=="image"&&x.kind!=="quran"&&x.id!=="_notes"&&x.lang!=="ar");
    if(t)await loadChunk(t.id,ST.surah);
    let out="";
    for(let a=aid;a<=to;a++){
      const ar=getArabicFromCache(ST.surah,a)||"";
      const tr=t?(getChunk(t.id,ST.surah)?.[String(a)]||""):"";
      out+=(to>aid?`${a}. `:"")+(ar?ar+"\n":"")+(tr?tr+"\n":"")+"\n";
    }
    out+=`(Коран, ${su?su.ru+", ":""}${ST.surah}:${aid}${to>aid?"–"+to:""})`;
    await navigator.clipboard.writeText(out);
    alert(`Скопировано: ${to-aid+1} ${to-aid+1===1?"аят":"аятов"} (${ST.surah}:${aid}${to>aid?"–"+to:""})`);
  }catch(e){alert("Не удалось скопировать");}
}

      `<div class="ash-div"></div>`+
      (booksWithMuqaddima().length?`<button class="ash-row" onclick="closeAyahSheet();openBookIntro()">§ Введение (المقدمة)<span class="sub">→</span></button>`:"")+
      `<button class="ash-row" onclick="closeAyahSheet();openSurahsTab()">${IC.list}Все суры и джузы<span class="sub">→</span></button>`;
  }else if(u==="juz"){
    body=`<div class="ash-cap">Джузы</div><div class="ash-numgrid">`+
      Array.from({length:30},(_,i)=>`<button class="ash-chip ${i+1===p.juz?'cur':''}" onclick="closeAyahSheet();navJumpJuz(${i+1})">${i+1}</button>`).join("")+`</div>`;
  }else if(u==="hizb"){
    body=`<div class="ash-cap">Хизбы</div><div class="ash-numgrid">`+
      Array.from({length:60},(_,i)=>`<button class="ash-chip ${i+1===p.hizb?'cur':''}" onclick="closeAyahSheet();navJumpHizb(${i+1})">${i+1}</button>`).join("")+`</div>`;
  }else{
    const total=qpcMeta&&qpcMeta.pages||604;
    body=`<div class="ash-cap">Сейчас — страница ${p.page} из ${total}</div>`+
      `<div class="ash-chips"><button class="ash-chip" onclick="closeAyahSheet();navJumpPage(${Math.max(1,p.page-1)})">‹ предыдущая</button><button class="ash-chip" onclick="closeAyahSheet();navJumpPage(${Math.min(total,p.page+1)})">следующая ›</button></div>`;
  }
  openSheetShell("Перейти","",
    `<div class="ash-units">${ub}</div>`+
    `<div class="ash-jump"><input id="ashJumpInp" autocomplete="off" placeholder="${ph}" onkeydown="if(event.key==='Enter')ashJumpGo()"><button onclick="ashJumpGo()" title="Перейти">→</button></div>`+
    body);
  const inp=document.getElementById("ashJumpInp");if(inp&&!isM())inp.focus();

// Смена единицы: общая с листанием ‹ › нижней панели (setNavUnit persist+перерисовка низа)
function navSheetUnit(u){setNavUnit(u);openNavSheet();}
function ashJumpGo(){
  const inp=document.getElementById("ashJumpInp");if(!inp)return;
  const v=inp.value.trim();
  const bad=()=>{inp.classList.add("bad");inp.select();setTimeout(()=>inp.classList.remove("bad"),700);};
  if(!v){bad();return;}
  const go=ref=>{closeAyahSheet();goAyahRef(ref);};
  if(/^:\d+$/.test(v)){const r=parseAyahRef(v.slice(1));r?go(r):bad();return;}   // «:255» — аят текущей суры
  if(v.includes(":")){const r=parseAyahRef(v);r?go(r):bad();return;}             // «2:255»
  const n=parseInt(v,10);
  if(isFinite(n)){
    const u=ST.navUnit,total=qpcMeta&&qpcMeta.pages||604;
    if(u==="page"&&n>=1&&n<=total){closeAyahSheet();navJumpPage(n);return;}
    if(u==="juz"&&n>=1&&n<=30){closeAyahSheet();navJumpJuz(n);return;}
    if(u==="hizb"&&n>=1&&n<=60){closeAyahSheet();navJumpHizb(n);return;}
    if(u==="surah"&&n>=1&&n<=114){closeAyahSheet();goSurah(n);return;}
  }
  const r=parseAyahRef(v);r?go(r):bad();   // запасной путь: «255» вне диапазона единицы = аят текущей суры
}

async function renderReading(el){
  const ayahIds=getAyahIds(ST.surah);
  const enabledAll=getEnabledList();
  const enabled=enabledAll.filter(t=>t.kind!=="image");   // per-ayah text sources (scans are a separate reader)
  const quranTexts=getEnabledQuranTexts();
  if(!enabled.length&&!quranTexts.length){
    el.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px;text-align:center;padding:40px">
      <div><div style="font-size:32px;margin-bottom:10px;opacity:.3">📚</div>Включите переводы или тафсиры<br>кнопкой 📚 справа вверху</div></div>`;
    return;
  }

  // Запоминаем верхний видимый аят ДО затирания DOM, чтобы вернуть скролл на него
  // после ре-рендера той же суры (напр. при включении/выключении источника).
  let anchorAid=null;
  if(lastReadingSurah===ST.surah){
    const prevArea=el.querySelector("#readingArea");
    if(prevArea){
      // Ориентир верха: в «Колонках» вычитаем высоту липкой шапки колонок, чтобы
      // взять первый аят ПОД шапкой (а не тот, что чуть выглядывает над ней).
      let refTop=prevArea.getBoundingClientRect().top;
      const colWrap=prevArea.querySelector(".col-wrap");
      if(colWrap){const th=colWrap.querySelector("thead");if(th)refTop=colWrap.getBoundingClientRect().top+th.getBoundingClientRect().height;}
      // .ayah-block — режим «Список»; .col-num — режим «Колонки» (ячейки колонки №)
      for(const b of prevArea.querySelectorAll(".ayah-block, .col-num")){
        if(b.getBoundingClientRect().bottom>refTop+4){anchorAid=b.dataset.aid;break;}
      }
    }
  }

  el.innerHTML=`<div class="reading" id="readingArea"><div style="text-align:center;color:var(--text-muted);padding:30px">Загрузка...</div></div>`;

  // Load only the current surah's chunk for each enabled tafsir + Arabic variant
  const loaded={};
  const toLoad=[...enabled.filter(t=>t.id!=="_notes"),...quranTexts];
  await Promise.all(toLoad.map(async t=>{loaded[t.id]=await loadChunk(t.id,ST.surah);}));
  // «Открыть здесь»: догрузить чанки разовых источников текущей суры
  const adHocSet=new Set();
  for(const k in ST.adHoc)if(k.startsWith(ST.surah+":"))for(const id of ST.adHoc[k])if(!ST.enabled[id])adHocSet.add(id);
  await Promise.all([...adHocSet].map(async id=>{loaded[id]=await loadChunk(id,ST.surah);}));
  // Mushaf pack glyphs (QPC v1 …) for the main Arabic line, if a pack font is active
  if(activePack())loaded["__qpc"]=await loadPackSurah(ST.arFont,ST.surah);
  if(tajweedActive())loaded["__tj"]=await loadTajweed(ST.surah); // спаны раскраски таджвида
  await loadWbwLayer(ST.surah,loaded);          // слой «Со словами»: глоссы + (морфология | глифы)

  const area=document.getElementById("readingArea");
  if(!area)return;

  // Раскладка: «Список» (h) или «Колонки» (v). На телефоне колонки скроллятся
  // горизонтально (min-width колонок задан в CSS) — раньше тут был форс в «h».
  const layout=ST.layout;
  if(layout==="h"){
    // anchorAid (верхний видимый аят) уже захвачен выше — до затирания DOM.
    // Разовый показ второй стороны одного аята: «ru» если включён только арабский,
    // «ar» если только перевод (когда есть и то и то — кнопка не нужна).
    const hasAr=quranTexts.length>0;
    const hasTr=enabled.some(t=>t.id!=="_notes"&&t.lang!=="ar");
    const peekKind=hasAr&&!hasTr?"ru":(hasTr&&!hasAr?"ar":null);
    // Lightweight skeleton: header + empty body per ayah; bodies hydrate on demand
    let html=buildSuraIntro(enabled,loaded);
    // Одноразовая подсказка после редизайна (этап 2, гасится навсегда крестиком)
    if(!gs("tip45",false))html+=`<div class="read-hint"><span>Новое: <b>тап по номеру аята</b> — все действия (теги, заметка, диафильм…). Хифз и Эрудит — на <b>Главной</b> и в меню <b>⋯</b>.</span><button onclick="ss('tip45',true);this.parentElement.remove()" title="Больше не показывать">✕</button></div>`;
    // Панелька аята (этап 1 редизайна): номер · ▶ · метки-состояния · ☆ · ⋯.
    // Теги/заметка/диафильм/запись/копия/счётчик покрытия — в листе аята
    // (openAyahSheet, вход — номер или ⋯); метки — индикаторы, но тап по ним
    // тоже открывает лист. Peek ru/ar — там же.
    for(const aid of ayahIds){
      html+=`<div class="ayah-block" data-aid="${aid}"><div class="ab-head">
        <div class="ab-row"><button class="ab-num-btn" onclick="event.stopPropagation();openAyahSheet(${aid})" title="Все действия с аятом">${aid}</button>
          <button class="ab-ico" onclick="event.stopPropagation();mediaPlayAyah(${aid})" title="Слушать с этого аята">${IC.play}</button>
          <span class="ab-marks" data-marks="${aid}" onclick="event.stopPropagation();openAyahSheet(${aid})">${marksHTML(ST.surah,aid)}</span>
          <button class="ab-ico ab-bm ${isBookmarked(ST.surah,aid)?'on':''}" data-bm="${aid}" onclick="event.stopPropagation();toggleBookmark(${aid},null)" title="Закладка">${IC.star}</button>
          <button class="ab-ico" onclick="event.stopPropagation();openAyahSheet(${aid})" title="Ещё действия">${IC.more}</button>
        </div>
      </div><div class="ab-body" data-aid="${aid}" style="min-height:48px"></div></div>`;
    }
    if(ST.wbwLayer)html+=wbwAttrHTML();          // лицензии глосса/разбора — там же, где глосс
    area.innerHTML=html;
    setupHydration(area,enabled,loaded);
    // a pending jump (📑 Переход) wins over scroll-anchor preservation
    if(ST.scrollToAyah!=null){
      const aid=ST.scrollToAyah;ST.scrollToAyah=null;
      jumpToAyahEl(aid,false);   // до-выравнивание: лениво гидратируемые тела сдвигают цель
    }else if(anchorAid){const t=area.querySelector(`.ayah-block[data-aid="${anchorAid}"]`);if(t)t.scrollIntoView({block:"start"});}
  } else {
    if(hydrationObserver){hydrationObserver.disconnect();hydrationObserver=null;}
    // Vertical columns
    const cols=[];
    for(const qt of quranTexts)cols.push({id:qt.id,name:qt.nameAr||qt.name,isArabic:true,data:loaded[qt.id]});
    for(const t of enabled){
      if(t.id==="_notes")cols.push({id:"_notes",name:"📝 Заметки",isNote:true});
      else cols.push({id:t.id,name:t.name,nameAr:t.nameAr,lang:t.lang,data:loaded[t.id]});
    }
    if(!cols.length){area.innerHTML="";return;}

    // Таблица: 1 узкая колонка номеров + по колонке на источник. tr = аят, высота
    // ряда по самой высокой ячейке (table сам это делает корректно, с переносом).
    // table-layout:fixed → равные колонки; min-width таблицы → горизонтальный скролл.
    const colMin=isM()?200:260;
    const minW=44+cols.length*colMin;
    let html=`<div class="col-wrap"><table class="col-table" style="min-width:${minW}px">`;
    html+=`<colgroup><col style="width:44px">${cols.map(()=>'<col>').join("")}</colgroup>`;
    html+=`<thead><tr><th>#</th>${cols.map(c=>`<th>${esc(c.name)}</th>`).join("")}</tr></thead><tbody>`;
    for(const aid of ayahIds){
      html+=`<tr><td class="col-num" data-aid="${aid}" onclick="openAyahSheet(${aid})" title="Действия с аятом">${aid}</td>`;
      for(const col of cols){
        if(col.isArabic){
          const pk=activePack();const qd=loaded["__qpc"];
          const grid=ST.wbwLayer&&col.id==="_arabic"?wbwGridHTML(ST.surah,aid,loaded):"";
          if(grid){
            html+=`<td class="arabic-main wbw-col">${grid}</td>`;
          }else if(pk&&col.id==="_arabic"&&qd&&qd[String(aid)]){
            html+=`<td class="arabic-main">${renderPackAyah(pk,qd[String(aid)])}</td>`;
          }else{
            const arText=col.data?.[String(aid)]||"";
            const tjs=arText&&col.id==="_arabic"&&loaded.__tj&&loaded.__tj[String(aid)];
            html+=`<td class="arabic-main selectable">${tjs?tajweedHTML(arText,tjs):(arText||'—')}</td>`;
          }
        } else if(col.isNote){
          const note=getNote(ST.surah,aid);
          html+=`<td style="background:var(--note-bg)"><textarea class="ab-note-area" style="min-height:30px;font-size:11px" placeholder="..." oninput="saveNote(${ST.surah},${aid},this.value)">${esc(note)}</textarea></td>`;
        } else {
          const text=col.data?.[String(aid)]||"";
          const isAr=col.lang==="ar";
          // Длинные тафсиры сворачиваем (как в «Списке»): clamped + «Развернуть».
          const {body,notes}=text?splitNotes(text):{body:null,notes:[]};
          const inner=body?renderRefs(body):'—';
          const long=!ST.noTouch&&body&&body.length>600;
          html+=`<td class="md selectable ${isAr?'rtl':''}"><div class="${long?'clamped':''}">${inner}</div>${long?'<button class="more-btn" onclick="toggleClamp(this)">Развернуть ▾</button>':''}${notes.length?renderFootnotes(notes):''}</td>`;
        }
      }
      html+=`</tr>`;
    }
    html+=`</tbody></table></div>`;
    if(ST.wbwLayer)html+=wbwAttrHTML();          // лицензии глосса/разбора — там же, где глосс
    area.innerHTML=html;
    // Вернуть скролл: переход (📑) важнее, иначе — на запомненный верхний аят.
    // Точное позиционирование под липкую шапку (scrollIntoView её не учитывает).
    const colScrollTo=aid=>{
      const lay=area.querySelector(".col-wrap");const cell=lay&&lay.querySelector(`.col-num[data-aid="${aid}"]`);
      if(!lay||!cell)return;
      const th=lay.querySelector("thead");const headH=th?th.getBoundingClientRect().height:0;
      lay.scrollTop+=cell.getBoundingClientRect().top-lay.getBoundingClientRect().top-headH;
    };
    if(ST.scrollToAyah!=null){
      const aid=ST.scrollToAyah;ST.scrollToAyah=null;
      // «Колонки» строятся целиком (без ленивой гидратации), но арабские глифы/
      // шрифты догружаются и меняют высоту рядов — тоже до-выравниваем.
      settleScroll(()=>area.querySelector(`.col-num[data-aid="${aid}"]`),()=>colScrollTo(aid));
    }else if(anchorAid)colScrollTo(anchorAid);
  }
  lastReadingSurah=ST.surah;
}

// ============================================================
// ТЕМАТИЧЕСКИЙ УКАЗАТЕЛЬ (фихрист) — read-only слой поверх механики тегов.
// Данные: data/topics/{tree,verses}.json (build_topics.py из онтологии
// Quranic Arabic Corpus). Дерево тем в панели «📑 Темы»; тап по теме → её аяты
// в главном окне (renderTopicResults). Личные теги пользователя не трогаются;
// у темы есть кнопка «➕ в мои теги» (копирует тему в tagTree/ayahTags).
// ============================================================
const UKAZ_ROOT="Тематический указатель";
let TOPICS=null,_topicsLoading=null;
function loadTopics(){
  if(TOPICS)return Promise.resolve(TOPICS);
  if(_topicsLoading)return _topicsLoading;
  _topicsLoading=Promise.all([
    fetch(resolveUrl("topics",{file:"tree.json"})).then(r=>r.json()),
    fetch(resolveUrl("topics",{file:"verses.json"})).then(r=>r.json())
  ]).then(([tree,verses])=>{
    const byId={},parent={};
    (function idx(ns,par){for(const n of ns){byId[n.id]=n;parent[n.id]=par;if(n.children)idx(n.children,n.id);}})(tree,0);
    TOPICS={tree,verses,byId,parent};return TOPICS;
  }).catch(e=>{_topicsLoading=null;throw e;});
  return _topicsLoading;
}
function topicRowHTML(node,withArrow){
  const has=node.children&&node.children.length;
  const isOpen=!collapsedG["tp_"+node.id];
  const sel=ST.topicSel===node.id;
  const selectable=node.n>0;                     // у темы есть СОБСТВЕННЫЕ аяты
  const toggle=`collapsedG['tp_${node.id}']=!collapsedG['tp_${node.id}'];renderSB();`;
  const rowClick=selectable?`selectTopic(${node.id})`:(has&&withArrow?toggle:"");
  return `<div class="tag-row tp-row ${sel?'selected':''} ${selectable?'':'tp-container'}" ${rowClick?`onclick="${rowClick}"`:''}>
      ${withArrow?`<span class="tag-arrow" ${has?`onclick="event.stopPropagation();${toggle}"`:''}>${has?(isOpen?'▼':'▶'):' '}</span>`:'<span class="tag-arrow"> </span>'}
      <span class="tag-name" ${node.ar?`title="${escAttr(node.ar)}"`:''}>${esc(node.name)}</span>
      ${node.t?`<span class="tag-cnt" title="аятов в теме (с подтемами)">${node.t}</span>`:''}
    </div>`;
}
function topicNodeHTML(node){
  const has=node.children&&node.children.length;
  const isOpen=!collapsedG["tp_"+node.id];
  let h=`<div class="tag-node">`+topicRowHTML(node,true);
  if(has&&isOpen)h+=node.children.map(topicNodeHTML).join("");
  return h+`</div>`;
}
// Крошки (путь по дереву тем) для темы id: массив предков root→родитель, без самой темы.
function topicCrumbs(id){
  if(!TOPICS)return[];
  const chain=[];let p=TOPICS.parent[id];
  while(p){const n=TOPICS.byId[p];if(n)chain.unshift(n);p=TOPICS.parent[p];}
  return chain;
}
// HTML крошек: сегменты-предки через «›»; у кого есть свои аяты (n>0) — кликабельны (→ тема).
function crumbsHTML(id){
  const chain=topicCrumbs(id);
  if(!chain.length)return "";
  return chain.map(n=>n.n>0
    ? `<span class="tp-crumb tp-crumb-link" onclick="event.stopPropagation();selectTopic(${n.id})">${esc(n.name)}</span>`
    : `<span class="tp-crumb">${esc(n.name)}</span>`
  ).join(' <span class="tp-crumb-sep">›</span> ');
}
function renderTopicsPanel(el){
  if(!TOPICS){
    loadTopics().then(()=>{if(ST.sbTab==="topics")renderSB();})
      .catch(()=>{if(ST.sbTab==="topics")el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:11px">Не удалось загрузить указатель</div>';});
    el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:11px">Загрузка указателя…</div>';
    return;
  }
  const raw=ST.search.trim(),q=raw.toLowerCase();
  if(q){                                          // поиск — плоский список совпадений
    const hits=[];
    (function collect(ns){for(const n of ns){if(n.name.toLowerCase().includes(q)||(n.ar&&n.ar.includes(raw)))hits.push(n);if(n.children)collect(n.children);}})(TOPICS.tree);
    el.innerHTML=hits.length
      ? `<div class="tp-hint">Найдено тем: ${hits.length}</div>`+hits.map(n=>{
          const c=crumbsHTML(n.id);
          return `<div class="tp-search-hit">${topicRowHTML(n,false)}${c?`<div class="tp-crumbs-row tp-crumbs-under">${c}</div>`:''}</div>`;
        }).join("")
      : '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:11px">Ничего не найдено</div>';
    return;
  }
  el.innerHTML=`<div class="tp-hint">Тематический указатель Корана — 3 раздела, ${TOPICS.byId?Object.keys(TOPICS.byId).length:695} тем. Тап по теме → её аяты.</div>`
    +TOPICS.tree.map(n=>topicNodeHTML(n)).join("");
}
// Открыть боковую панель на вкладке «📑 Темы» (ссылка «Коранические темы» с Главной).
function openTopics(){
  ST.sidebarOpen=true;
  const sb=document.getElementById("sidebar");if(sb)sb.classList.remove("collapsed");
  setSbTab("topics");
}
function selectTopic(id){
  ST.topicSel=id;
  ST.selectedTag=null;ST.rootView=null;ST.warnMap=null;ST.bookIntro=false;ST.homeMode=false;ST.scanSource=null;ST.srcMode=false;ST.hifzMode=false;ST.eruditMode=false;ST.bmView=false;ST.notesView=false;
  if(isM()){ST.sidebarOpen=false;document.getElementById("sidebar").classList.add("collapsed");}

async function renderTopicResults(el){
  const T=await loadTopics().catch(()=>null);
  if(!T){el.innerHTML='<div class="tag-results"><div style="padding:20px;color:var(--text-muted)">Не удалось загрузить указатель</div></div>';return;}
  const node=T.byId[ST.topicSel];
  const ayahs=(T.verses[ST.topicSel]||[]).slice()
    .sort((a,b)=>{const[sa,aa]=a.split(":").map(Number),[sb,ab]=b.split(":").map(Number);return sa-sb||aa-ab;});
  const surahs=[...new Set(ayahs.map(k=>+k.split(":")[0]))];
  const firstTrans=CONFIG.tafsirs.find(t=>t.lang!=="ar"&&ST.enabled[t.id])||CONFIG.tafsirs.find(t=>t.lang!=="ar");
  await Promise.all(surahs.flatMap(s=>{const ps=[loadChunk("_arabic",s).catch(()=>{})];if(firstTrans)ps.push(loadChunk(firstTrans.id,s).catch(()=>{}));return ps;}));
  const nm=node?node.name:("#"+ST.topicSel);
  const ar=node&&node.ar?` <span class="tr-ar-name">${esc(node.ar)}</span>`:'';
  const crumbs=crumbsHTML(ST.topicSel);
  let html=`<div class="tag-results">`
    +(crumbs?`<div class="tp-crumbs-row tp-crumbs-head">${crumbs}</div>`:'')
    +`<div class="tr-header">📑 ${esc(nm)}${ar} — ${ayahs.length} аят.`
    +(ayahs.length?`<button class="btn-s" onclick="topicToMyTags(${ST.topicSel})" title="Скопировать тему в ваши личные теги">➕ в мои теги</button>`:'')
    +`</div>`;
  if(!ayahs.length)html+=`<div style="color:var(--text-muted);padding:20px;text-align:center">У этой рубрики нет собственных аятов — раскройте подтемы в панели «📑 Темы».</div>`;
  for(const k of ayahs){
    const[s,a]=k.split(":");
    const su=SURAHS.find(x=>x.id==+s);
    const arText=getArabicFromCache(+s,+a);
    const trText=getAnyTranslation(+s,+a);
    html+=`<div class="tr-ayah" onclick="goAyah(${s},${a})">
      <div class="tr-ayah-ref">${su?esc(su.ru):s} : ${a}</div>
      ${arText?`<div class="tr-ayah-ar">${arText}</div>`:''}
      ${trText?`<div class="tr-ayah-tr">${trText}</div>`:''}
    </div>`;
  }
  el.innerHTML=html+`</div>`;
}
// Скопировать тему указателя в личные теги пользователя (под корнем «Тематический
// указатель»): создаёт ветку и метит все аяты темы. Не затирает существующее.
function topicToMyTags(id){
  loadTopics().then(T=>{
    const node=T.byId[id],ayahs=(T.verses[id]||[]);
    if(!node||!ayahs.length){alert("У этой темы нет аятов для добавления.");return;}
    const leaf=node.name.split("/").join("∕");    // «/» = разделитель путей тегов
    const tree=getTagTree();
    let root=tree.find(n=>n.name===UKAZ_ROOT);
    if(!root){root={name:UKAZ_ROOT,children:[]};tree.push(root);}
    if(!root.children)root.children=[];
    if(!root.children.find(n=>n.name===leaf))root.children.push({name:leaf,children:[]});
    setTagTree(tree);
    const path=UKAZ_ROOT+"/"+leaf,at=getAyahTags();
    for(const k of ayahs){if(!at[k])at[k]=[];if(!at[k].includes(path))at[k].push(path);}
    setAyahTags(at);
    alert(`Тема «${node.name}» (${ayahs.length} аят.) добавлена в ваши теги → «${UKAZ_ROOT}».`);
  }).catch(()=>alert("Не удалось загрузить указатель."));
}

// ============================================================
// КОНКОРДАНС: указатель корней + вхождения корня (data/wbw/roots.json)
// ============================================================
// Два экрана на одном поле ST.rootView: "*" — указатель (все 1651 корень с
// поиском), "<корень>" — все его вхождения. Три входа: ссылка с Главной,
// тап по корню в грам-карточке слова, и «← Все корни» с экрана вхождений.
// Слова без корня (частицы, ~35%) в индекс не входят — корня нет и в корпусе.
// Панель «🌿 Корни» — НАВИГАТОР (правило: панель — навигатор, окно — контент).
// Поиск берём из общего поля шапки панели (ST.search), как это делают Суры и Темы.
// Полноэкранный указатель остаётся вторым видом того же списка — как у Закладок
// («⛶ На весь экран»): в 240px-панели десктопа 1651 корень с подписями тесноват.
function renderRootsPanel(el){
  if(!ROOTS){
    loadRoots().then(()=>{if(ST.sbTab==="roots")renderSB();});
    el.innerHTML='<div class="rt-hint" style="padding:20px;text-align:center">Загрузка указателя корней…</div>';
    return;
  }
  const q=ST.search.trim().toLowerCase();
  const hits=rootsMatching(q);
  const LIM=250;
  el.innerHTML=`<div class="rt-hint">${q?`Найдено корней: ${hits.length}`:`Корней: ${hits.length}. Тап — все места с этим корнем.`}
      <button class="show-more-btn" style="margin:5px 0 0" onclick="openRoots()">⛶ На весь экран</button></div>`
    +hits.slice(0,LIM).map(r=>{
      const v=ROOTS[r];
      return `<div class="rt-row rt-row-sb ${ST.rootView===r?'on':''}" onclick="selectRoot('${escAttr(r)}')">
        <span class="rt-ar">${esc(r)}</span><span class="rt-n">${v.n}</span>
        <span class="rt-gl">${esc((v.g||[]).join(" · "))}</span></div>`;
    }).join("")
    +(hits.length>LIM?`<div class="rt-hint">Показаны первые ${LIM} — уточните поиск.</div>`:"")
    +(hits.length?"":'<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:11px">Ничего не найдено</div>');
}
// Отбор корней: по арабскому корню ИЛИ по русскому глоссу-подписи (общий для панели
// и полноэкранного указателя — иначе два поиска разошлись бы по поведению).
function rootsMatching(q){
  const s=String(q||"").trim().toLowerCase(),out=[];
  for(const r in ROOTS){
    if(s&&!(r.includes(s)||(ROOTS[r].g||[]).some(g=>g.toLowerCase().includes(s))))continue;
    out.push(r);
  }
  return out;
}
// Ссылка «🌿 Корни слов» с Главной → открыть панель на вкладке корней (как openTopics).
function openRootsPanel(){
  ST.sidebarOpen=true;
  const sb=document.getElementById("sidebar");if(sb)sb.classList.remove("collapsed");
  setSbTab("roots");
}
function openRoots(){selectRootView("*");}
function selectRoot(root){selectRootView(root);}
function selectRootView(v){
  ST.rootView=v;ST.rootForm=null;ST.rootLimit=20;ST.warnMap=null;
  if(v==="*")ST.rootQ="";                      // указатель открывается чистым, без прошлого фильтра
  ST.topicSel=null;ST.selectedTag=null;ST.bookIntro=false;ST.homeMode=false;
  ST.scanSource=null;ST.srcMode=false;ST.hifzMode=false;ST.eruditMode=false;ST.bmView=false;ST.notesView=false;
  hideWordCard();                              // экран открывается ИЗ карточки — она бы висела поверх
  if(isM()){ST.sidebarOpen=false;document.getElementById("sidebar").classList.add("collapsed");}
  render();
}
// Переход на аят из списка вхождений: экран конкорданса гасим (иначе renderCenter
// проверит rootView раньше ленты и мы никуда не уйдём — см. порядок в renderCenterBody).
function goRootAyah(s,a){ST.rootView=null;ST.warnMap=null;goAyah(s,a);flashAyah(a);}
function rootScreen(el){return ST.rootView==="*"?renderRootsIndex(el):renderRootOccurrences(el);}

// — Экран-указатель: 1651 корень, поиск по арабскому корню ИЛИ по русскому глоссу —
async function renderRootsIndex(el){
  const R=await loadRoots();
  if(!R){el.innerHTML='<div class="tag-results"><div style="padding:20px;color:var(--text-muted)">Не удалось загрузить указатель корней.</div></div>';return;}
  if(ST.rootView!=="*")return;                 // пока грузили — успели уйти на другой экран
  el.innerHTML=`<div class="tag-results">
    <div class="tr-header">🌿 Корни слов Корана — ${Object.keys(R).length}</div>
    <div class="rt-hint">Тап по корню → все места, где он встречается. Искать можно и по-русски
      («милост»), и арабским корнем («رحم») — подпись у корня даёт черновой пословный глосс.</div>
    <input class="rt-search" id="rtSearch" placeholder="Поиск корня: милост / رحم" value="${escAttr(ST.rootQ)}" oninput="rootsFilter(this.value)">
    <div id="rootsList"></div></div>`;
  rootsFilter(ST.rootQ);
}
// Список перерисовывается ОТДЕЛЬНО от экрана: иначе innerHTML родителя на каждый
// ввод отбирал бы фокус у поля поиска на первом же символе.
function rootsFilter(q){
  ST.rootQ=q;
  const box=document.getElementById("rootsList");if(!box||!ROOTS)return;
  const s=String(q||"").trim().toLowerCase();
  const hits=rootsMatching(s);                 // общий отбор с панелью — чтобы поиск не разошёлся
  const LIM=250;                               // 1651 строки разом — лишняя работа телефону
  const shown=hits.slice(0,LIM);
  box.innerHTML=(s?`<div class="rt-hint">Найдено корней: ${hits.length}</div>`:"")
    +shown.map(r=>{
      const v=ROOTS[r];
      return `<div class="rt-row" onclick="selectRoot('${escAttr(r)}')">
        <span class="rt-ar">${esc(r)}</span>
        <span class="rt-n" title="вхождений в Коране">${v.n}</span>
        <span class="rt-gl">${esc((v.g||[]).join(" · "))}</span></div>`;
    }).join("")
    +(hits.length>LIM?`<div class="rt-hint">Показаны первые ${LIM} из ${hits.length} — уточните поиск.</div>`:"")
    +(hits.length?"":'<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12px">Ничего не найдено</div>');
}

// — Экран вхождений корня: формы-фильтры + аяты порциями —
async function renderRootOccurrences(el){
  const R=await loadRoots();
  const root=ST.rootView;
  if(!R||!R[root]){el.innerHTML='<div class="tag-results"><div style="padding:20px;color:var(--text-muted)">Нет данных по этому корню.</div></div>';return;}
  if(!root||root==="*")return;                 // ушли с экрана, пока грузился индекс
  const v=R[root];
  // адреса выбранной формы либо всех форм; порядок мусхафа внутри формы уже задан сборкой
  const picked=ST.rootForm?v.f.filter(f=>f[0]===ST.rootForm):v.f;
  const locs=[];
  for(const[form,addr]of picked)for(const l of addr.split(" "))locs.push({form,loc:l});
  if(!ST.rootForm)locs.sort((a,b)=>{const x=a.loc.split(":").map(Number),y=b.loc.split(":").map(Number);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2];});
  const page=locs.slice(0,ST.rootLimit);
  // текст тянем ТОЛЬКО для показанной порции: иначе корень أله (2851 вхождение)
  // утащил бы чанки всех 114 сур ради двух десятков видимых карточек
  const surahs=[...new Set(page.map(x=>+x.loc.split(":")[0]))];
  const firstTrans=CONFIG.tafsirs.find(t=>t.lang!=="ar"&&ST.enabled[t.id])||CONFIG.tafsirs.find(t=>t.lang!=="ar");
  await Promise.all(surahs.flatMap(s=>{const ps=[loadChunk("_arabic",s).catch(()=>{})];if(firstTrans)ps.push(loadChunk(firstTrans.id,s).catch(()=>{}));return ps;}));
  if(ST.rootView!==root)return;
  const chips=v.f.map(([form,addr])=>{
    const n=addr.split(" ").length,on=ST.rootForm===form;
    return `<span class="rt-chip ${on?'on':''}" onclick="rootSetForm(${on?'null':`'${escAttr(form)}'`})">${esc(form)}<span class="rt-chip-n">${n}</span></span>`;
  }).join("");
  let html=`<div class="tag-results">
    <div class="rt-back" onclick="openRoots()">‹ Все корни</div>

function tagLabel(id){const f=(CONFIG.facetTags||[]).find(x=>x.id===id);return f?f.name:id;}
function configHasFacet(key,v){return CONFIG.tafsirs.some(t=>key==="tags"?(t.tags||[]).includes(v):(t[key]||"")===v);}
function passFacets(t){
  for(const key of ["lang","kind","era"]){
    const act=ST.facets[key];

  }

function tafsirMeta(t){
  const bits=[];
  if(t.era==="classical")bits.push("классич.");else if(t.era==="modern")bits.push("совр.");

  const composite=Array.isArray(t.segments)&&t.segments.length>=2;
  if(composite){

    pills=`<span class="t-pill" title="Разные переводчики по сурам — статус по каждой части">составной</span>`
      +(anyAppr?`<span class="t-pill appr" title="Часть сур выверена и одобрена">✓✓ частично</span>`:'')+pills;
  }else{
    const lvl=reviewLevel(t);
    if(lvl==="caution")pills=`<span class="t-pill warn" title="Относитесь с осторожностью — возможны ошибки и вероучительные отклонения">⚠ осторожно</span>`+pills;

// ── Подтафсиры: источник с полем `parent` — дочерний узел родителя (напр. асары
// муджтахидов Ибн Аббас/Судди/… внутри свода «аль-Мавсу'а»). Вложенность даётся во
// ВСЕХ списках выбора: каталог 📚, попап покрытия, режим источника, менеджер. ──
function srcChildren(pid){return CONFIG.tafsirs.filter(t=>t.parent===pid);}
function srcIsParent(id){return CONFIG.tafsirs.some(t=>t.parent===id);}
// Разложить список так, чтобы дети шли СРАЗУ за родителем (плоские списки без
// сворачивания — попап/пикер/менеджер). Ребёнок, чьего родителя нет в списке,
// остаётся верхним уровнем. Возвращает [{t,depth}] в порядке config.
function srcOrderNested(items){
  const byId=new Map(items.map(t=>[t.id,t]));
  const kids=new Map();
  items.forEach(t=>{if(t.parent&&byId.has(t.parent)){(kids.get(t.parent)||kids.set(t.parent,[]).get(t.parent)).push(t);}});
  const out=[];
  items.forEach(t=>{
    if(t.parent&&byId.has(t.parent))return;
    out.push({t,depth:0});
    (kids.get(t.id)||[]).forEach(k=>out.push({t:k,depth:1}));
  });
  return out;
}
// Узел каталога 📚: обычный источник ИЛИ родитель со сворачиваемым списком детей.
// `pool` — уже отфильтрованный каталог (не-включённые, по фасетам/поиску). Дети по
// умолчанию свёрнуты (чтобы длинный свод не мешал скроллить); поиск раскрывает.
function catNodeHTML(t,pool,q,orphan){
  const kids=pool.filter(x=>x.parent===t.id);
  if(!kids.length)return tItem(t,false,false);   // обычный источник — ячейка сетки
  // Родитель с детьми — на всю ширину строки (.t-node), дети свёрнуты по умолчанию.
  const head= orphan
    ? `<div class="t-parent-head">${esc(t.name)} <span class="t-parent-note">· включён (читается)</span></div>`
    : tItem(t,false,false);
  const key="sub_"+t.id, open=q?true:!!collapsedG[key];
  let h=`<div class="t-node">${head}<div class="t-subwrap"><button class="t-sub-toggle" onclick="event.stopPropagation();collapsedG['${key}']=!collapsedG['${key}'];renderRP();">${open?'▾':'▸'} Подтафсиры · ${kids.length}${open?'':' — показать'}</button>`;
  if(open)h+=`<div class="t-sub">`+kids.map(k=>tItem(k,false,false)).join("")+`</div>`;
  return h+`</div></div>`;
}

// чтобы новодобавленные источники были видны сами. «Убрать из набора» = внести
// в скрытые; «вернуть» = убрать оттуда. Не входит в SYNCED_KEYS (набор локален). ─
function recAll(){return (CONFIG.audio&&CONFIG.audio.reciters)||[];}
function recHiddenSet(){
  let h=gs("recHidden",null);
  if(h===null){h=recAll().filter(r=>!r.recommended).map(r=>r.id);ss("recHidden",h);}  // первый запуск: прячем не-рекомендованных
  return new Set(h);
}
function recVisible(){const h=recHiddenSet();return recAll().filter(r=>!h.has(r.id));}
function recSetHidden(id,hide){const h=recHiddenSet();hide?h.add(id):h.delete(id);ss("recHidden",[...h]);}
// Переводы/тафсиры: по умолчанию НИЧЕГО не скрыто (список короче, чем у чтецов).
function srcHiddenSet(){return new Set(gs("srcHidden",[]));}
function srcSetHidden(id,hide){const h=srcHiddenSet();hide?h.add(id):h.delete(id);ss("srcHidden",[...h]);}

function audioBlockHTML(){
  if(!recAll().length)return"";
  const cur=gs("mediaReciter",(CONFIG.audio&&CONFIG.audio.default)||recAll()[0].id);
  let rs=recVisible();
  // Активный чтец всегда виден, даже если попал в скрытые (иначе «пропал» выбор).
  if(!/^rec:/.test(cur)&&!rs.some(r=>r.id===cur)){const c=recAll().find(r=>r.id===cur);if(c)rs=[c,...rs];}
  const rows=rs.map(r=>`<label class="vp-check"><input type="radio" name="mediaRec" ${r.id===cur?"checked":""} onchange="mediaSetReciter('${escAttr(r.id)}')"> ${esc(r.name)}</label>`).join("");
  // Наборы записей пользователя — полноправные источники наравне с чтецами.
  // Метаданные (id+имя) — в localStorage (tl_mediaSets, вне синка), сами
  // записи (blob) — только в IndexedDB (media.js).
  const sets=gs("mediaSets",[]);
  const setRows=sets.map(s=>`<label class="vp-check" style="display:flex;align-items:center;gap:4px"><input type="radio" name="mediaRec" ${("rec:"+s.id)===cur?"checked":""} onchange="mediaSetReciter('rec:${escAttr(s.id)}')"> <span style="flex:1">🎙 ${esc(s.name)}</span><button class="t-info-btn" onclick="event.preventDefault();mediaDelSet('${escAttr(s.id)}')" title="Удалить набор со всеми записями">🗑</button></label>`).join("");
  const hidN=recHiddenSet().size;
  const manage=`<button class="show-more-btn" style="margin:2px 0 0" onclick="openReciterManager()">⚙ Управлять чтецами${hidN?` (скрыто ${hidN})`:""}…</button>`;
  return `<div class="rp-quran"><div class="rp-sec-head">🎧 Аудио (чтец)</div>
    <div class="rp-q-body">${rows}${setRows}${manage}
    <button class="cov-map-open" style="margin:6px 0 0" onclick="mediaPlaySurah()">▶ Слушать текущую суру</button>
    <button class="cov-map-open" style="margin:6px 0 0" onclick="mediaNewSet()">➕ Новый набор записей</button>
    <div class="vp-note">Чтецы стримятся с everyayah.com (нужен интернет). Наборы записей — ваш голос, кнопка 🎙 в плеере; хранятся только на этом устройстве и работают офлайн. Диафильм (полноэкранный визуальный ряд) — кнопка 🎬 в плеере или в меню аята (тап по номеру).</div></div></div>`;
}
// Новый набор записей: имя → tl_mediaSets; записи в него кладёт попап 🎙
function mediaNewSet(){
  const name=(prompt("Название набора записей (например «Мой голос»):")||"").trim();
  if(!name)return;
  const sets=gs("mediaSets",[]);
  const id="s"+Date.now().toString(36);
  sets.push({id,name});ss("mediaSets",sets);renderAudioPanel();
}
// Удалить набор: метаданные из tl_mediaSets + все blob из IndexedDB (media.js)
function mediaDelSet(id){
  const sets=gs("mediaSets",[]);const s=sets.find(x=>x.id===id);
  if(!s||!confirm("Удалить набор «"+s.name+"» со всеми записями? Это необратимо."))return;
  ss("mediaSets",sets.filter(x=>x.id!==id));
  if(gs("mediaReciter","")==="rec:"+id)ss("mediaReciter",(CONFIG.audio&&CONFIG.audio.default)||"");
  mediaMod().then(m=>m&&m.deleteSetData(id)).finally(()=>{renderAudioPanel();renderCenter();});
}

function renderRP(){
  const el=document.getElementById("rpList");
  if(!el)return;
  const q=ST.rpFilter||"";
  const sh=srcHiddenSet();
  // ЭТАП 2 редизайна: три вкладки «Выбрано | Каталог | Оригинал и слои»;
  // фасеты — за кнопкой «Фильтры»; пресеты наборов; «Оригинал» — своя вкладка.
  const tab=ST.rpTab||"sel";
  const tb=(id,lab)=>`<button class="${tab===id?'on':''}" onclick="ST.rpTab='${id}';renderRP()">${lab}</button>`;
  let html=`<div class="rp-tabs">${tb("sel","Выбрано")+tb("cat","Каталог")+tb("orig","Оригинал и слои")}</div>`;

  if(tab==="orig"){
    // Редакции арабского + таджвид + пословный слой (см. quranBlockHTML)
    el.innerHTML=html+quranBlockHTML();
    return;
  }

  if(tab==="sel"){
    // Пресеты наборов: текущая ручная подборка автосохраняется в «Мой набор»
    html+=`<div class="rp-presets">`+
      `<button class="rp-preset" onclick="applyPreset('tr')" title="Оставить один перевод смыслов">Только перевод</button>`+
      `<button class="rp-preset" onclick="applyPreset('taf')" title="Перевод + один тафсир">Перевод + тафсир</button>`+
      `<button class="rp-preset" onclick="applyPreset('study')" title="Перевод + пословный разбор и таджвид">Учёба</button>`+
      (gs("myPreset",null)?`<button class="rp-preset" onclick="applyPreset('mine')" title="Вернуть вашу сохранённую подборку">Мой набор</button>`:"")+
      `</div>`;
    const enAll=getEnabledList().filter(t=>t.id!=="_notes");
    if(enAll.length){
      // ▲▼ порядка — только в явном режиме «упорядочить» (этап 1: меньше микро-кнопок)
      html+=`<div class="rp-sec-head" style="display:flex;align-items:center;gap:8px">✓ Включено · ${enAll.length}${enAll.length>1?`<button class="rp-reorder-btn ${ST.rpReorder?'on':''}" onclick="event.stopPropagation();ST.rpReorder=!ST.rpReorder;renderRP()" title="Изменить порядок источников">⇅ порядок</button>`:''}</div>`;
      enAll.forEach(t=>{html+=tItem(t,true,!!ST.rpReorder);});
    }else{
      html+=`<div class="vp-note">Ни один перевод или тафсир не включён — показывается только арабский текст. Добавьте из каталога.</div>`;
    }
    const notesOn=ST.enabled._notes;
    html+=`<div class="t-item special ${notesOn?'checked':''}" onclick="toggleEn('_notes')">
      <div class="t-check">${notesOn?'✓':''}</div>
      <div class="t-info"><div class="t-name">📝 Мои заметки <span style="font-weight:400;color:var(--text-muted);font-size:10px">· личные</span></div></div>
    </div>`;
    html+=`<button class="rp-add-cat" onclick="ST.rpTab='cat';renderRP()">＋ Добавить из каталога</button>`;
    html+=`<button class="cov-map-open" style="margin-top:10px" onclick="setMode('source')">🗺 Карта покрытия · чтение по источнику</button>`;
    el.innerHTML=html;
    return;
  }

  // tab==="cat": фильтры — по запросу, дальше каталог как раньше
  const facN=facetActiveCount();
  html+=`<button class="rp-filters-btn ${ST.rpFacetsOpen?'on':''}" onclick="ST.rpFacetsOpen=!ST.rpFacetsOpen;renderRP()">⚲ Фильтры${facN?` · ${facN}`:""} <span style="margin-left:auto">${ST.rpFacetsOpen?"▴":"▾"}</span></button>`;
  if(ST.rpFacetsOpen)html+=renderFacetBar();
  let anyShown=false;
  CONFIG.groups.forEach(g=>{
    let items=CONFIG.tafsirs.filter(t=>t.group===g.id&&t.kind!=="quran"&&(t.kind==="image"||!ST.enabled[t.id])&&!sh.has(t.id)).filter(passFacets);
    if(q)items=items.filter(t=>(t.name||"").toLowerCase().includes(q)||(t.nameAr||"").includes(q)||(t.author||"").toLowerCase().includes(q)||(t.translator||"").toLowerCase().includes(q));
    if(!items.length)return;
    anyShown=true;
    const col=collapsedG["rg_"+g.id];
    // Верхний уровень группы: элементы без родителя + «осиротевшие» родители (сам
    // свод уже включён/скрыт, но его дети ещё в каталоге — покажем узел-крышу).
    // Дети под родителем не считаются отдельными узлами (свёрнуты по умолчанию),
    // поэтому длинный свод не раздувает список и превью «ещё…».
    const catIds=new Set(items.map(t=>t.id));
    const orphanPids=new Set(items.filter(t=>t.parent&&!catIds.has(t.parent)).map(t=>t.parent));
    const nodes=[];
    CONFIG.tafsirs.forEach(t=>{
      if(t.group!==g.id)return;
      if(catIds.has(t.id)&&!t.parent)nodes.push({t,orphan:false});
      else if(orphanPids.has(t.id))nodes.push({t,orphan:true});
    });
    // «Переводы» — длинный список: показываем превью (несколько) + «ещё…», чтобы
    // секция была заметна, но не занимала весь экран. Прочие группы — целиком.
    const LIMIT=(g.id==="translations")?4:12;
    const expanded=ST.expandedGroups[g.id];
    const showNodes=(!expanded&&nodes.length>LIMIT)?nodes.slice(0,LIMIT):nodes;
    html+=`<div class="tg ${col?'collapsed':''}"><button class="tg-head" onclick="collapsedG['rg_${g.id}']=!collapsedG['rg_${g.id}'];renderRP();">
      <span class="tg-icon">${g.icon||'📁'}</span>${g.name} (${nodes.length})<span class="tg-arrow">▼</span>
    </button><div class="tg-items">`;
    showNodes.forEach(n=>{html+=catNodeHTML(n.t,items,q,n.orphan);});
    if(!expanded&&nodes.length>LIMIT)html+=`<button class="show-more-btn" onclick="event.stopPropagation();ST.expandedGroups['${g.id}']=true;renderRP();">ещё ${nodes.length-LIMIT}…</button>`;
    else if(expanded&&nodes.length>LIMIT)html+=`<button class="show-more-btn" onclick="event.stopPropagation();ST.expandedGroups['${g.id}']=false;renderRP();">свернуть</button>`;
    html+=`</div></div>`;
  });
  if(!anyShown)html+=`<div style="padding:16px 12px;text-align:center;color:var(--text-muted);font-size:11px">${anyFacetActive()||q?'Ничего не найдено по фильтрам':'Всё включено'}</div>`;

  el.innerHTML=html;
}

// Arabic text normalization for search
const AR_DIACRITICS=/[ؐ-ًؚ-ٰٟۖ-ۜ۟-۪ۨ-ۭ࣓-ࣿ]/g;
const AR_TATWEEL=/\u0640/g; // Kashida/Tatweel

function normalizeArabic(s){
  return s
    .replace(AR_DIACRITICS,"")   // remove tashkeel
    .replace(AR_TATWEEL,"")      // remove tatweel/kashida
    .replace(/[أإآٱ]/g,"ا")  // alif forms -> alif
    .replace(/ة/g,"ه")                      // ta marbuta -> ha
    .replace(/ى/g,"ي");                     // alif maqsura -> ya
}

function normalizeSearch(s){return normalizeArabic(s).toLowerCase().trim();}

// Arabic Quran-text variants (kind:quran) — rendered as the main Arabic column(s), in config order
function getEnabledQuranTexts(){return CONFIG.tafsirs.filter(t=>t.kind==="quran"&&ST.enabled[t.id]);}
function isQuranText(id){const t=CONFIG.tafsirs.find(x=>x.id===id);return t&&t.kind==="quran";}

function getEnabledList(){
  let uo=getUserOrder();
  const allTafsirs=[];
  const allIds=new Set();

  // Collect enabled tafsirs/translations (Quran-text variants are handled separately)
  CONFIG.groups.forEach(g=>{
    CONFIG.tafsirs.filter(t=>t.group===g.id&&t.kind!=="quran"&&t.kind!=="image").forEach(t=>{
      if(ST.enabled[t.id]){allTafsirs.push(t);allIds.add(t.id);}
    });
  });
  if(ST.enabled._notes){allTafsirs.push({id:"_notes",name:"Мои заметки"});allIds.add("_notes");}

  if(uo.length){
    // Clean stale IDs (removed from config or disabled)
    uo=uo.filter(id=>allIds.has(id));
    // Find new IDs not in userOrder — append at end
    const newIds=[];
    allTafsirs.forEach(t=>{if(!uo.includes(t.id))newIds.push(t.id);});
    if(newIds.length){uo=uo.concat(newIds);setUserOrder(uo);}

    // Build ordered list
    const ordered=[];
    uo.forEach(id=>{const t=allTafsirs.find(x=>x.id===id);if(t)ordered.push(t);});
    return ordered;
  }
  return allTafsirs;
}

function moveEnabled(id,dir){
  const list=getEnabledList().map(t=>t.id);
  const idx=list.indexOf(id);
  if(idx<0)return;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=list.length)return;
  [list[idx],list[newIdx]]=[list[newIdx],list[idx]];
  setUserOrder(list);
  renderRP();
  renderCenter();
}

let searchTimer=null;

// Поиск — ВКЛАДКА рельса, а не плавающая панель поверх текста: он навигатор по
// природе (нашёл → перешёл), а оверлей закрывал собой тот самый аят, от которого
// пляшешь. Строка ввода — общее поле шапки панели (как у Сур/Тем/Корней), кнопка 🔍
// в шапке просто открывает вкладку (так же ведёт себя ⚙).
function openSearchTab(){
  ST.sidebarOpen=true;
  const sb=document.getElementById("sidebar");if(sb)sb.classList.remove("collapsed");
  setSbTab("search");
  const inp=document.getElementById("sbSearchInp");if(inp)inp.focus();
  updateBackdrop();
}
// Тело вкладки. Результаты обновляет doSearch — он пишет в #spResults/#spCount
// точечно, поэтому набор текста не перерисовывает панель и не рвёт фокус.
function renderSearchPanel(el){
  el.innerHTML=`<div class="sp-opts">
      <label class="sp-opt-label"><input type="checkbox" ${ST.searchAll?"checked":""} onchange="ST.searchAll=this.checked;scheduleSearch(0)"> Искать во всех тафсирах</label>
    </div>
    <div class="sp-count hidden" id="spCount"></div>
    <div class="sp-results" id="spResults"></div>`;
  scheduleSearch(0);
}
function scheduleSearch(delay){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(doSearch,delay==null?400:delay);
}

async function doSearch(){
  if(ST.sbTab!=="search")return;              // ушли на другую вкладку — результаты некуда класть
  const raw=ST.search;
  const query=normalizeSearch(raw);
  const resultsEl=document.getElementById("spResults");
  const countEl=document.getElementById("spCount");

  // Ввод похож на ссылку на аят («2:255», либо число = аят текущей суры) → первой
  // строкой предлагаем прямой переход. Поиск по текстам при этом работает как был:
  // строка перехода просто встаёт НАД результатами.
  const ref=parseAyahRef(raw);
  const jumpHTML=ref?`<div class="sp-result sp-jump" onclick="goSearchAyah(${ref.surah},${ref.ayah})">
      <div class="sp-ref">➜ Перейти к аяту ${ref.surah}:${ref.ayah}</div>
      <div class="sp-src">${esc(ref.su.ru)} · аят ${ref.ayah} из ${ref.su.n}</div>
    </div>`:"";

  if(query.length<2){
    resultsEl.innerHTML=jumpHTML+`<div class="sp-status">${ref?"Поиск по текстам — от 2 символов":"Введите минимум 2 символа"}</div>`;
    countEl.classList.add("hidden");
    return;
  }

  resultsEl.innerHTML=jumpHTML+`<div class="sp-status">Поиск...</div>`;

  const searchAll=ST.searchAll;   // состояние, а не DOM: вкладка перерисовывается

  // Determine which tafsirs to search
  let toSearch=[];
  if(searchAll){
    toSearch=CONFIG.tafsirs.slice();
  } else {
    CONFIG.groups.forEach(g=>{
      CONFIG.tafsirs.filter(t=>t.group===g.id).forEach(t=>{
        if(ST.enabled[t.id])toSearch.push(t);
      });
    });
  }

  // Also search in built-in ayah translations
  const results=[];
  const MAX=100;

  // Query words (>=2 chars) for the inverted index (AND across tokens, substring on words)
  const tokens=(query.match(/[\p{L}\p{N}_]+/gu)||[]).filter(w=>w.length>=2);

  for(const t of toSearch){
    if(results.length>=MAX)break;
    const idx=tokens.length?await loadIndex(t.id):null;
    let refs=null; // Set of "s:a" satisfying ALL tokens — null means "no index, fall back"
    if(idx){
      for(const tok of tokens){
        const set=new Set();
        for(const w in idx){if(w.includes(tok))for(const ref of idx[w].split(" "))set.add(ref);}
        if(refs===null)refs=set; else for(const r of [...refs])if(!set.has(r))refs.delete(r);
        if(refs.size===0)break;
      }
    }
    if(refs!==null){
      // Index hit: pull display text only for matched ayahs, grouped by surah (chunked)
      const bySurah={};
      for(const ref of refs){const c=ref.indexOf(":");(bySurah[ref.slice(0,c)]=bySurah[ref.slice(0,c)]||[]).push(ref.slice(c+1));}
      for(const sid of Object.keys(bySurah).sort((a,b)=>+a-+b)){
        if(results.length>=MAX)break;
        const chunk=await loadChunk(t.id,+sid);
        for(const aid of bySurah[sid].sort((a,b)=>+a-+b)){
          if(results.length>=MAX)break;
          const text=chunk[aid];if(!text)continue;
          results.push({surah:+sid,ayah:+aid,text,source:t.name,sourceAr:t.nameAr,lang:t.lang,tafsirId:t.id});
        }
      }
    }else{
      // No index — fall back to full-text scan
      const data=await loadWhole(t.id);
      if(!data)continue;
      for(const sid in data){
        if(results.length>=MAX)break;
        const surahData=data[sid];
        for(const aid in surahData){
          if(results.length>=MAX)break;
          if(normalizeSearch(surahData[aid]).includes(query)){
            results.push({surah:+sid,ayah:+aid,text:surahData[aid],source:t.name,sourceAr:t.nameAr,lang:t.lang,tafsirId:t.id});
          }
        }
      }
    }
  }

  // Also search user notes
  const notes=getNotes();
  for(const k in notes){
    if(results.length>=MAX)break;
    const normalized=normalizeSearch(notes[k]);
    if(normalized.includes(query)){
      const[s,a]=k.split(":");
      results.push({surah:+s,ayah:+a,text:notes[k],source:"📝 Мои заметки",lang:"ru"});
    }
  }

  countEl.textContent=`Найдено: ${results.length}${results.length>=MAX?' (показаны первые '+MAX+')':''}`;
  countEl.classList.remove("hidden");

  if(!results.length){
    resultsEl.innerHTML=jumpHTML+`<div class="sp-status">Ничего не найдено</div>`;
    return;
  }

  // Render results with highlighting
  resultsEl.innerHTML=jumpHTML+results.map(r=>{
    const su=SURAHS.find(s=>s.id===r.surah);
    const suName=su?su.ru:`Сура ${r.surah}`;
    const isAr=r.lang==="ar";

    // Get a snippet around the match
    let snippet=r.text;
    const nText=normalizeSearch(snippet);
    const matchPos=nText.indexOf(query);
    if(snippet.length>300&&matchPos>=0){
      const start=Math.max(0,matchPos-80);
      const end=Math.min(snippet.length,matchPos+query.length+120);
      snippet=(start>0?'...':'')+snippet.substring(start,end)+(end<snippet.length?'...':'');
    }

    // Highlight matches (approximate — highlight in original based on normalized position)
    const highlightedSnippet=highlightMatch(snippet,query);

    return `<div class="sp-result" onclick="goSearchResult(${r.surah},${r.ayah})">
      <div class="sp-ref">${suName} : ${r.ayah}</div>
      <div class="sp-src">${esc(r.source)} ${r.sourceAr?'<span style="font-family:Amiri;direction:rtl">'+r.sourceAr+'</span>':''}</div>
      <div class="sp-text ${isAr?'rtl':''}">${highlightedSnippet}</div>
    </div>`;
  }).join("");
}

function highlightMatch(text,query){
  const orig=text;
  const norm=normalizeArabic(orig).toLowerCase();

  // Build map: normalized index → original index
  const map=[];
  for(let oi=0;oi<orig.length;oi++){
    const normalized=normalizeArabic(orig[oi]).toLowerCase();
    for(let k=0;k<normalized.length;k++) map.push(oi);
  }
  map.push(orig.length); // sentinel

  // Find all matches in normalized text
  const matches=[];
  let pos=norm.indexOf(query);
  while(pos>=0){
    const origStart=map[pos]!==undefined?map[pos]:0;
    const normEnd=pos+query.length;
    const origEnd=normEnd<map.length?map[normEnd]:orig.length;
    matches.push([origStart,origEnd]);
    pos=norm.indexOf(query,normEnd);
  }

  if(!matches.length)return esc(orig);

  const parts=[];
  let last=0;
  for(const[s,e]of matches){
    if(s>last)parts.push(esc(orig.substring(last,s)));
    parts.push('<span class="sp-hl">'+esc(orig.substring(s,e))+'</span>');
    last=e;
  }
  if(last<orig.length)parts.push(esc(orig.substring(last)));
  return parts.join("");
}

function onSearchKey(e){

  if(ref){goSearchAyah(ref.surah,ref.ayah);return;}

function goSearchResult(surah,ayah){

  // ST.scrollToAyah обязателен: renderCenter асинхронный и при ТОЙ ЖЕ суре сам
  // возвращает скролл на прежний верхний аят (якорь) — без этого переход из
  // поиска отбрасывало назад, на аят, с которого поиск открывали.
  ST.scrollToAyah=ayah;

// Подсветить аят ПОСЛЕ ре-рендера: renderCenter затирает DOM и сам ставит скролл
// по ST.scrollToAyah (обнуляя его) — подсвечивать раньше бессмысленно.
function flashAyah(ayah){
  let tries=0;
  (function wait(){
    if(ST.scrollToAyah!=null&&tries++<40){setTimeout(wait,100);return;}
    scrollToAyah(ayah);
  })();
}
// Скролл к аяту с ДО-выравниванием. В раскладке «Список» тела аятов
// гидратируются ЛЕНИВО (IntersectionObserver, скелет min-height:48px) и растут
// уже ПОСЛЕ первого скролла — блоки над целью раздуваются и сдвигают её вниз,
// поэтому одиночный scrollIntoView попадал на более ранний аят (напр. на 127
// вместо 143 при переходе из поиска). Повторяем скролл, пока верх цели не
// перестанет двигаться (гидратация соседей завершилась), и только тогда — flash.
function settleScroll(getEl,doScroll,onDone){
  let n=0,prev=null;
  (function step(){
    const el=getEl();
    if(!el){if(n++<25)setTimeout(step,120);return;}          // блок ещё не в DOM — ждём
    doScroll(el);
    const top=el.getBoundingClientRect().top;
    if((prev===null||Math.abs(top-prev)>2)&&n++<18){prev=top;setTimeout(step,55);return;}
    if(onDone)onDone(el);
  })();
}
// Переход к аяту в раскладке «Список»: центрируем блок (никогда не под липкой
// шапкой) до устаканивания, опц. подсветка. Общая точка для renderCenter и flashAyah.
function jumpToAyahEl(aid,flash){
  settleScroll(
    ()=>{const a=document.getElementById("readingArea");return a&&a.querySelector(`.ayah-block[data-aid="${aid}"]`);},
    el=>el.scrollIntoView({block:"center"}),
    flash?el=>{el.style.boxShadow="0 0 0 2px var(--accent)";setTimeout(()=>{el.style.boxShadow="";},2000);}:null
  );
}

// ROUTING — URL hash "#surah[:ayah]" + back button closes panels (mobile)

let pendingAyah=null;
// Which open panels should the Back button / backdrop close (overlays only; the desktop sidebar is docked)
function anyOverlayOpen(){return ST.rpanelOpen||ST.apanelOpen||ST.diafilm||hrOpen||ST.immersive||appAboutOpen()||progressOpen||spdOpen||!!STU||(isM()&&ST.sidebarOpen);}
let navBack=false; // true while we programmatically history.back() to consume our own overlay entry
function pushOverlay(){if(!(history.state&&history.state.ov))history.pushState({ov:1},"");}
function consumeOverlay(){if(history.state&&history.state.ov){navBack=true;history.back();}}
function updateBackdrop(){const b=document.getElementById("panelBackdrop");if(b)b.classList.toggle("show",ST.rpanelOpen||ST.apanelOpen);}
function closeAllPanelsUI(){
  if(appAboutOpen()){closeAbout();const ov=document.getElementById("aboutOvl");if(ov)ov.dataset.app="";}  // «Назад» (запись уже снята)
  if(progressOpen){const ov=document.getElementById("progressOvl");if(ov)ov.style.display="none";progressOpen=false;}  // «Назад» закрывает экран прогресса (запись истории уже снята)
  if(spdOpen){const ov=document.getElementById("speedOvl");if(ov)ov.style.display="none";spdOpen=false;}  // «Назад» закрывает экран скорости (активный замер-пилюля живёт дальше)

  if(hrOpen)hrStop(true);                // «Назад» выходит из hifz-ридера (запись уже снята)
  if(STU)closeStudy(true);               // «Назад» закрывает фокус-экран аята (запись уже снята)
  if(ST.immersive)exitImmersive(true);   // Back button leaves immersive (entry already popped)
  if(isM()&&ST.sidebarOpen){ST.sidebarOpen=false;document.getElementById("sidebar").classList.add("collapsed");}
  updateBackdrop();
}
function panelBackdrop(){const ov=history.state&&history.state.ov;closeAllPanelsUI();if(ov)consumeOverlay();}
function pushSurahHash(id){const h="#"+id;if(location.hash!==h)history.pushState({surah:id},"",h);}
function pushHomeHash(){const h="#home";if(location.hash!==h)history.pushState({home:true},"",h);}
function applyHash(initial){
  const raw=decodeURIComponent((location.hash||"").replace(/^#/,"")).trim();
  if(raw==="home"){                                  // явный «#home» (например, «назад» на Главную)
    ST.homeMode=true;ST.selectedTag=null;ST.topicSel=null;ST.rootView=null;ST.warnMap=null;ST.hifzMode=false;ST.eruditMode=false;ST.bmView=false;ST.notesView=false;if(!initial)render();return true;
  }
  if(raw==="warnmap"||raw.startsWith("warnmap=")){    // deep-link «Карта заблуждений»: #warnmap / #warnmap=<id>
    const wid=raw==="warnmap"?"*":raw.slice(8);
    // неизвестный/скрытый источник → общий индекс (для скрытых карта доступна только в dev-режиме)
    ST.warnMap=(wid!=="*"&&CONFIG.tafsirs&&CONFIG.tafsirs.find(t=>t.id===wid))?wid:"*";
    ST.selectedTag=null;ST.topicSel=null;ST.rootView=null;ST.bookIntro=false;ST.homeMode=false;
    ST.scanSource=null;ST.srcMode=false;ST.hifzMode=false;ST.eruditMode=false;ST.bmView=false;ST.notesView=false;
    if(!initial)render();return true;
  }
  const m=raw.match(/^(\d+)(?::(\d+))?$/);
  if(!m)return false;
  const sid=+m[1];
  if(!SURAHS.find(s=>s.id===sid))return false;
  const st=history.state;
  const hashAyah=m[2]?+m[2]:null;                                 // явный deep-link «#сура:аят»
  const stateAyah=(st&&st.surah===sid&&st.ayah)?st.ayah:null;     // позиция, запомненная при скролле → «назад»
  pendingAyah=hashAyah;
  const changing=(ST.surah!==sid||ST.selectedTag||ST.homeMode||ST.hifzMode||ST.bmView||ST.warnMap);
  if(changing){ST.surah=sid;ST.selectedTag=null;ST.topicSel=null;ST.rootView=null;ST.warnMap=null;ST.homeMode=false;ST.hifzMode=false;ST.eruditMode=false;ST.bmView=false;ST.notesView=false;}
  if(!hashAyah&&stateAyah&&(changing||initial))ST.scrollToAyah=stateAyah;  // встанем на аят при рендере (без анимации)
  if(hashAyah&&changing&&!initial)ST.scrollToAyah=hashAyah;       // иначе якорь той же суры вернёт старый аят
  if(changing&&!initial)render();
  if(hashAyah)flashAyah(hashAyah);                                // deep-link — плавно + подсветка
  else if(stateAyah&&!changing&&!initial)scrollToAyah(stateAyah); // та же сура уже отрисована — доскроллим
  return true;
}
function scrollToAyah(ayah){
  pendingAyah=null;
  jumpToAyahEl(ayah,true);
}
window.addEventListener("popstate",()=>{
  if(navBack){navBack=false;return;}          // this back() was our own overlay consume
  // «Назад» в РЕЖИМЕ хифза: подъём по уровням карты (аяты → суры → джузы;
  // проверка → карта); ov-запись уже снята этим back — возвращаем её, чтобы
  // следующий «Назад» тоже пришёл к нам. С уровня джузов — выход из режима
  // на экран, который описывает текущий хеш (#N или #home).
  // «Назад» в РЕЖИМЕ эрудита: сперва раунд → список упражнений, и только со
  // списка — выход из режима (как подъём по уровням карты хифза).
  if(ST.eruditMode){
    if(ERUDIT&&ERUDIT.back()){pushOverlay();return;}
    ST.eruditMode=false;
    applyHash(true);render();
    return;
  }
  if(ST.hifzMode){
    if(hifzZoomBack()){pushOverlay();return;}
    ST.hifzMode=false;
    applyHash(true);                          // выставить флаги по хешу без рендера…
    render();                                 // …и перерисовать всё разом
    return;
  }
  if(anyOverlayOpen()){closeAllPanelsUI();return;}
  applyHash(false);
});

// iOS/iPadOS (всегда WebKit, даже под видом «Chrome»): element-fullscreen хрупкий —
// вертикальный свайп с резиновым overscroll в момент отпускания пальца заставляет WebKit
// сам выйти из fullscreen, что через fullscreenchange выкидывало из режима чтения. iPadOS
// маскируется под Mac, поэтому проверяем ещё и тач-точки.
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
// Immersive reading: hide ALL app chrome (header, surah nav, picker, search, footer),
// leave only the reading field. Class-based so it works everywhere (incl. iOS); also
// requests browser fullscreen as a bonus where supported (но НЕ на iOS — см. выше).
// Exit via Back / Esc / ✕.
function toggleFullscreen(){if(ST.immersive)exitImmersive();else enterImmersive();}
function enterImmersive(){
  if(ST.immersive)return;
  ST.immersive=true;
  document.body.classList.add("immersive");
  pushOverlay();                                   // so the Back button leaves immersive
  if(!isIOS){
    const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(req)try{req.call(el);}catch(e){}            // best-effort true fullscreen (desktop)
  }
  syncFsBtn();refitIfPage();
}
function exitImmersive(viaBack){
  if(!ST.immersive)return;
  ST.immersive=false;
  document.body.classList.remove("immersive");
  const d=document,ex=d.exitFullscreen||d.webkitExitFullscreen;
  if((d.fullscreenElement||d.webkitFullscreenElement)&&ex)try{ex.call(d);}catch(e){}
  if(!viaBack)consumeOverlay();                    // pop our history entry (Back path already popped it)
  syncFsBtn();refitIfPage();
}
function syncFsBtn(){
  const b=document.getElementById("fsBtn");if(!b)return;
  b.classList.toggle("active",ST.immersive);
  b.title=ST.immersive?"Выйти из режима чтения":"Режим чтения (скрыть интерфейс)";
}
// If browser fullscreen is left via system gesture/Esc/F11, also leave immersive.
function onFsChange(){
  const on=!!(document.fullscreenElement||document.webkitFullscreenElement);
  if(!on&&ST.immersive)exitImmersive();
  syncFsBtn();
}

function bindNoTouchScroll(panel){
  panel.querySelectorAll(".nt-scroll").forEach(b=>{
    const dir=+b.dataset.dir;

      e.preventDefault();_ntMoved=false;
      _ntHoldT=setTimeout(()=>{               // удержание → плавная непрерывная прокрутка
        _ntMoved=true;
        const loop=()=>{const sc=ntScrollEl();if(sc)sc.scrollTop+=dir*10;_ntRAF=requestAnimationFrame(loop);};loop();

function bumpView(key,dir){

  // резервной копии): строка "1.2"+0.1 даёт NaN, кнопка «мертвеет» навсегда,
  // а calc(...*NaN) схлопывает текст — приводим к числу, иначе к дефолту
  const cur=parseFloat(ST[key]);
